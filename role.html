<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06110e">
<meta name="robots" content="noindex">
<title>Your Invitation · The Last Toast</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Pinyon+Script&family=Playfair+Display:ital,wght@0,400;1,400;1,500&family=Josefin+Sans:wght@300;400&display=swap" rel="stylesheet">
<script>document.write('<link rel="stylesheet" href="theme.css?v=' + Date.now() + '">');</script>
<style>
/* A personal role invitation: a sealed letter in candlelight. This page only. */
:root{
  --gold:#d8b878;--gold2:#f1dfb4;--gold-grad:linear-gradient(135deg,#fff3d6 0%,#e8cf9a 50%,#b8924a 100%);
  --text:#f3ead6;--muted:#bdb49e;--dim:#7f8c82;--ink:#1d2a25;--ink2:#4f5249;--emerald:#154236;--paper:#fbf7ec;
  --red:#b8404c;
  --sans:'Cormorant Garamond',Georgia,serif;--serif:'Playfair Display',Georgia,serif;--caps:'Josefin Sans',system-ui,sans-serif;
}
html,body{background:#06110e;min-height:100%}
body{margin:0;background:radial-gradient(120% 70% at 50% -8%,#1f4d40 0%,#0e2821 42%,#06110e 100%) fixed;color:var(--text);font-family:var(--sans);font-size:18px;overflow-x:hidden}
body::before{width:90vmin;height:90vmin;left:50%;top:-30vmin;margin-left:-45vmin;background:radial-gradient(circle,rgba(255,214,150,.18),rgba(232,207,154,.05) 40%,transparent 66%)}
body::after{display:none}
#embers{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#embers i{position:absolute;bottom:-12px;border-radius:50%;background:radial-gradient(circle,#ffe7b3,rgba(232,190,110,0) 70%);opacity:0;animation:ember linear infinite}
@keyframes ember{0%{opacity:0;transform:translate(0,0)}12%{opacity:.9}70%{opacity:.5}100%{opacity:0;transform:translate(var(--dx),-105vh)}}
#stage{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:28px 16px 40px;box-sizing:border-box}
.caps{font-family:var(--caps);font-weight:300;letter-spacing:.32em;text-transform:uppercase}
.fade{animation:fadeIn .9s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.msg{max-width:440px;text-align:center}
.msg h1{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(30px,8vw,42px);color:var(--gold2);margin:14px 0 8px}
.msg p{color:var(--muted);font-style:italic;font-size:19px;line-height:1.5;margin:0}
.spin{width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(232,207,154,.2);border-top-color:var(--gold);margin:0 auto;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- the envelope: ivory paper, a gold Art Deco liner, a satin ribbon and a wax seal ---------- */
.bloom{position:fixed;left:50%;top:50%;width:160vmin;height:160vmin;margin:-80vmin 0 0 -80vmin;border-radius:50%;pointer-events:none;z-index:0;background:radial-gradient(closest-side,rgba(255,226,170,.26),rgba(255,210,140,.09) 45%,transparent 72%);opacity:.75;transition:opacity 1.6s ease,transform 2s ease}
.scene.lit~.bloom,.bloom.lit{opacity:1;transform:scale(1.18)}
.bloom.soft{opacity:.65;animation:fadeIn 2s ease both}
.scene{position:relative;z-index:1;width:100%;max-width:520px;text-align:center;padding:4px 0 10px}
.env-head{position:relative;z-index:2;margin-bottom:clamp(14px,3.5vh,30px)}
.env-for{font-size:10.5px;letter-spacing:.42em;color:var(--gold);padding-left:.42em;animation:fadeIn 1.1s .25s both}
.env-name{display:inline-block;font-family:'Pinyon Script',var(--serif);font-weight:400;font-size:clamp(50px,14vw,76px);line-height:1.2;padding:0 .3em .05em;background:linear-gradient(180deg,#fff7df 15%,#ecd39c 55%,#b88f45 95%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 22px rgba(240,205,140,.28));clip-path:inset(0 100% 0 0);animation:write 2s .75s cubic-bezier(.5,.1,.35,1) forwards}
@keyframes write{to{clip-path:inset(0 0 0 0)}}
.env-float{position:relative;z-index:2;width:min(88vw,430px);margin:0 auto;animation:envIn 1.7s cubic-bezier(.2,.8,.2,1) both}
@keyframes envIn{from{opacity:0;transform:translateY(-46px) rotate(-6deg) scale(.93)}to{opacity:1;transform:none}}
.env-sway{animation:sway 6.5s 1.7s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7px) rotate(.55deg)}}
.env{position:relative;width:100%;height:0;padding-bottom:69%;cursor:pointer;perspective:1700px;-webkit-tap-highlight-color:transparent;outline:none}
.env>*{position:absolute}
.env-back{left:0;top:0;width:100%;height:100%;border-radius:7px;overflow:hidden;box-shadow:0 34px 80px rgba(0,0,0,.6),0 10px 22px rgba(0,0,0,.35);transition:opacity .9s ease,transform 1.1s cubic-bezier(.5,0,.3,1)}
.env svg{display:block;overflow:visible}
.env-back svg,.env-pocket{width:100%;height:100%}
.env-pocket{left:0;top:0;z-index:3;pointer-events:none;transition:opacity .9s ease,transform 1.1s cubic-bezier(.5,0,.3,1)}
/* the card inside */
.env-card{left:6.5%;right:6.5%;top:5%;height:88%;z-index:2;transition:transform 1.3s cubic-bezier(.22,.8,.25,1),opacity .6s}
.env-card .cc{position:absolute;inset:0;border-radius:3px;background:linear-gradient(180deg,#fffdf6,#f5ecd7);box-shadow:0 0 0 1.5px #c9a25a,0 6px 18px rgba(0,0,0,.22);display:flex;flex-direction:column;align-items:center;padding-top:7%;color:var(--emerald);transition:box-shadow 1s}
.env-card .cc::before{content:"";position:absolute;inset:7px;border:1px solid rgba(184,146,74,.6);border-radius:2px}
.env-card .cc svg{width:15%;max-width:54px;height:auto}
.env-card .ck{font-size:7.5px;letter-spacing:.38em;color:#8a6b2e;margin-top:6px;padding-left:.38em}
.env-card .ct{font-family:var(--serif);font-style:italic;font-size:clamp(21px,6vw,30px);line-height:1.15;margin-top:4px}
.env-card .cr{width:30%;height:1px;background:linear-gradient(90deg,transparent,#b8924a,transparent);margin:7px 0 6px}
.env-card .cs{font-size:8px;letter-spacing:.34em;color:#7d6128;padding-left:.34em}
/* the top flap: paper outside, gold liner inside; faces swap at the halfway point so it works on every phone */
.env-flap{left:0;top:0;width:100%;height:62%;z-index:4;transform-origin:50% 0;transition:transform 1s cubic-bezier(.45,.05,.45,1),z-index 0s .5s,opacity .8s}
.env-flap svg{position:absolute;left:0;top:0;width:100%;height:100%}
.env-flap .f-in{opacity:0}
/* the satin ribbon and the seal */
.ribbon{top:56.6%;height:7%;z-index:5;background:linear-gradient(180deg,#6f5320 0%,#d8b56c 22%,#fff1c8 44%,#e2c27c 60%,#a17d34 82%,#6f5320 100%);box-shadow:0 2px 5px rgba(60,40,10,.35)}
.ribbon::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,transparent 1px 4px);mix-blend-mode:overlay}
.ribbon.l{left:-1.2%;width:51.2%;border-radius:2px 0 0 2px}
.ribbon.r{right:-1.2%;width:51.2%;border-radius:0 2px 2px 0}
.seal{left:50%;top:60%;width:25%;height:0;padding-bottom:25%;transform:translate(-50%,-50%);z-index:6;transition:transform .28s ease}
.seal>*{position:absolute;left:0;top:0;width:100%;height:100%}
.seal .half{overflow:visible}
.seal .half svg{width:100%;height:100%}
.seal .half.l{clip-path:polygon(-20% -20%,52% -20%,52% 0,48% 26%,54% 44%,47% 62%,53% 80%,49% 100%,49% 125%,-20% 125%)}
.seal .half.r{clip-path:polygon(52% -20%,120% -20%,120% 125%,49% 125%,49% 100%,53% 80%,47% 62%,54% 44%,48% 26%,52% 0)}
.seal .crack path{fill:none;stroke:#ffe7ae;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:240;stroke-dashoffset:240;filter:drop-shadow(0 0 3px #ffcf70)}
.seal .glow{left:-45%;top:-45%;width:190%;height:190%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,210,140,.65),rgba(255,190,120,.2) 55%,transparent);opacity:0;transition:opacity .35s}
.seal .pulse{left:-12%;top:-12%;width:124%;height:124%;border-radius:50%;border:1px solid rgba(255,230,180,.6);animation:sealPulse 2.6s 2.2s ease-in-out infinite;opacity:0}
@keyframes sealPulse{0%,100%{transform:scale(.9);opacity:0}50%{transform:scale(1.05);opacity:1}}
.env-sheen{left:0;top:0;width:100%;height:100%;z-index:7;border-radius:7px;overflow:hidden;pointer-events:none}
.env-sheen::before{content:"";position:absolute;top:-30%;bottom:-30%;width:26%;left:-50%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.38),transparent);transform:skewX(-20deg);animation:sheen 5.5s 2.6s ease-in-out infinite}
@keyframes sheen{0%{left:-50%}38%,100%{left:135%}}
.env-shadow{position:absolute;left:9%;right:9%;bottom:-36px;height:28px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.6),transparent);filter:blur(5px);animation:shadowSway 6.5s 1.7s ease-in-out infinite;transition:opacity .7s}
@keyframes shadowSway{50%{transform:scaleX(.92);opacity:.75}}
.env-hint{position:relative;z-index:2;margin-top:clamp(34px,6vh,52px);font-style:italic;color:var(--muted);font-size:18.5px;animation:fadeIn 1s 2.4s both}
.env-hint .tapdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold2);box-shadow:0 0 12px var(--gold);margin-right:10px;vertical-align:middle;animation:tapdot 1.8s ease-in-out infinite}
@keyframes tapdot{50%{transform:scale(1.7);opacity:.35}}
/* opening, step by step */
.scene.go .env-head,.scene.go .env-hint{animation:fadeAway .55s ease forwards}
@keyframes fadeAway{to{opacity:0;transform:translateY(-8px)}}
.env.press .seal{transform:translate(-50%,-50%) scale(.92)}
.env.press .seal .glow{opacity:1}
.env.press .seal .pulse,.env.press .env-sheen{display:none}
.env.crack .seal .crack path{animation:crackDraw .42s ease-out forwards}
@keyframes crackDraw{to{stroke-dashoffset:0}}
.env.broken .seal .crack,.env.broken .seal .glow{opacity:0;transition:opacity .25s}
.env.broken .seal .half.l{animation:sealL 1.2s cubic-bezier(.45,0,.8,.55) forwards}
.env.broken .seal .half.r{animation:sealR 1.2s cubic-bezier(.45,0,.8,.55) forwards}
@keyframes sealL{0%{transform:none}14%{transform:translate(-9%,-4%) rotate(-9deg)}100%{transform:translate(-80%,360%) rotate(-120deg);opacity:0}}
@keyframes sealR{0%{transform:none}14%{transform:translate(9%,-3%) rotate(8deg)}100%{transform:translate(70%,380%) rotate(105deg);opacity:0}}
.env.broken .ribbon.l{animation:ribL 1.15s cubic-bezier(.5,0,.75,.5) forwards}
.env.broken .ribbon.r{animation:ribR 1.15s cubic-bezier(.5,0,.75,.5) forwards}
@keyframes ribL{25%{transform:translateX(-5%) rotate(-1.5deg)}100%{transform:translate(-26%,190px) rotate(-16deg);opacity:0}}
@keyframes ribR{25%{transform:translateX(5%) rotate(1.5deg)}100%{transform:translate(26%,200px) rotate(14deg);opacity:0}}
.env-float.jolt{animation:jolt .45s ease}
@keyframes jolt{30%{transform:translateY(5px) scale(.995)}65%{transform:translateY(-3px)}}
.env.open .env-flap{transform:rotateX(180deg);z-index:1}
.env.open .f-out{opacity:0;transition:opacity 0s .5s}
.env.open .f-in{opacity:1;transition:opacity 0s .5s}
.env.rise .env-card{transform:translateY(-64%)}
.env.rise .env-card .cc{box-shadow:0 0 0 1.5px #c9a25a,0 0 46px rgba(255,222,160,.5),0 12px 28px rgba(0,0,0,.3)}
.scene.present .env-sway,.scene.present .env-shadow{animation:none}
.scene.present .env-back,.scene.present .env-pocket{opacity:0;transform:translateY(90px)}
.scene.present .env-flap,.scene.present .env-shadow{opacity:0}
.scene.present .env-card{transform:translateY(-76%) scale(1.04);transition:transform .85s cubic-bezier(.4,0,.2,1)}
.env-card.ghost{position:fixed;z-index:60;margin:0;pointer-events:none;transition:opacity .5s ease}
/* gold dust and wax chips */
.dust{position:fixed;left:0;top:0;width:0;height:0;z-index:40;pointer-events:none}
.dust i{position:absolute;left:0;top:0;width:var(--s);height:var(--s);margin:calc(var(--s) / -2) 0 0 calc(var(--s) / -2);border-radius:50%;background:radial-gradient(circle,#fff6d8,#e8cf9a 45%,rgba(184,146,74,0) 72%);animation:burst var(--t) cubic-bezier(.15,.7,.3,1) forwards}
.dust i.star{border-radius:0;background:#fff3d6;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%)}
.dust i.chip{border-radius:42% 58% 52% 48%;background:radial-gradient(circle at 35% 30%,#d9606c,#8a1626 60%,#55091a);animation-timing-function:cubic-bezier(.3,.3,.6,1)}
@keyframes burst{0%{transform:translate(0,0) scale(.3) rotate(0);opacity:1}70%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1) rotate(200deg);opacity:0}}
.ring{position:fixed;z-index:39;pointer-events:none;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:1.5px solid rgba(255,226,160,.9);box-shadow:0 0 18px rgba(255,214,140,.7);animation:ring .95s ease-out forwards}
@keyframes ring{to{transform:scale(12);opacity:0;border-width:.4px}}
/* the letter rises out of the light */
.paper.unfold{animation:unfold 1.05s cubic-bezier(.2,.8,.2,1) both}
@keyframes unfold{from{opacity:0;transform:translateY(42px) scale(.94)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.env-float,.env-sway,.env-shadow,.env-sheen::before,.seal .pulse,.env-name{animation:none!important;clip-path:none!important}}
/* ---------- the letter ---------- */
.paper{position:relative;width:100%;max-width:580px;background:var(--paper);color:var(--ink);border-radius:6px;padding:46px 34px 34px;box-sizing:border-box;box-shadow:0 30px 80px rgba(0,0,0,.5);text-align:center}
.paper::before,.paper::after{content:"";position:absolute;pointer-events:none;border-radius:4px}
.paper::before{inset:12px;border:1.5px solid #b8924a}
.paper::after{inset:18px;border:1px solid rgba(184,146,74,.45)}
@media(max-width:480px){.paper{padding:42px 30px 30px}}
.paper .mono{display:block;margin:0 auto 14px;width:44px;height:44px}
.paper .dear{font-family:'Pinyon Script',var(--serif);font-weight:400;font-size:40px;line-height:1.1;color:var(--emerald);margin:0 0 12px;text-align:left}
.paper .thanks{text-align:left;font-size:19px;line-height:1.6;color:#2b302b;margin:0 0 6px}
.paper .sign{text-align:right;font-family:'Pinyon Script',var(--serif);font-size:32px;line-height:1.15;color:var(--emerald);margin:10px 0 0}
.paper .sign small{display:block;font-family:var(--sans);font-size:15px;color:var(--ink2);font-style:italic;line-height:1.2;margin-bottom:8px}
.orn{display:flex;align-items:center;gap:10px;width:200px;margin:26px auto}
.orn i{flex:1;height:1px;background:#c9ad73}.orn b{color:#8a6b2e;font-size:11px;font-weight:400}
.paper .congrats{font-size:11.5px;color:#7d6128;margin-bottom:10px;letter-spacing:.34em}
.cname{font-family:var(--serif);font-style:italic;font-size:clamp(34px,9vw,52px);line-height:1.08;color:var(--emerald);margin:4px 0 6px}
.cname span{display:inline-block;opacity:0;filter:blur(8px);transform:translateY(8px);animation:letter .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes letter{to{opacity:1;filter:none;transform:none}}
.ctitle{font-style:italic;font-size:19px;color:var(--ink2);margin-bottom:14px}
.cblurb{font-size:19px;line-height:1.55;color:#2b302b;max-width:440px;margin:0 auto}
.effort{display:flex;flex-direction:column;align-items:center;gap:6px;margin:22px auto 0;border:1px solid rgba(138,107,46,.4);border-radius:16px;padding:14px 18px;max-width:420px}
.effort .lbl{font-size:11px;color:#7d6128;letter-spacing:.3em}
.effort .pips{display:flex;gap:6px}
.effort .pips i{width:28px;height:6px;border-radius:999px;background:rgba(138,107,46,.2)}
.effort .pips i.on{background:linear-gradient(90deg,#b8924a,#e8cf9a)}
.effort b{font-family:var(--serif);font-style:italic;font-weight:400;font-size:22px;color:var(--emerald)}
.effort p{margin:0;font-size:17px;line-height:1.45;color:#2b302b}
.effort small{font-size:15px;color:var(--ink2);font-style:italic}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:26px}
.btn-gold{font-family:var(--sans);font-style:italic;font-weight:500;font-size:21px;border:0;border-radius:999px;padding:14px 22px;background:var(--gold-grad);color:#1b140a;cursor:pointer;box-shadow:0 10px 26px rgba(184,146,74,.3),inset 0 1px 0 rgba(255,255,255,.55);text-decoration:none;display:block;text-align:center}
.btn-gold:disabled{opacity:.45;cursor:not-allowed}
.btn-line{font-family:var(--sans);font-style:italic;font-size:19px;border:1px solid rgba(21,66,54,.35);border-radius:999px;padding:12px 20px;background:transparent;color:var(--emerald);cursor:pointer}
.btn-line:hover{background:rgba(21,66,54,.05)}
.btn-text{font-family:var(--sans);font-style:italic;font-size:17px;border:0;background:none;color:var(--ink2);cursor:pointer;text-decoration:underline;text-decoration-color:rgba(79,82,73,.4);text-underline-offset:4px;padding:6px}
.status{margin-top:22px;border-radius:14px;padding:12px 16px;font-size:17px;line-height:1.45;background:rgba(21,66,54,.06);border:1px solid rgba(21,66,54,.2);color:var(--emerald)}
.paper h2{font-family:var(--serif);font-style:italic;font-weight:400;font-size:30px;color:var(--emerald);margin:0 0 6px}
.paper .lead{font-style:italic;color:var(--ink2);font-size:18px;margin:0 0 18px}
.terms{list-style:none;margin:0 0 18px;padding:0;text-align:left}
.terms li{position:relative;padding:10px 0 10px 28px;border-top:1px solid rgba(138,107,46,.25);font-size:18px;line-height:1.45;color:#2b302b}
.terms li:first-child{border-top:0}
.terms li::before{content:"✦";position:absolute;left:4px;top:12px;font-size:11px;color:#8a6b2e}
.agree{display:flex;gap:12px;align-items:flex-start;text-align:left;font-size:18px;color:var(--emerald);margin:4px 0 18px;cursor:pointer}
.agree input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:#154236}
textarea.note{width:100%;box-sizing:border-box;min-height:96px;border:1px solid rgba(138,107,46,.45);border-radius:14px;padding:12px 14px;font-family:var(--sans);font-size:18px;background:#fffdf7;color:var(--ink);resize:vertical}
textarea.note:focus{outline:none;border-color:#154236;box-shadow:0 0 0 3px rgba(21,66,54,.12)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 12px}
.chips button{font-family:var(--sans);font-style:italic;font-size:16px;border:1px solid rgba(138,107,46,.45);border-radius:999px;padding:7px 14px;background:transparent;color:var(--emerald);cursor:pointer}
.chips button.on{background:var(--emerald);color:var(--paper);border-color:var(--emerald)}
.askline{margin-top:18px;text-align:center}
.threads:empty{display:none}
.paper .threads{margin-top:18px;text-align:left}
.paper .thr{border-top:1px solid rgba(138,107,46,.25);padding:12px 0}
.paper .thr small{display:block;font-family:var(--caps);font-size:10px;letter-spacing:.24em;color:#8a6b2e;text-transform:uppercase;margin-bottom:3px}
.paper .thr-q{font-size:17.5px;color:#2b302b;line-height:1.5;white-space:pre-line}
.paper .thr-r{margin-top:8px;border-left:2px solid #b8924a;padding:4px 0 4px 12px;font-style:italic;color:var(--emerald);font-size:17.5px;white-space:pre-line}
.paper .thr-w{margin-top:4px;font-style:italic;color:var(--ink2);font-size:15px}

/* ---------- the code word ---------- */
.vault{position:relative;width:100%;max-width:520px;text-align:center;border-radius:20px;padding:40px 26px 30px;box-sizing:border-box;background:linear-gradient(180deg,rgba(14,40,33,.92),rgba(6,17,14,.96));border:1px solid rgba(232,207,154,.4);box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(232,207,154,.12) inset}
.vault .k{font-size:11px;color:var(--gold)}
.vault .stamp{display:inline-block;margin:18px 0 6px;font-family:var(--caps);font-size:12px;letter-spacing:.32em;color:#9fd8b4;border:1.5px solid rgba(159,216,180,.6);border-radius:6px;padding:6px 12px;transform:rotate(-3deg) scale(1.6);opacity:0;animation:stamp .5s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes stamp{to{transform:rotate(-3deg) scale(1);opacity:1}}
.vault .who{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--gold2);margin:10px 0 18px}
.codebox{border:1px solid rgba(232,207,154,.35);border-radius:16px;padding:20px 10px;background:rgba(0,0,0,.25);margin:0 auto 10px}
.code{font-family:var(--caps);font-weight:400;font-size:clamp(22px,6.6vw,34px);letter-spacing:.14em;color:transparent;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;word-break:break-word;min-height:1.2em}
.code .sc{color:rgba(232,207,154,.45);-webkit-text-fill-color:rgba(232,207,154,.45)}
.vault .cap{font-size:11px;color:var(--muted);letter-spacing:.24em;margin-bottom:22px}
.vault .next{list-style:none;padding:0;margin:20px 0 0;text-align:left}
.vault .next li{position:relative;padding:8px 0 8px 26px;color:#e3d9c0;font-size:17.5px;line-height:1.45;border-top:1px solid rgba(232,207,154,.14)}
.vault .next li:first-child{border-top:0}
.vault .next li::before{content:"✦";position:absolute;left:4px;top:10px;font-size:10px;color:var(--gold)}
.vault .row{display:flex;flex-direction:column;gap:10px}
.vault .copy{font-family:var(--sans);font-style:italic;font-size:17px;border:1px solid rgba(232,207,154,.4);border-radius:999px;padding:10px 18px;background:transparent;color:var(--gold2);cursor:pointer}
.foot{position:relative;z-index:1;text-align:center;font-family:var(--caps);font-weight:300;font-size:9.5px;letter-spacing:.34em;color:var(--dim);padding:0 0 22px;text-transform:uppercase}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}#embers{display:none}}

</head>
<body>
<div id="embers" aria-hidden="true"></div>
<main id="stage"><div class="msg fade"><div class="spin"></div><p style="margin-top:16px">Unsealing your invitation…</p></div></main>
<div class="foot">Kane Oil &amp; Energy · A private invitation</div>
<script>/* always load the newest copy of these files (GitHub Pages lets browsers cache them for 10 minutes) */
['config.js', 'party.js', 'core.js'].forEach(f => document.write('<script src="' + f + '?v=' + Date.now() + '"><\/script>'));</script>
<script>
const MONO = c => `<svg class="mono" viewBox="0 0 96 96" fill="none" stroke="${c}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="48" cy="48" r="44" stroke-width="2"/><circle cx="48" cy="48" r="38" stroke-width="1"/><path d="M40 30 V66 M40 50 L58 30 M44 46 L60 66" stroke-width="3.4"/></svg>`;
const EFFORT = {
  big: { pips: 3, label: 'A leading role', text: "You're at the heart of the mystery: big secrets, people hunting you down, and a moment or two in the spotlight.", prep: 'Plan on about 20 minutes with your dossier before the party.' },
  medium: { pips: 2, label: 'A featured role', text: 'Real secrets to trade and people to find, at your own pace.', prep: 'About 10 to 15 minutes of reading beforehand.' },
  light: { pips: 1, label: 'A supporting role', text: "A few juicy secrets and a fun goal. Perfect if you'd rather watch the drama unfold than lead it.", prep: 'About 5 minutes of reading beforehand.' }
};
const stage = document.getElementById('stage');
const show = html => { stage.innerHTML = html; window.scrollTo(0, 0); };
let backend = null, S = null, INV = null, ID = '', ST = {}, swapPick = '';
const P = () => mergeParty(window.PARTY, S ? S.site : {});

/* candlelight embers */
(function () { const box = document.getElementById('embers'), n = innerWidth < 600 ? 12 : 20; for (let i = 0; i < n; i++) { const e = document.createElement('i'), s = 2 + Math.random() * 4; e.style.cssText = `left:${Math.random() * 100}%;width:${s}px;height:${s}px;--dx:${(Math.random() * 80 - 40).toFixed(0)}px;animation-duration:${14 + Math.random() * 16}s;animation-delay:${(Math.random() * 18).toFixed(1)}s`; box.appendChild(e); } })();

function fail(title, text) { show(`<div class="msg fade">${MONO('#e8cf9a').replace('class="mono"', 'class="mono" style="width:64px;height:64px;display:block;margin:0 auto"')}<h1>${esc(title)}</h1><p>${esc(text)}</p></div>`); }
/* the host's Guest View opens this page with ?preview=1: it shows everything but records nothing */
const PREVIEW = /[?&]preview=1/.test(location.search);
const status = async data => { if (PREVIEW) return true; if (backend.ensureAuth && !backend.uid) await backend.ensureAuth(); return backend.updateStrict(Object.fromEntries(Object.entries(data).map(([k, v]) => ['inviteStatus/' + ID + '/' + k, v]))); };

/* gold dust (and a few chips of wax) bursting from a point on the screen */
function burst(x, y, n = 40, reach = 1, chips = 0) {
  const box = document.createElement('div'); box.className = 'dust'; box.style.left = x + 'px'; box.style.top = y + 'px';
  for (let i = 0; i < n + chips; i++) {
    const p = document.createElement('i'), chip = i >= n, a = Math.random() * Math.PI * 2, d = (chip ? 40 + Math.random() * 90 : 50 + Math.random() * 170) * reach;
    if (chip) p.className = 'chip'; else if (Math.random() < .3) p.className = 'star';
    p.style.cssText = `--s:${(chip ? 4 + Math.random() * 5 : 2 + Math.random() * 5).toFixed(1)}px;--dx:${(Math.cos(a) * d).toFixed(0)}px;--dy:${(Math.sin(a) * d + (chip ? 140 : 50) * Math.random()).toFixed(0)}px;--t:${(chip ? 0.8 + Math.random() * .5 : 1 + Math.random() * 1).toFixed(2)}s`;
    box.appendChild(p);
  }
  const ring = document.createElement('div'); ring.className = 'ring'; ring.style.left = x + 'px'; ring.style.top = y + 'px';
  document.body.append(box, ring); setTimeout(() => { box.remove(); ring.remove(); }, 2400);
}
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (x) { } };

/* the envelope is drawn as vector art: one set of shared paints, then the paper, the liner, the flaps and the wax */
const ENV_DEFS = `<svg id="envDefs" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <linearGradient id="ePaper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf6ea"/><stop offset="1" stop-color="#ede2c8"/></linearGradient>
  <linearGradient id="eSideL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6efdd"/><stop offset="1" stop-color="#e3d5b5"/></linearGradient>
  <linearGradient id="eSideR" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#f6efdd"/><stop offset="1" stop-color="#e3d5b5"/></linearGradient>
  <linearGradient id="eBottom" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fcf7ea"/><stop offset="1" stop-color="#eee3c8"/></linearGradient>
  <linearGradient id="eFlap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f9f3e3"/><stop offset="1" stop-color="#ebdfc2"/></linearGradient>
  <linearGradient id="eDepth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".45"/><stop offset=".55" stop-color="#000" stop-opacity="0"/></linearGradient>
  <linearGradient id="eLinerShade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".05"/><stop offset="1" stop-color="#000" stop-opacity=".4"/></linearGradient>
  <linearGradient id="eGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a6b2e"/><stop offset=".28" stop-color="#e8cf9a"/><stop offset=".5" stop-color="#fff3d0"/><stop offset=".72" stop-color="#c9a25a"/><stop offset="1" stop-color="#8a6b2e"/></linearGradient>
  <pattern id="eDeco" width="120" height="70" patternUnits="userSpaceOnUse"><rect width="120" height="70" fill="#0d3a2e"/><path d="M0 70a60 60 0 0 1 120 0M-60 35a60 60 0 0 1 120 0M60 35a60 60 0 0 1 120 0" fill="none" stroke="#d4af67" stroke-width="2.6" opacity=".85"/><path d="M20 70a40 40 0 0 1 80 0M-40 35a40 40 0 0 1 80 0M80 35a40 40 0 0 1 80 0" fill="none" stroke="#c9a25a" stroke-width="1.6" opacity=".55"/><path d="M40 70a20 20 0 0 1 40 0M-20 35a20 20 0 0 1 40 0M100 35a20 20 0 0 1 40 0" fill="none" stroke="#c9a25a" stroke-width="1.2" opacity=".4"/></pattern>
  <pattern id="eLaid" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M0 4.5h9" stroke="#7a6640" stroke-width="1" opacity=".07"/></pattern>
  <radialGradient id="eWax" cx="36%" cy="30%" r="78%"><stop offset="0" stop-color="#ea8590"/><stop offset=".3" stop-color="#b92c3e"/><stop offset=".7" stop-color="#7b1122"/><stop offset="1" stop-color="#470711"/></radialGradient>
  <radialGradient id="eWaxIn" cx="50%" cy="40%" r="62%"><stop offset="0" stop-color="#a92335"/><stop offset="1" stop-color="#690d1b"/></radialGradient>
  <filter id="eWaxShadow" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#32050c" flood-opacity=".55"/><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#32050c" flood-opacity=".4"/></filter>
  <filter id="eFlapShadow" x="-5%" y="-5%" width="110%" height="130%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#3b2a10" flood-opacity=".3"/></filter>
  <filter id="eUpShadow" x="-5%" y="-15%" width="110%" height="130%"><feDropShadow dx="0" dy="-5" stdDeviation="7" flood-color="#3b2a10" flood-opacity=".22"/></filter>
</defs></svg>`;
const FLAP = 'M0 0H1450L770 588Q725 628 680 588Z';
const MARK = 'M-10-20V20M-10 4L13-20M-4 0L14 20';
const envBackSVG = () => `<svg viewBox="0 0 1450 1000" preserveAspectRatio="none" aria-hidden="true">
  <rect width="1450" height="1000" fill="url(#ePaper)"/>
  <rect x="34" y="26" width="1382" height="660" fill="url(#eDeco)"/>
  <rect x="34" y="26" width="1382" height="660" fill="none" stroke="url(#eGold)" stroke-width="4"/>
  <rect width="1450" height="1000" fill="url(#eDepth)"/>
  <rect x="2" y="2" width="1446" height="996" rx="12" fill="none" stroke="#9c8656" stroke-opacity=".35" stroke-width="4"/></svg>`;
const envPocketSVG = () => `<svg class="env-pocket" viewBox="0 0 1450 1000" preserveAspectRatio="none" aria-hidden="true">
  <polygon points="0,0 0,1000 708,548" fill="url(#eSideL)"/><polygon points="1450,0 1450,1000 742,548" fill="url(#eSideR)"/>
  <polygon points="0,0 0,1000 708,548" fill="url(#eLaid)"/><polygon points="1450,0 1450,1000 742,548" fill="url(#eLaid)"/>
  <path d="M0 1000L686 476Q725 446 764 476L1450 1000Z" fill="url(#eBottom)" filter="url(#eUpShadow)"/>
  <path d="M0 1000L686 476Q725 446 764 476L1450 1000Z" fill="url(#eLaid)"/>
  <path d="M58 1000L697 512Q725 490 753 512L1392 1000" fill="none" stroke="url(#eGold)" stroke-width="4"/>
  <path d="M590 846H690M760 846H860" stroke="url(#eGold)" stroke-width="2.5"/><path d="M725 834l9 12-9 12-9-12z" fill="url(#eGold)"/><text x="725" y="912" text-anchor="middle" font-family="Josefin Sans, sans-serif" font-weight="300" font-size="25" letter-spacing="13" fill="#9c7c3e">KANE OIL &amp; ENERGY</text>
  <rect x="2" y="2" width="1446" height="996" rx="12" fill="none" stroke="#9c8656" stroke-opacity=".35" stroke-width="4"/></svg>`;
const envFlapSVG = () => `<svg class="f-out" viewBox="0 0 1450 620" preserveAspectRatio="none" aria-hidden="true">
    <path d="${FLAP}" fill="url(#eFlap)" filter="url(#eFlapShadow)"/><path d="${FLAP}" fill="url(#eLaid)"/>
    <path d="M64 0L711 556Q725 568 739 556L1386 0" fill="none" stroke="url(#eGold)" stroke-width="4"/></svg>
  <svg class="f-in" viewBox="0 0 1450 620" preserveAspectRatio="none" aria-hidden="true">
    <path d="${FLAP}" fill="#f3ead4"/><path d="M34 0L708 568Q725 582 742 568L1416 0Z" fill="url(#eDeco)"/><path d="M34 0L708 568Q725 582 742 568L1416 0Z" fill="url(#eLinerShade)"/>
    <path d="M34 0L708 568Q725 582 742 568L1416 0" fill="none" stroke="url(#eGold)" stroke-width="4"/></svg>`;
/* the wax: an irregular puddle with a pressed rim, a bead border and the Kane monogram */
let WAX = null;
function waxSVG() {
  if (!WAX) {
    const n = 26, pts = []; for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2, r = 90 + Math.sin(i * 2.7) * 4.5 + Math.cos(i * 1.35) * 3.5; pts.push([100 + Math.cos(a) * r, 100 + Math.sin(a) * r]); }
    const mid = (p, q) => [((p[0] + q[0]) / 2).toFixed(1), ((p[1] + q[1]) / 2).toFixed(1)];
    let d = 'M' + mid(pts[n - 1], pts[0]).join(' ');
    for (let i = 0; i < n; i++) d += ` Q${pts[i][0].toFixed(1)} ${pts[i][1].toFixed(1)} ${mid(pts[i], pts[(i + 1) % n]).join(' ')}`;
    const K = 'M88 72V128M88 104L116 72M95 98L118 128';
    WAX = `<svg viewBox="0 0 200 200" aria-hidden="true"><path d="${d}Z" fill="url(#eWax)" filter="url(#eWaxShadow)"/>
      <circle cx="100" cy="100" r="64" fill="url(#eWaxIn)"/><circle cx="100" cy="100" r="64" fill="none" stroke="#3a050f" stroke-width="4.5" stroke-opacity=".45"/>
      <circle cx="98.4" cy="98.2" r="66.5" fill="none" stroke="#ffb0b8" stroke-width="2" stroke-opacity=".32"/>
      <circle cx="100" cy="100" r="55" fill="none" stroke="#f3c2ae" stroke-width="1.6" stroke-dasharray="1.6 5.2" stroke-opacity=".5"/>
      <g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="${K}" stroke="#40060f" stroke-width="10" stroke-opacity=".75" transform="translate(1.8 2.4)"/><path d="${K}" stroke="#a01e2f" stroke-width="9"/><path d="${K}" stroke="#ffc0c6" stroke-width="2.4" stroke-opacity=".5" transform="translate(-1.7 -1.9)"/></g>
      <ellipse cx="70" cy="56" rx="24" ry="9" fill="#fff" fill-opacity=".2" transform="rotate(-32 70 56)"/></svg>`;
  }
  return WAX;
}

/* 1. the sealed envelope: it drifts in on candlelight, you press the wax, it cracks, the ribbon falls away,
      the flap swings open on its gold lining, and the card rises out into the light */
function envelope() {
  if (!document.getElementById('envDefs')) document.body.insertAdjacentHTML('afterbegin', ENV_DEFS);
  const seal = waxSVG();
  show(`<div class="scene" id="scene">
    <div class="env-head"><div class="env-for caps">A private invitation for</div><div class="env-name">${esc(INV.g)}</div></div>
    <div class="env-float" id="envFloat"><div class="env-sway"><div class="env" id="env" role="button" tabindex="0" aria-label="Break the seal and open your invitation">
      <div class="env-back">${envBackSVG()}</div>
      <div class="env-card"><div class="cc">${MONO('#8a6b2e')}<div class="ck caps">Kane Oil &amp; Energy</div><div class="ct">${esc(P().title || 'The Last Toast')}</div><div class="cr"></div><div class="cs caps">Your role awaits</div></div></div>
      ${envPocketSVG()}
      <div class="env-flap">${envFlapSVG()}</div>
      <div class="ribbon l"></div><div class="ribbon r"></div>
      <div class="seal"><div class="glow"></div><div class="pulse"></div><div class="half l">${seal}</div><div class="half r">${seal}</div><svg class="crack" viewBox="0 0 200 200" aria-hidden="true"><path d="M104 0L96 52L108 88L94 124L106 160L98 200"/></svg></div>
      <div class="env-sheen"></div>
    </div></div><div class="env-shadow"></div></div>
    <div class="env-hint"><span class="tapdot"></span>Press the seal to open</div></div><div class="bloom" id="bloom"></div>`);
  const env = document.getElementById('env'), scene = document.getElementById('scene'), reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let started = false;
  const open = () => {
    if (started) return; started = true;
    if (reduce) { letter(true); return; }
    const sealAt = () => { const r = env.querySelector('.seal').getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
    // ease the gentle sway to a stop instead of letting it wobble while the envelope opens
    const sway = env.parentNode, now = getComputedStyle(sway).transform;
    sway.style.animation = 'none'; sway.style.transform = now === 'none' ? '' : now; void sway.offsetWidth; sway.style.transition = 'transform .45s ease'; sway.style.transform = 'none';
    scene.classList.add('go'); env.classList.add('press'); buzz(15);
    setTimeout(() => env.classList.add('crack'), 260);
    setTimeout(() => {
      const [x, y] = sealAt(); env.classList.add('broken'); document.getElementById('envFloat').classList.add('jolt'); document.getElementById('bloom').classList.add('lit');
      burst(x, y, 34, .85, 9); buzz([25, 35, 55]);
    }, 720);
    setTimeout(() => env.classList.add('open'), 1050);
    setTimeout(() => env.classList.add('rise'), 1850);
    setTimeout(() => scene.classList.add('present'), 3150);
    // the card grows straight into the letter: a copy of it fades out exactly where the letter fades in
    setTimeout(() => {
      const card = env.querySelector('.env-card'), from = card.getBoundingClientRect(), ghost = card.cloneNode(true);
      ghost.classList.add('ghost'); Object.assign(ghost.style, { left: from.left + 'px', top: from.top + 'px', width: from.width + 'px', height: from.height + 'px', right: 'auto', transform: 'none' });
      document.body.appendChild(ghost); letter(true, from);
      requestAnimationFrame(() => requestAnimationFrame(() => { ghost.style.opacity = '0'; })); setTimeout(() => ghost.remove(), 700);
    }, 3950);
  };
  env.addEventListener('click', open);
  env.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
}
/* 2. the letter: thanks, the role, and the choice */
function letter(fromEnvelope, fromRect) {
  const ef = EFFORT[INV.e] || EFFORT.medium, resp = ST.resp || '';
  const nameHTML = [...INV.n].map((ch, i) => `<span style="animation-delay:${(0.6 + i * 0.045).toFixed(2)}s">${ch === ' ' ? '&nbsp;' : esc(ch)}</span>`).join('');
  const when = ST.at ? new Date(ST.at).toLocaleDateString([], { month: 'long', day: 'numeric' }) : '';
  const choices = resp === 'accepted'
    ? `<div class="status">✓ You accepted this role${when ? ' on ' + esc(when) : ''}.</div><div class="choices"><button class="btn-gold" data-go="vault">Show my code word</button><button class="btn-text" data-go="decline">My plans changed: I can't make it</button></div>`
    : resp === 'declined'
    ? `<div class="status">You declined this invitation. Changed your mind? You can still accept, or ask for a different character.</div><div class="choices"><button class="btn-gold" data-go="terms">Accept the role</button><button class="btn-line" data-go="swap">Request a different character</button></div>`
    : `${resp === 'swap' ? `<div class="status">You asked for a different character${ST.note ? `: “${esc(ST.note)}”` : ''}. Your hosts will be in touch. You can still accept this one if you like.</div>` : ''}
       <div class="choices"><button class="btn-gold" data-go="terms">Accept the role</button><button class="btn-line" data-go="swap">Request a different character</button><button class="btn-text" data-go="decline">Decline the invitation</button></div>`;
  show(`${fromEnvelope ? '<div class="bloom soft"></div>' : ''}<article class="paper ${fromEnvelope ? (fromRect ? '' : 'unfold') : 'fade'}">${MONO('#8a6b2e')}
    <p class="dear">Dear ${esc(INV.g)},</p>
    <p class="thanks">${P().thanks ? esc(P().thanks).replace(/\n+/g, '<br>') : `Thank you for being part of <i>${esc(P().title || 'The Last Toast')}</i>. We've spent weeks building this night: the story, the secrets, and every clue hidden in every room. It only comes alive because of people like you who are willing to step into it. We can't wait to see what you do with your role.`}</p>
    <p class="sign"><small>With gratitude,</small>${esc(INV.from || 'Your hosts')}</p>
    <div class="orn"><i></i><b>✦</b><i></i></div>
    <div class="congrats caps">Congratulations. You have been assigned</div>
    <div class="cname">${nameHTML}</div>
    ${INV.t ? `<div class="ctitle">${esc(INV.t)}</div>` : ''}
    ${INV.b ? `<p class="cblurb">${esc(INV.b)}</p>` : ''}
    <div class="effort"><span class="lbl caps">Effort for the night</span><div class="pips">${[1, 2, 3].map(n => `<i class="${n <= ef.pips ? 'on' : ''}"></i>`).join('')}</div><b>${esc(ef.label)}</b><p>${esc(ef.text)}</p><small>${esc(ef.prep)}</small></div>
    ${choices}
    <div class="askline"><button class="btn-text" data-go="ask">Questions about your role? Ask your hosts</button></div></article>`);
  // grow the letter out of the card it came from (the card's exact spot and size on screen)
  if (fromRect && document.querySelector('.paper').animate) {
    const paper = document.querySelector('.paper'), to = paper.getBoundingClientRect(), s = fromRect.width / to.width;
    const dx = fromRect.left + fromRect.width / 2 - (to.left + to.width / 2), dy = fromRect.top - to.top;
    paper.style.transformOrigin = '50% 0';
    paper.animate([{ transform: `translate(${dx}px,${dy}px) scale(${s})`, opacity: 0 }, { opacity: 1, offset: .3 }, { transform: 'none', opacity: 1 }], { duration: 1050, easing: 'cubic-bezier(.22,.8,.24,1)' });
  }
  // a shower of gold over the name once it has written itself out
  if (fromEnvelope && !matchMedia('(prefers-reduced-motion: reduce)').matches) setTimeout(() => {
    const el = document.querySelector('.cname'); if (!el) return; const r = el.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, 26, .7); buzz([30, 40, 30]);
  }, (0.75 + [...INV.n].length * 0.045) * 1000);
}

/* 4. questions for the hosts: sealed, and the reply comes back to this device only */
function ask() {
  let pick = 'My role';
  show(`<article class="paper fade">${MONO('#8a6b2e')}<h2>Ask your hosts</h2><p class="lead">Only your hosts can read this. Their reply will appear right here.</p>
    <div class="chips" id="askChips">${['My role', 'My costume', 'The night itself', 'Something else'].map(c => `<button type="button" data-ask="${esc(c)}" class="${c === pick ? 'on' : ''}">${esc(c)}</button>`).join('')}</div>
    <textarea class="note" id="askNote" maxlength="800" placeholder="Ask away…"></textarea>
    <div class="choices"><button class="btn-gold" id="askBtn">Send to my hosts</button><button class="btn-text" data-go="${ST.resp === 'accepted' ? 'vault' : 'letter'}">Go back</button></div>
    <div class="threads" id="askThreads"></div></article>`);
  const chips = document.getElementById('askChips');
  chips.addEventListener('click', e => { const b = e.target.closest('[data-ask]'); if (!b) return; pick = b.dataset.ask; chips.querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.ask === pick)); });
  document.getElementById('askBtn').addEventListener('click', async e => {
    if (PREVIEW) { toast('Preview', 'Guests can ask their hosts a question from here.', 'ok'); return; }
    const text = document.getElementById('askNote').value.trim(); if (!text) { toast('Your question', 'Write your question first.', 'err'); return; }
    e.target.disabled = true; e.target.textContent = 'Sending…';
    try { await sendAsk(backend, { kind: 'question', where: 'role', name: INV.g, cid: INV.cid, cname: INV.n, topic: pick, text }); document.getElementById('askNote').value = ''; toast('Sent', 'Your hosts will reply here.', 'ok'); renderThreads(true); }
    catch (x) { toast("Couldn't send", 'Check your connection and try again.', 'err'); }
    e.target.disabled = false; e.target.textContent = 'Send to my hosts';
  });
  renderThreads(true);
}
let threadSig = null;
async function renderThreads(force) {
  const mine = myAsks(); if (!Object.keys(mine).length || !S) return;
  const sig = JSON.stringify(Object.keys(mine).map(id => [id, S.asks[id] ? Object.keys(S.asks[id].replies || {}) : 0, !!(S.asks[id] && S.asks[id].done)]));
  if (sig === threadSig && !force) return; threadSig = sig;
  const th = await myAskThreads(S), u = unseenReplies(th), box = document.getElementById('askThreads');
  if (box) { box.innerHTML = threadsHTML(th); u.mark(); }
  else if (u.fresh.length) toast('Your hosts replied', u.fresh[u.fresh.length - 1].text.slice(0, 140), 'ok', ask);
}

/* 3a. accepting: what it means */
function terms() {
  const p = P();
  show(`<article class="paper fade">${MONO('#8a6b2e')}<h2>Before you accept</h2><p class="lead">By accepting the role of <b>${esc(INV.n)}</b>, you agree to:</p>
    <ul class="terms">
      <li>Be ${p.venue ? 'at ' + esc(p.venue) + ' ' : ''}on <b>${esc(p.date || 'the night')}</b>${p.time ? ', ' + esc(p.time.replace(/^(\d)/, 'from $1')) : ''}, and stay through the final reveal.</li>
      <li>Read your dossier and your brief before the party.</li>
      <li>Keep your code word, your character and your secrets to yourself.</li>
      <li>Stay in character and play fair. It's a game: be kind, and no tampering with the database.</li>
      <li>Tell your hosts right away if your plans change, so your role can go to someone else.</li>
    </ul>
    <label class="agree"><input type="checkbox" id="agree"> <span>I agree, and I'll be there.</span></label>
    <div class="choices"><button class="btn-gold" id="acceptBtn" disabled>Accept &amp; reveal my code word</button><button class="btn-text" data-go="letter">Go back</button></div></article>`);
  const box = document.getElementById('agree'), btn = document.getElementById('acceptBtn');
  box.addEventListener('change', () => { btn.disabled = !box.checked; });
  btn.addEventListener('click', async () => {
    btn.disabled = true; btn.textContent = 'Sealing your acceptance…';
    try { await status({ resp: 'accepted', at: backend.TS(), note: null }); ST.resp = 'accepted'; ST.at = Date.now(); vault(true); }
    catch (e) { btn.disabled = false; btn.textContent = 'Accept & reveal my code word'; toast("Couldn't save", 'Check your connection and try again.', 'err'); }
  });
}

/* 3b. the code word, unscrambled */
function vault(first) {
  const p = P(), code = String(INV.code || '');
  show(`<section class="vault fade"><div class="k caps">Kane Oil &amp; Energy · Personnel Access</div>
    <div class="stamp">${first ? 'Role accepted' : 'Access granted'}</div>
    <div class="who">${esc(INV.n)}</div>
    <div class="codebox"><div class="code" id="code" aria-live="polite"></div></div>
    <div class="cap caps">Your secret code word</div>
    <div class="row"><a class="btn-gold" href="database.html#k=${encodeURIComponent(code)}">Enter the Kane Oil Database →</a><button class="copy" id="copyCode">Copy code word</button></div>
    <ul class="next">
      <li>It unlocks your dossier. Keep it to yourself: anyone with it can read your secrets.</li>
      <li><b>My File</b> is who you are. <b>Brief</b> is how to play: your goal, what to share, and your timeline.</li>
      <li>Plan a costume. The idea in your brief is only a suggestion, so make the character your own.</li>
      <li>Bring a charged phone${p.date ? ' on ' + esc(p.date) : ''}.</li>
    </ul><div class="askline"><button class="copy" data-go="ask">Questions? Ask your hosts</button></div>
    <div class="askline" style="margin-top:8px"><button class="btn-text" style="color:var(--muted)" data-go="decline">Plans changed? Let your hosts know you can't make it</button></div></section>`);
  document.getElementById('copyCode').addEventListener('click', async () => { const ok = await copyText(code); toast(ok ? 'Copied' : "Couldn't copy", ok ? 'Your code word is on your clipboard.' : 'Write it down instead.', ok ? 'ok' : 'err'); });
  // unscramble, one letter at a time
  const el = document.getElementById('code'), A = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789', reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { el.textContent = code; return; }
  let locked = 0, t = 0;
  const tick = () => {
    t++; if (t % 3 === 0 && locked < code.length) locked++;
    el.innerHTML = [...code].map((ch, i) => i < locked || /[^A-Z0-9]/i.test(ch) ? esc(ch) : `<span class="sc">${A[Math.floor(Math.random() * A.length)]}</span>`).join('');
    if (locked < code.length) setTimeout(tick, 45); else { el.textContent = code; try { navigator.vibrate && navigator.vibrate([30, 40, 60]); } catch (x) { } }
  };
  setTimeout(tick, 650);
}

/* 3c. a different character */
function swap() {
  swapPick = '';
  show(`<article class="paper fade">${MONO('#8a6b2e')}<h2>A different character?</h2><p class="lead">No problem at all. Tell your hosts what would suit you better.</p>
    <div class="chips" id="chips">${['Something smaller', 'Something bigger', 'A different kind of character'].map(c => `<button type="button" data-pick="${esc(c)}">${esc(c)}</button>`).join('')}</div>
    <textarea class="note" id="swapNote" maxlength="400" placeholder="Anything else? A type of character you'd love, or one you'd rather avoid…"></textarea>
    <div class="choices"><button class="btn-gold" id="swapBtn">Send my request</button><button class="btn-text" data-go="letter">Go back</button></div></article>`);
  document.getElementById('chips').addEventListener('click', e => { const b = e.target.closest('[data-pick]'); if (!b) return; swapPick = swapPick === b.dataset.pick ? '' : b.dataset.pick; document.querySelectorAll('#chips button').forEach(x => x.classList.toggle('on', x.dataset.pick === swapPick)); });
  document.getElementById('swapBtn').addEventListener('click', async e => {
    const note = [swapPick, document.getElementById('swapNote').value.trim()].filter(Boolean).join('. ');
    e.target.disabled = true;
    try { await status({ resp: 'swap', at: backend.TS(), note: note || null }); ST.resp = 'swap'; ST.note = note;
      show(`<div class="msg fade"><h1>Request received</h1><p>Thank you, ${esc(INV.g)}. Your hosts will find you another role and send you a new invitation.</p></div>`); }
    catch (x) { e.target.disabled = false; toast("Couldn't send", 'Check your connection and try again.', 'err'); }
  });
}

/* 3d. declining */
function decline() {
  show(`<article class="paper fade">${MONO('#8a6b2e')}<h2>${ST.resp === 'accepted' ? 'Can\'t make it after all?' : 'Decline the invitation?'}</h2><p class="lead">${ST.resp === 'accepted' ? `No problem, ${esc(INV.g)}, plans change. Your hosts will be told right away so your role can go to someone else.` : `We'll be sorry not to see you, ${esc(INV.g)}.`} If you'd like, leave your hosts a note.</p>
    <textarea class="note" id="decNote" maxlength="400" placeholder="Optional"></textarea>
    <div class="choices"><button class="btn-line" id="decBtn">${ST.resp === 'accepted' ? 'Yes, I can\'t make it' : 'Yes, decline the invitation'}</button><button class="btn-gold" data-go="letter">Go back</button></div></article>`);
  document.getElementById('decBtn').addEventListener('click', async e => {
    e.target.disabled = true; const note = document.getElementById('decNote').value.trim();
    try { await status({ resp: 'declined', at: backend.TS(), note: note || null }); ST.resp = 'declined'; ST.note = note;
      show(`<div class="msg fade"><h1>Thank you for letting us know</h1><p>We'll miss you, ${esc(INV.g)}. If anything changes, this link still works.</p><p style="margin-top:18px;font-family:var(--serif);color:var(--gold2)">${esc(INV.from || '')}</p></div>`); }
    catch (x) { e.target.disabled = false; toast("Couldn't send", 'Check your connection and try again.', 'err'); }
  });
}

addEventListener('hashchange', () => location.reload());
stage.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (!b) return; ({ letter: () => letter(), terms, swap, decline, ask, vault: () => vault(false) })[b.dataset.go](); });

(async () => {
  const m = location.hash.match(/^#([A-Za-z0-9]+)\.([A-Za-z0-9_-]{20,})$/);
  if (!m) return fail('This link is incomplete', 'Open the full link from your invitation message, or ask your hosts to send it again.');
  ID = m[1];
  if (!window.crypto || !crypto.subtle) return fail('Open this on a secure page', 'This invitation needs an https:// connection.');
  const timer = setTimeout(() => { if (!INV) fail("Couldn't connect", 'Check your internet connection and reload this page.'); }, 12000);
  backend = await connectBackend();
  let first = true;
  backend.on(async raw => {
    S = normRoot(raw);
    if (INV) renderThreads();
    if (!first) return; first = false;
    const blob = S.invites[ID];
    if (!blob) { clearTimeout(timer); return fail('This invitation is no longer active', 'Your hosts may have sent you a newer link. Check your messages, or ask them for a new one.'); }
    try { INV = await decryptJSON(await importInviteKey(m[2]), blob); }
    catch (e) { clearTimeout(timer); return fail('This link is not valid', 'Open the full link from your invitation message, or ask your hosts to send it again.'); }
    clearTimeout(timer);
    ST = Object.assign({}, S.inviteStatus[ID] || {});
    const upd = { last: backend.TS() }; if (!ST.opened) upd.opened = backend.TS(); status(upd).catch(e => console.warn('open status', e));
    document.title = 'For ' + INV.g + ' · ' + (P().title || 'The Last Toast');
    if (ST.resp === 'accepted') letter(); else envelope();
  });
})();
