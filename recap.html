<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06110e">
<title>The Case Files</title>
<meta name="description" content="The case files from The Last Toast.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Playfair+Display:ital,wght@0,400;1,400;1,500&family=Josefin+Sans:wght@300;400&display=swap" rel="stylesheet">
<script>document.write('<link rel="stylesheet" href="theme.css?v=' + Date.now() + '">');</script>
<style>
/* Candlelight, to match the invitation. This page only shows anything once the host publishes the case files. */
:root{
  --gold:#d8b878;--gold2:#f1dfb4;--gold-grad:linear-gradient(135deg,#fff3d6 0%,#e8cf9a 50%,#b8924a 100%);
  --text:#f3ead6;--muted:#bdb49e;--dim:#7f8c82;--line:rgba(232,207,154,.16);--line2:rgba(232,207,154,.3);
  --red:#e0707a;--red2:#f0a5ac;--green:#9fd8b4;
  --sans:'Cormorant Garamond',Georgia,serif;--serif:'Playfair Display',Georgia,serif;--caps:'Josefin Sans',system-ui,sans-serif;
}
html,body{background:#06110e}
body{background:radial-gradient(120% 70% at 50% -8%,#1f4d40 0%,#0e2821 42%,#06110e 100%) fixed;font-size:18px;color:var(--text);font-family:var(--sans)}
body::before{width:90vmin;height:90vmin;left:50%;top:-30vmin;margin-left:-45vmin;background:radial-gradient(circle,rgba(255,214,150,.18),rgba(232,207,154,.05) 40%,transparent 66%)}
body::after{display:none}
#app{max-width:880px;padding-top:0;padding-bottom:40px}
.nav{display:flex;align-items:center;gap:12px;padding:14px 4px;position:sticky;top:0;z-index:20;background:linear-gradient(180deg,rgba(6,17,14,.92),rgba(6,17,14,.6) 70%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.nav svg{width:30px;height:30px;flex:none}
.nav b{flex:1;font-family:var(--caps);font-weight:300;font-size:10.5px;letter-spacing:.34em;color:var(--gold2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.nav a{font-family:var(--caps);font-size:10.5px;letter-spacing:.24em;color:var(--muted);text-decoration:none;padding:8px 6px;text-transform:uppercase}
.nav a:hover{color:var(--gold2)}
.caps{font-family:var(--caps);font-weight:300;letter-spacing:.32em;text-transform:uppercase}
.hero{text-align:center;padding:6vh 0 4vh}
.hero .k{font-family:var(--caps);font-weight:300;font-size:11px;letter-spacing:.42em;color:var(--gold);text-transform:uppercase}
.hero h1{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(48px,12vw,92px);line-height:1;margin:14px 0 6px;background:linear-gradient(180deg,#fff6dd 10%,#e8cf9a 55%,#b8924a);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .d{font-style:italic;color:var(--muted);font-size:20px}
.orn{display:flex;align-items:center;gap:10px;width:min(64%,300px);margin:22px auto 0}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(232,207,154,.6))}
.orn::after{background:linear-gradient(90deg,rgba(232,207,154,.6),transparent)}
.orn i{color:var(--gold);font-style:normal;font-size:12px}
.panel{background:linear-gradient(180deg,rgba(14,40,33,.62),rgba(8,24,20,.5));border:1px solid var(--line);border-radius:26px;padding:28px 24px;margin-bottom:18px;box-shadow:0 24px 60px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,248,230,.06);animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.panel::before{background:linear-gradient(90deg,transparent,rgba(241,223,180,.55),transparent)}
.panel.gold{border-color:rgba(232,207,154,.32)}
h2.sh{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(28px,7vw,38px);margin:0 0 18px;text-align:center;color:var(--gold2)}
h2.sh::after{content:"✦";display:block;font-style:normal;font-size:11px;color:var(--gold);margin-top:8px}
/* the killer */
.killer{text-align:center;border-color:rgba(224,112,122,.4);background:radial-gradient(120% 90% at 50% 0%,rgba(90,14,26,.55),rgba(8,24,20,.55))}
.killer .kn{font-family:var(--serif);font-size:clamp(38px,9vw,68px);line-height:1.05;color:#fff;text-shadow:0 0 40px rgba(224,112,122,.6);margin:6px 0 4px}
.killer .al{font-style:italic;color:var(--gold2);font-size:22px}
.killer .vl{margin:18px 0 0;font-size:21px;font-weight:600}
.killer .sum{max-width:62ch;margin:16px auto 0;font-size:19.5px;line-height:1.7;color:#ece3cc;text-align:left}
.killer .sol{margin-top:18px;font-family:var(--caps);font-weight:300;font-size:11px;letter-spacing:.2em;color:var(--green);text-transform:uppercase;line-height:2}
.killer .sol span{color:var(--muted)}
/* tally */
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:minmax(0,38%) 1fr 34px;gap:12px;align-items:center;font-size:19px}
.bar .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.bar .t{height:12px;border-radius:999px;background:rgba(255,248,230,.07);overflow:hidden;border:1px solid var(--line)}
.bar .f{height:100%;border-radius:999px;background:linear-gradient(90deg,#6c5a3a,#cdb88a)}
.bar.lead .f{background:var(--gold-grad)}
.bar.lead .n{color:var(--gold2)}
.bar .c{font-family:var(--caps);text-align:right;color:var(--muted)}
@media(max-width:520px){.bar{grid-template-columns:1fr 34px}.bar .t{grid-column:1/-1;order:3}}
/* honors */
.honors{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.hon{border:1px solid var(--line2);border-radius:20px;padding:16px;text-align:center;background:rgba(255,248,230,.03)}
.hon b{display:block;font-family:var(--caps);font-weight:300;font-size:10px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase;margin-bottom:8px}
.hon span{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--gold2)}
/* confessions */
.conf{list-style:none;margin:0;padding:0;counter-reset:c}
.conf li{counter-increment:c;display:grid;grid-template-columns:40px 1fr;gap:10px;padding:16px 0;border-top:1px solid var(--line)}
.conf li:first-child{border-top:0}
.conf li::before{content:counter(c,upper-roman);font-family:var(--serif);font-style:italic;color:var(--gold);font-size:20px;text-align:right;padding-right:4px}
.conf b{display:block;font-size:20px;margin-bottom:4px}
.conf q{display:block;font-style:italic;color:#e3d9c0;font-size:19px;line-height:1.6;quotes:"“" "”"}
.conf .lie{display:inline-block;margin-left:8px;font-family:var(--caps);font-style:normal;font-size:9.5px;letter-spacing:.24em;color:var(--red2);border:1px solid rgba(224,112,122,.5);border-radius:999px;padding:3px 9px;vertical-align:3px}
/* cast */
.cast{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.who{border:1px solid var(--line);border-radius:20px;padding:16px 16px 12px;background:rgba(255,248,230,.03)}
.who.k{border-color:rgba(224,112,122,.5)}
.who .nm{font-size:20px;font-weight:600;line-height:1.25}
.who .oc{color:var(--muted);font-style:italic;font-size:16.5px;margin-top:2px}
.who .pl{font-family:var(--caps);font-weight:300;font-size:10px;letter-spacing:.24em;color:var(--gold);text-transform:uppercase;margin-top:8px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-family:var(--caps);font-size:9px;letter-spacing:.22em;border-radius:999px;padding:3px 9px;border:1px solid var(--line2);color:var(--muted);text-transform:uppercase}
.tag.r{color:var(--red2);border-color:rgba(224,112,122,.5)}.tag.g{color:var(--gold2);border-color:rgba(232,207,154,.5)}
details summary{cursor:pointer;list-style:none;font-style:italic;color:var(--gold2);font-size:16.5px;margin-top:10px}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"✦ ";font-style:normal;font-size:10px;color:var(--gold)}
details[open] summary::before{content:"✧ "}
details p{margin:8px 0 0;font-size:17px;line-height:1.6;color:#e3d9c0}
/* evidence */
.ev{border-top:1px solid var(--line);padding:12px 0}
.ev:first-child{border-top:0}
.ev summary{margin:0;font-style:normal;color:var(--text);font-size:19px;font-weight:600}
.ev summary small{display:block;font-weight:400;font-style:italic;color:var(--muted);font-size:15.5px;margin-left:16px}
.ev p{white-space:pre-line}
.note{font-size:19.5px;line-height:1.7;color:#ece3cc;white-space:pre-line;text-align:center;font-style:italic}
.album{text-align:center;margin-top:16px}
.btn.gold{font-family:var(--sans);font-style:italic;font-weight:500;font-size:20px;letter-spacing:0;border-radius:999px;padding:13px 26px;background:var(--gold-grad);color:#1b140a;border:0;text-decoration:none;display:inline-flex;box-shadow:0 10px 30px rgba(232,207,154,.25)}
/* sealed */
.sealed{text-align:center;padding:14vh 0 10vh}
.sealed .wax{width:110px;height:110px;margin:0 auto 22px;border-radius:50%;background:radial-gradient(circle at 38% 34%,#b8404c,#6e1420 70%);display:grid;place-items:center;box-shadow:0 12px 40px rgba(110,20,32,.5),inset 0 -6px 14px rgba(0,0,0,.35)}
.sealed .wax svg{width:58%;height:58%}
.sealed h1{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(36px,9vw,58px);margin:0;color:var(--gold2)}
.sealed p{color:var(--muted);font-style:italic;font-size:20px;margin:12px auto 0;max-width:30ch;line-height:1.5}
.sealed a{display:inline-block;margin-top:26px;color:var(--gold2);font-style:italic;font-size:18px}
footer{text-align:center;font-family:var(--caps);font-weight:300;font-size:9.5px;letter-spacing:.34em;color:var(--dim);padding:26px 0 10px;text-transform:uppercase}
@media(min-width:900px){.panel{padding:40px 48px}}
</style>
</head>
<body>
<div id="app">
  <nav class="nav">
    <svg viewBox="0 0 96 96"><circle cx="48" cy="48" r="44" fill="none" stroke="#e8cf9a" stroke-width="2"/><path d="M40 30 V66 M40 50 L58 30 M44 46 L60 66" fill="none" stroke="#e8cf9a" stroke-width="4" stroke-linecap="round"/></svg>
    <b>Kane Oil &amp; Energy · Case Files</b>
    <a href="index.html">Invitation</a>
  </nav>
  <main id="out"><div class="sealed"><p>Opening the file…</p></div></main>
  <footer>Kane Oil &amp; Energy · Est. 1974 · A private event</footer>
</div>
<script>/* always load the newest copy of these files (GitHub Pages lets browsers cache them for 10 minutes) */
['config.js', 'party.js', 'core.js'].forEach(f => document.write('<script src="' + f + '?v=' + Date.now() + '"><\/script>'));</script>
<script>
const SEAL = `<svg viewBox="0 0 96 96"><path d="M40 30 V66 M40 50 L58 30 M44 46 L60 66" fill="none" stroke="#f1dfb4" stroke-width="5" stroke-linecap="round"/></svg>`;
let lastSig = null;
function sealed() {
  return `<div class="sealed"><div class="wax">${SEAL}</div><h1>The case files are sealed</h1><p>They open once the case is closed. Check back after the party.</p><a href="index.html">← Back to the invitation</a></div>`;
}
const list = v => Array.isArray(v) ? v : v ? Object.values(v) : [];
function page(R) {
  const tally = list(R.tally), max = tally.length ? tally[0][1] : 0, aw = R.awards || {}, sol = list(R.solvers);
  const honors = [['best', 'Best performance'], ['dressed', 'Best dressed'], ['detective', 'Best detective'], ['liar', 'Best liar']].filter(([k]) => aw[k]);
  const k = R.killer || {};
  return `<header class="hero"><div class="k">Case closed</div><h1>${esc(R.title || 'The Last Toast')}</h1>${R.date ? `<div class="d">${esc(R.date)}</div>` : ''}<div class="orn"><i>✦</i></div></header>
  <section class="panel killer"><div class="caps" style="font-size:11px;color:var(--red2)">The killer was</div>
    <div class="kn">${esc(k.name || 'Unknown')}</div>${k.alias ? `<div class="al">${esc(k.alias)}</div>` : ''}
    <div class="vl">${R.caught ? 'The room caught the killer.' : R.accused ? `The room accused ${esc(R.accused)}. The killer walked free.` : ''}</div>
    ${k.summary ? `<p class="sum">${esc(k.summary)}</p>` : ''}
    <div class="sol">${sol.length ? `<span>Solved by</span><br>${sol.map(esc).join(' · ')}` : 'Nobody named the killer.'}</div></section>
  ${tally.length ? `<section class="panel"><h2 class="sh">The accusation</h2><div class="bars">${tally.map(([n, c]) => `<div class="bar ${c === max ? 'lead' : ''}"><span class="n">${esc(n)}</span><div class="t"><div class="f" style="width:${Math.round(c / max * 100)}%"></div></div><span class="c">${c}</span></div>`).join('')}</div></section>` : ''}
  ${honors.length ? `<section class="panel gold"><h2 class="sh">Honors of the evening</h2><div class="honors">${honors.map(([key, l]) => `<div class="hon"><b>${l}</b><span>${esc(aw[key])}</span></div>`).join('')}</div></section>` : ''}
  ${list(R.confessions).length ? `<section class="panel"><h2 class="sh">The confessions</h2><ol class="conf">${list(R.confessions).map(c => `<li><div><b>${esc(c.name)}${c.lie ? '<span class="lie">A lie</span>' : ''}</b><q>${esc(c.text)}</q></div></li>`).join('')}</ol></section>` : ''}
  ${list(R.cast).length ? `<section class="panel"><h2 class="sh">Who everyone really was</h2><div class="cast">${list(R.cast).map(c => `<div class="who ${c.killer ? 'k' : ''}"><div class="nm">${esc(c.name)}</div><div class="oc">${esc(c.occ || '')}</div>${c.player ? `<div class="pl">Played by ${esc(c.player)}</div>` : ''}
      ${c.killer || c.died || c.inspector ? `<div class="tags">${c.killer ? '<span class="tag r">The killer</span>' : ''}${c.died ? '<span class="tag r">Died tonight</span>' : ''}${c.inspector ? '<span class="tag g">The Inspector</span>' : ''}</div>` : ''}
      ${c.secret ? `<details><summary>Their secret</summary><p>${esc(c.secret)}</p></details>` : ''}</div>`).join('')}</div></section>` : ''}
  ${list(R.evidence).length ? `<section class="panel"><h2 class="sh">The evidence</h2>${list(R.evidence).map(e => `<details class="ev"><summary>${esc(e.title)}${e.src ? `<small>${esc(e.src)}</small>` : ''}</summary><p>${esc(e.body || '')}</p></details>`).join('')}</section>` : ''}
  ${R.note || R.album ? `<section class="panel gold"><h2 class="sh">From your hosts</h2>${R.note ? `<p class="note">${esc(R.note)}</p>` : ''}${R.album && /^https:\/\//i.test(R.album) ? `<div class="album"><a class="btn gold" href="${esc(R.album)}" target="_blank" rel="noopener">See the photos →</a></div>` : ''}</section>` : ''}`;
}
function render(S) {
  const R = S.site && S.site.recap, sig = JSON.stringify(R || null);
  if (sig === lastSig) return; lastSig = sig;
  document.title = R ? (R.title || 'The Last Toast') + ' · Case Files' : 'The Case Files';
  $('#out').innerHTML = R ? page(R) : sealed();
}
(async () => {
  const backend = await connectBackend();
  backend.on(raw => render(normRoot(raw)));
})();
</script>
</body>
</html>
