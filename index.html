<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kane Oil Database</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<!--
  ============================================================================
  KANE OIL DATABASE — "THE LAST TOAST" murder mystery companion app
  ============================================================================
  SETUP (read before party night)
  1. Out of the box this runs in LOCAL mode: state lives in this browser's
     localStorage and syncs instantly between tabs on the SAME device.
     Perfect for rehearsing. It does NOT sync between different phones.
  2. For the real party (many phones), create a free Firebase project:
       console.firebase.google.com → Add project → Build → Realtime Database
       → Create database → Start in *test mode*.
       Project settings → General → Your apps → Web (</>) → copy firebaseConfig.
     Paste that object into CONFIG.FIREBASE below (replace null).
     Make sure it includes "databaseURL".
  3. Paste this whole file into Google Sites → Insert → Embed → Embed code.
  Master host code: CONFIG.ADMIN_CODE (default ADMIN2026).
  ============================================================================
-->
<style>
:root{
  --bg:#03050b;--bg2:#070c18;
  --panel:rgba(11,19,37,.82);--panel-solid:#0a1222;--panel-hi:rgba(18,30,56,.9);
  --line:rgba(88,140,255,.16);--line2:rgba(88,140,255,.34);
  --blue:#3d8bff;--cyan:#5ad6ff;
  --gold:#d9b25b;--gold2:#f5dc93;--gold-dim:rgba(217,178,91,.14);
  --red:#ff3b54;--red2:#ff8494;--red-dim:rgba(255,59,84,.14);
  --green:#2fe39b;
  --text:#e8eefa;--muted:#94a3c2;--dim:#5d6c8c;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{
  background:
    radial-gradient(1100px 600px at 85% -10%,rgba(61,139,255,.18),transparent 60%),
    radial-gradient(900px 520px at -10% 110%,rgba(217,178,91,.10),transparent 60%),
    var(--bg);
  background-attachment:fixed;overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(88,140,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(88,140,255,.055) 1px,transparent 1px);
  background-size:42px 42px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 25%,transparent 78%);mask-image:radial-gradient(ellipse at 50% 30%,#000 25%,transparent 78%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px)}
#app{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:16px 16px 96px}
button{font:inherit;color:inherit}
.mono{font-family:var(--mono)}
.hidden{display:none!important}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:12px;padding:10px 14px;margin-bottom:16px;border:1px solid var(--line);border-radius:var(--r);
  background:linear-gradient(180deg,rgba(14,24,46,.9),rgba(8,14,28,.85));box-shadow:0 0 0 1px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);position:sticky;top:8px;z-index:20;backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand svg{flex:none;filter:drop-shadow(0 0 8px rgba(217,178,91,.5))}
.brand b{display:block;font-size:13px;letter-spacing:.18em;font-weight:800;color:var(--gold2);white-space:nowrap}
.brand small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;padding:5px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.chip .d{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.chip.warn .d{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.chip.bad .d{background:var(--red);box-shadow:0 0 8px var(--red)}
.iconbtn{border:1px solid var(--line2);background:transparent;border-radius:10px;padding:7px 10px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--muted);cursor:pointer}
.iconbtn:hover{color:var(--text);border-color:var(--gold)}

/* ---------- panels ---------- */
.panel{position:relative;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:18px;margin-bottom:16px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 12px 34px rgba(0,0,0,.35);backdrop-filter:blur(6px)}
.panel::before{content:"";position:absolute;left:14px;right:14px;top:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(90,214,255,.55),transparent)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px}
.ph h2{margin:0;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold2);display:flex;align-items:center;gap:8px}
.ph h2::before{content:"";width:6px;height:6px;background:var(--gold);box-shadow:0 0 10px var(--gold);transform:rotate(45deg)}
.ph .sub{font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.08em}
.panel.red{border-color:rgba(255,59,84,.45);background:linear-gradient(180deg,rgba(60,8,18,.8),rgba(20,6,12,.85));box-shadow:0 0 40px rgba(255,59,84,.18),inset 0 0 40px rgba(255,59,84,.06)}
.panel.red::before{background:linear-gradient(90deg,transparent,var(--red),transparent)}
.panel.red .ph h2{color:var(--red2)}.panel.red .ph h2::before{background:var(--red);box-shadow:0 0 10px var(--red)}
.panel.gold{border-color:rgba(217,178,91,.45);box-shadow:0 0 34px rgba(217,178,91,.12)}
.panel.gold::before{background:linear-gradient(90deg,transparent,var(--gold),transparent)}

/* ---------- buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:rgba(61,139,255,.08);color:var(--text);
  border-radius:11px;padding:12px 16px;font-weight:700;font-size:14px;letter-spacing:.04em;cursor:pointer;transition:.15s;min-height:46px}
.btn:hover{border-color:var(--cyan);box-shadow:0 0 18px rgba(90,214,255,.18)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.gold{background:linear-gradient(180deg,#f0d487,#c79b3f);color:#1a1204;border-color:#f5dc93;box-shadow:0 0 22px rgba(217,178,91,.3)}
.btn.gold:hover{box-shadow:0 0 30px rgba(217,178,91,.5)}
.btn.danger{background:linear-gradient(180deg,#ff5068,#c21c35);border-color:#ff8494;color:#fff;box-shadow:0 0 22px rgba(255,59,84,.35)}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 11px;min-height:34px;font-size:12px;border-radius:9px}
.btn.block{width:100%}
label.lbl{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin:0 0 7px}
.input,select.input,textarea.input{width:100%;background:rgba(3,7,16,.8);border:1px solid var(--line2);border-radius:11px;color:var(--text);
  padding:12px 14px;font-size:16px;font-family:var(--sans);outline:none;transition:.15s}
select.input{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);
  background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
select.input option,select.input optgroup{background:#0a1222;color:var(--text)}
textarea.input{min-height:110px;resize:vertical;line-height:1.5}
.input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,178,91,.15),0 0 18px rgba(217,178,91,.15)}
.row-gap{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{margin-bottom:14px}
.note{font-size:13px;color:var(--muted);line-height:1.5}
.divider{height:1px;background:var(--line);margin:16px 0}

/* ---------- login ---------- */
.login-wrap{min-height:calc(100vh - 40px);display:flex;align-items:center;justify-content:center;padding:20px 0}
.login{width:100%;max-width:440px;text-align:center}
.login .logo{margin:0 auto 14px;width:84px;height:84px;filter:drop-shadow(0 0 18px rgba(217,178,91,.55));animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-4px)}}
.login h1{margin:0;font-size:24px;letter-spacing:.24em;font-weight:800;color:var(--gold2);text-shadow:0 0 22px rgba(217,178,91,.35)}
.login .tag{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--cyan);margin:6px 0 20px;text-transform:uppercase}
.term{text-align:left;font-family:var(--mono);font-size:12px;line-height:1.7;color:#7fb2ff;background:rgba(2,6,14,.85);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:16px;min-height:112px}
.term .ok{color:var(--green)}.term .gold{color:var(--gold2)}.term .err{color:var(--red2)}
.term .cursor{display:inline-block;width:8px;height:14px;background:var(--cyan);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.code-input{text-align:center;letter-spacing:.3em;font-family:var(--mono);font-size:20px;text-transform:uppercase;font-weight:700}
.login .foot{margin-top:18px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--dim)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.login-err{color:var(--red2);font-family:var(--mono);font-size:12px;letter-spacing:.1em;min-height:18px;margin-top:10px}

/* ---------- dossier ---------- */
.dhead{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.hex{width:78px;height:88px;position:relative;display:grid;place-items:center;flex:none}
.hex svg{position:absolute;inset:0}
.hex span{position:relative;font-weight:800;font-size:24px;letter-spacing:.04em;color:var(--gold2);text-shadow:0 0 12px rgba(217,178,91,.6)}
.dname{margin:0;font-size:clamp(22px,5.4vw,32px);line-height:1.1;font-weight:800;letter-spacing:-.01em}
.dmeta{margin-top:6px;font-size:14px;color:var(--muted)}
.cls{display:inline-block;margin-top:10px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;padding:5px 9px;border-radius:7px;border:1px solid rgba(217,178,91,.45);color:var(--gold2);background:var(--gold-dim);line-height:1.4}
.cls.red{border-color:rgba(255,59,84,.6);color:var(--red2);background:var(--red-dim);box-shadow:0 0 16px rgba(255,59,84,.25)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:16px}
.kv div{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:rgba(3,7,16,.5)}
.kv b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--dim);font-weight:500;margin-bottom:3px;text-transform:uppercase}
.kv span{font-size:14px;font-weight:600}
.sec{padding:16px 0;border-top:1px dashed rgba(88,140,255,.18)}
.sec:first-child{border-top:0}
.sec h3{margin:0 0 8px;font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700}
.sec p{margin:0;font-size:16.5px;line-height:1.7;color:#dbe4f4;max-width:72ch}
.sec.key{background:linear-gradient(90deg,rgba(217,178,91,.08),transparent);border-left:2px solid var(--gold);padding-left:14px;margin:0 -2px;border-top:0;border-radius:0 8px 8px 0}
.sec.key h3{color:var(--gold2)}
.sec.role p{font-style:italic;color:var(--muted)}
.sealed{border:1px solid rgba(255,59,84,.35);border-radius:10px;padding:12px;background:repeating-linear-gradient(135deg,rgba(255,59,84,.07) 0 10px,transparent 10px 20px)}
.sealed .bars{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.sealed .bars i{display:block;height:12px;background:#1a0a10;border-radius:2px;box-shadow:inset 0 0 0 1px rgba(255,59,84,.25)}
.sealed small{display:block;margin-top:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--red2)}
.stamp{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--dim);text-align:center;margin-top:8px}

/* ---------- evidence ---------- */
.ev{border:1px solid var(--line2);border-radius:12px;background:rgba(3,7,16,.6);margin-bottom:10px;overflow:hidden}
.ev summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;align-items:center;gap:10px}
.ev summary::-webkit-details-marker{display:none}
.ev summary .t{flex:1;font-weight:700;font-size:15px}
.ev summary .when{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.ev summary::after{content:"+";font-family:var(--mono);color:var(--gold);font-size:18px}
.ev[open] summary::after{content:"–"}
.ev .body{padding:0 14px 14px;font-size:15.5px;line-height:1.7;color:#d8e2f3;white-space:pre-line}
.ev .src{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--cyan);margin-bottom:8px}
.ev.new{border-color:var(--gold);box-shadow:0 0 22px rgba(217,178,91,.3);animation:evglow 1.6s ease-in-out 3}
@keyframes evglow{50%{box-shadow:0 0 36px rgba(217,178,91,.6)}}
.pill{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;padding:3px 7px;border-radius:6px;border:1px solid var(--line2);color:var(--muted);text-transform:uppercase;white-space:nowrap}
.pill.gold{border-color:rgba(217,178,91,.5);color:var(--gold2);background:var(--gold-dim)}
.pill.red{border-color:rgba(255,59,84,.55);color:var(--red2);background:var(--red-dim)}
.pill.green{border-color:rgba(47,227,155,.5);color:var(--green);background:rgba(47,227,155,.08)}

/* ---------- vote / directive ---------- */
.voted{border:1px solid rgba(47,227,155,.4);background:rgba(47,227,155,.06);border-radius:11px;padding:12px 14px;margin-bottom:14px;font-size:14px;line-height:1.5}
.voted b{color:var(--green)}
.targets{display:grid;gap:10px;margin:6px 0 16px}
.target{display:flex;gap:12px;align-items:center;border:1px solid rgba(255,59,84,.35);border-radius:12px;padding:12px 14px;background:rgba(20,4,10,.6);cursor:pointer;text-align:left;width:100%;transition:.15s}
.target:hover{border-color:var(--red)}
.target.sel{border-color:var(--red);background:rgba(255,59,84,.14);box-shadow:0 0 22px rgba(255,59,84,.3)}
.target .rad{width:18px;height:18px;border-radius:50%;border:2px solid var(--red2);flex:none;display:grid;place-items:center}
.target.sel .rad::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red)}
.target b{display:block;font-size:16px}
.target small{display:block;font-size:13px;color:var(--red2);font-family:var(--mono);letter-spacing:.04em;margin-top:2px}
.deadstrip{border:1px solid var(--red);background:var(--red-dim);color:var(--red2);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-align:center}

/* ---------- admin ---------- */
.grid2{display:grid;grid-template-columns:1fr;gap:0 16px}
@media(min-width:900px){.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel)}
.stat b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--text)}
.stat b em{font-style:normal;font-size:14px;color:var(--dim);font-weight:600}
.stat span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.ctl{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.ctl:first-of-type{border-top:0;padding-top:0}
.ctl .txt{flex:1;min-width:0}
.ctl .txt b{display:block;font-size:15px}
.ctl .txt small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.4}
.toggle{position:relative;width:60px;height:32px;border-radius:999px;border:1px solid var(--line2);background:#060b16;cursor:pointer;flex:none;transition:.2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#4a5775;transition:.2s}
.toggle[aria-pressed="true"]{background:rgba(47,227,155,.2);border-color:var(--green);box-shadow:0 0 14px rgba(47,227,155,.35)}
.toggle[aria-pressed="true"]::after{left:31px;background:var(--green)}
.toggle.red[aria-pressed="true"]{background:rgba(255,59,84,.22);border-color:var(--red);box-shadow:0 0 16px rgba(255,59,84,.45)}
.toggle.red[aria-pressed="true"]::after{background:var(--red)}
.state{font-family:var(--mono);font-size:10px;letter-spacing:.12em;width:44px;text-align:right;color:var(--dim)}
.state.on{color:var(--green)}.state.on.r{color:var(--red2)}
.relist{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.reitem{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:rgba(3,7,16,.5);font-size:14px}
.reitem .t{flex:1;min-width:0}
.reitem .t small{display:block;font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(90px,150px) 1fr 34px;gap:10px;align-items:center;font-size:14px}
.bar .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .track{height:14px;border-radius:7px;background:rgba(88,140,255,.08);overflow:hidden;border:1px solid var(--line)}
.bar .fill{height:100%;border-radius:7px;background:linear-gradient(90deg,#3d8bff,#5ad6ff);transition:width .5s ease}
.bar.lead .fill{background:linear-gradient(90deg,#c79b3f,#f5dc93);box-shadow:0 0 14px rgba(217,178,91,.6)}
.bar.lead .n{color:var(--gold2);font-weight:700}
.bar .c{font-family:var(--mono);font-weight:700;text-align:right}
.empty{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--dim);padding:14px;text-align:center;border:1px dashed var(--line2);border-radius:10px}
.roster-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--dim);margin:14px 0 8px;text-transform:uppercase}
.rrow{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:4px 10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:7px;background:rgba(3,7,16,.5);cursor:pointer;transition:.15s}
.rrow:hover{border-color:var(--gold);background:rgba(217,178,91,.06)}
.rrow .nm{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .nm small{font-weight:500;color:var(--dim);font-family:var(--mono);font-size:10.5px;margin-left:6px;letter-spacing:.06em}
.rrow .tags{display:flex;gap:5px;justify-content:flex-end;flex-wrap:wrap}
.rrow .vote{grid-column:2 / 4;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .vote b{color:var(--gold2);font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:#3a4560}
.dot.on{background:var(--green);box-shadow:0 0 10px var(--green)}
.rrow.dead .nm{color:var(--red2);text-decoration:line-through;text-decoration-color:rgba(255,59,84,.5)}
.host-notes{font-size:14.5px;line-height:1.65;color:#d8e2f3}
.host-notes li{margin-bottom:6px}
details.fold>summary{cursor:pointer;list-style:none}
details.fold>summary::-webkit-details-marker{display:none}

/* ---------- overlays ---------- */
#alertbar{position:fixed;left:0;right:0;top:0;z-index:60;pointer-events:none}
.alert{pointer-events:auto;margin:8px;border-radius:12px;padding:12px 44px 12px 14px;position:relative;font-weight:700;font-size:14.5px;line-height:1.4;
  border:1px solid var(--red);background:linear-gradient(180deg,#5c0716,#2a030a);color:#fff;box-shadow:0 0 40px rgba(255,59,84,.55);animation:flash 1s steps(1) infinite}
.alert .h{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--red2);margin-bottom:3px}
.alert.notice{border-color:var(--gold);background:linear-gradient(180deg,#3a2c0c,#1b1405);box-shadow:0 0 30px rgba(217,178,91,.45);animation:none}
.alert.notice .h{color:var(--gold2)}

{ id:'alex', file:'01', name:'Alexandra "Alex" Kane', code:'MIDNIGHT', tier:'core', dead:true,

  {h:'Hobbies & interests', t:`Competitive amateur chess player (online, under a pseudonym, tells almost no one). Collects vintage watches, not for status but because she likes mechanical things that can be fixed when broken — an irony she's aware of. Reads true crime, which people find either morbid or, now, tragically ironic.`},
  {h:'Public reputation', t:`Brilliant, generous, unpredictable. Famous for solving other people's problems with checks, favors, and quiet phone calls — and for expecting nothing in return, which somehow makes people trust her less, not more.`},
  {h:'Private life', t:`Deeply lonely under the competence. In therapy for two years with Dr. Simone Asante, who is a guest tonight. Has spent the last year secretly investigating her father's death and found real evidence it was murder.`},
  {h:'The secret at the center of everything', key:true, t:`Tonight she planned to announce she's selling Kane Oil and publicly confessing every bribe, cover-up, and favor she's arranged over the years — to finally live a life her father would recognize as honest. She told almost no one the full plan. She never gets the chance to give the speech.`},
  {h:'Roleplay note', role:true, t:`This character doesn't get played much — she's the victim — but her presence should loom over the whole night through how other characters talk about her.`}

{ id:'nathaniel', file:'02', name:'Nathaniel Cross', code:'CLOCKWORK', tier:'core',

  {h:'Physicality & presence', t:`Relaxed, unhurried, good posture without trying. The kind of person who makes eye contact a beat longer than expected and somehow makes it feel warm instead of intense. Moves calmly under pressure — genuinely, not performed, which is its own kind of red flag if anyone's paying attention.`},

  {h:'Hobbies & interests', t:`Restores old watches and clocks as a private hobby — mechanical, patient, solitary work. Runs long distances alone, early mornings, no headphones. Plays poker well and rarely for real stakes; he says he "doesn't need the money," which is true, and "doesn't like what winning does to people," which is closer to the truth about himself than he'd admit.`},

  {h:'Private life', t:`Has rebuilt an entire identity from nothing. Alex has helped his career twice — co-signed a loan once, made an introduction that changed his life once — with no idea who she actually helped.`,

  {h:'The secret at the center of everything', key:true, t:`If Alex's investigation into her father's murder goes public, his real name comes with it, and everything he's built collapses along with his father's memory. He does not see himself as a villain — he sees himself as protecting an innocent man's second chance from a crime he never committed himself.`, sealed:true},

  {h:'Private life', t:`The prenup he signed three years ago left him with far less than he expected when the engagement broke off. Watches Alex's new relationship with Camille with poorly hidden jealousy.`},
  {h:'The secret at the center of everything', key:true, t:`Recently sent Alex an angry, bitter message about money that would look very bad taken out of context — and he has no idea whether she showed it to anyone before tonight.`},
  {h:'Motive read', t:`Money and wounded pride — a strong, classic red herring.`},
  {h:'Roleplay note', role:true, t:`Play the bitterness as thin cover for real hurt — he wanted this life back more than he wanted revenge.`}
]},
{ id:'camille', file:'10', name:'Camille Dubois', code:'BISCOTTE', tier:'core', cls:'SUBJECT — KEY WITNESS', age:30, occ:'Architect',
  sections:[
  {h:'Residence', t:`Her own apartment across town, though she stays at Alex's most nights — a normal, unglamorous relationship rhythm that stands out in this crowd.`},
  {h:'Family', t:`Middle-class French-Canadian family, close with her parents (both still call her every Sunday) and two younger brothers she talks about fondly and often.`},
  {h:'Home life', t:`Owns a scruffy rescue mutt named Biscotte, who Alex has grown unexpectedly attached to. Cooks real dinners most nights — one of the things Alex says drew her in, someone who wanted nothing from the money at all.`},
  {h:'Physicality & presence', t:`Grounded, unhurried, watches a room more than she performs in it. Protective of Alex in small, physical ways — a hand on her arm, positioning herself near the door in a crowd.`},
  {h:'Voice & speech', t:`Direct, warm, slips into French when emotional or caught off guard. Finds this room's social games exhausting and doesn't hide it well.`},
  {h:'Hobbies & interests', t:`Designs treehouses and small pavilions pro bono for a community nonprofit on weekends — genuinely good work, genuinely hers. Plays guitar badly and happily.`},
  {h:'Public reputation', t:`The "old guard" (Victoria, Elias, some board members) treat her as an outsider who doesn't belong, which she finds more funny than hurtful most days.`},
  {h:'Private life', t:`Financially independent from Alex by choice — has turned down money more than once, to the old guard's visible confusion.`},
  {h:'The secret at the center of everything', key:true, t:`She is the one person who knows the exact content of the speech Alex planned to give tonight, because Alex told her everything, days ago, in bed, half-joking that it might "blow up the whole room."`},
  {h:'Roleplay note', role:true, t:`The single most valuable interview in the game if players earn her trust — play her as guarded with strangers, genuinely open with anyone who approaches with real warmth or grief rather than interrogation energy.`}
]},
{ id:'renee', file:'11', name:'Renee Ashford', code:'PIXEL', tier:'core', cls:'SUBJECT', age:33, occ:'Executive Director, a children\'s education charity Alex heavily funds',
  sections:[
  {h:'Residence', t:`A modest apartment, deliberately unchanged since college, a point of quiet pride.`},
  {h:'Family', t:`College roommate of Alex's, essentially family by now. Comes from a working-class background and has never fully adjusted to the wealth that surrounds her now.`},
  {h:'Home life', t:`Owns a very anxious rescue greyhound named Pixel who mirrors her own nervous energy a little too well. Lives alone, mostly by choice, mostly by circumstance.`},
  {h:'Physicality & presence', t:`Warm, a little jumpy, over-apologizes with her body language — steps back too fast, laughs a beat too early to smooth over silence.`},
  {h:'Voice & speech', t:`Talks fast when nervous. Circles back to reassure people she's "not upset" about things she very clearly is upset about.`},
  {h:'Hobbies & interests', t:`Volunteers hands-on at her own charity's programs, not just administratively — genuinely loves the kids she works with. Bakes elaborate desserts she's too anxious to actually serve to guests half the time.`},
  {h:'Public reputation', t:`Well-liked, seen as Alex's closest and most loyal friend.`},
  {h:'Private life', t:`Her charity's entire operating budget depends on Alex's continued funding — funding Alex recently, quietly, discussed redirecting.`},
  {h:'The secret at the center of everything', key:true, t:`Found out last week, by accident, that Alex was planning to redirect a large donation elsewhere. Felt genuinely betrayed and hasn't told Alex she knows.`},
  {h:'Motive read', t:`Hurt and financial anxiety — a sympathetic red herring, not the killer.`},
  {h:'Roleplay note', role:true, t:`Play the warmth as real and the hurt as something she's actively trying (and failing) to hide all night.`}
]},
{ id:'tasha', file:'12', name:'Tasha Morrow', code:'MOCHI', tier:'core', cls:'SUBJECT', age:32, occ:'"Social consultant" — informally, Alex\'s event fixer and hype-woman',
  sections:[
  {h:'Residence', t:`A stylish apartment that costs more than her stated income would suggest.`},
  {h:'Family', t:`Childhood friend of Alex's from the same hometown, from before either of them had money. Parents still live in that hometown; Tasha rarely visits anymore.`},
  {h:'Home life', t:`Owns a small, extremely photogenic dog, Mochi, that appears constantly on her social media. Lives well beyond her visible means, quietly subsidized by Alex in ways she downplays.`},
  {h:'Physicality & presence', t:`Bright, animated, always slightly performing for an invisible audience — checks how she looks in reflective surfaces without seeming to notice she's doing it.`},
  {h:'Voice & speech', t:`Namedrops her closeness to Alex often and easily. Slightly exaggerates details of recent conversations to seem more "in the loop" than she actually is — not maliciously, just habitually.`},
  {h:'Hobbies & interests', t:`Curates her social media persona as a genuine hobby/skill. Loves throwing parties for other people more than attending them, which is part of why she's useful to Alex.`},
  {h:'Public reputation', t:`Well-liked on the surface; privately seen by some as insecure and attention-seeking.`},
  {h:'Private life', t:`Competitive, quietly, with Renee for the title of Alex's "real" best friend — a competition Renee mostly doesn't realize is happening.`},
  {h:'The secret at the center of everything', key:true, t:`Has exaggerated or misremembered a recent conversation with Alex, creating a contradiction with Renee's account that investigators will need to untangle — an honest mistake, not a lie, though it won't look that way at first.`},
  {h:'Motive read', t:`None serious — social friction, not violence.`},
  {h:'Roleplay note', role:true, t:`Play the confidence as a little brittle — she needs to be "in the know" more than the facts support.`}
]},
{ id:'imogen', file:'13', name:'Imogen Pierce', code:'NOTEBOOK', tier:'core', cls:'SUBJECT', age:26, occ:'Personal Assistant to Alex Kane',
  sections:[
  {h:'Residence', t:`A small shared apartment with two roommates from college, a stark contrast to her work environment.`},
  {h:'Family', t:`Recent college graduate; close with her parents back home, who are quietly thrilled and a little intimidated that she works for "the Kanes."`},
  {h:'Home life', t:`Doesn't have a pet — her roommates have a cat, Nacho, that she's grown attached to anyway. Works far more hours than she's technically paid for and hasn't figured out how to say no yet.`},
  {h:'Physicality & presence', t:`Eager, slightly overwhelmed-looking, double-checks her own phone and notes constantly, like she's afraid of forgetting something critical.`},
  {h:'Voice & speech', t:`Apologizes reflexively, even for things that aren't her fault. Speaks carefully around anything involving Alex's private schedule, clearly worried about overstepping or getting in trouble.`},
  {h:'Hobbies & interests', t:`Journals every night, partly to process her genuinely stressful job. Runs a small, anonymous online book club that has nothing to do with her real life — her one true escape.`},
  {h:'Public reputation', t:`Barely known socially in this room — she's staff, and everyone here knows it, which stings more than she admits.`},
  {h:'Private life', t:`Feels like a permanent outsider among Alex's wealthy circle, caught between genuine loyalty to Alex and constant low-grade anxiety about her job security.`},
  {h:'The secret at the center of everything', key:true, t:`Overheard part of Alex's plan for tonight while prepping her schedule earlier this week, and mentioned it to exactly one other person, thinking it was harmless small talk. She knows exactly who she told.`},
  {h:'Roleplay note', role:true, t:`Play nervous and helpful — someone who wants to do right by everyone and is quietly terrified of having made a mistake.`}
]},
{ id:'marcus', file:'14', name:'Marcus Reid', code:'SENTRY', tier:'core', cls:'SUBJECT', age:44, occ:'Head of Estate Security',
  sections:[
  {h:'Residence', t:`A modest house twenty minutes from the estate, chosen for the commute.`},
  {h:'Family', t:`Former military, married to Angela Reid for twelve years, two young kids not in attendance tonight. Calls home once during every shift like this, without fail.`},
  {h:'Home life', t:`Owns a retired police dog, Duke, that failed out of active service for being "too friendly" — a fact Marcus finds funnier than he lets on at work. Takes his job at the estate very seriously despite the joke of a dog waiting for him at home.`},
  {h:'Physicality & presence', t:`Watchful, terse, stands slightly apart from social clusters even when technically off-duty tonight. Scans exits and doorways out of pure habit.`},
  {h:'Voice & speech', t:`Short, factual answers. Gets visibly defensive, jaw tightening, if his competence or attentiveness is questioned.`},
  {h:'Hobbies & interests', t:`Coaches his kids' youth soccer team on weekends — the version of himself he actually likes best. Restores old cars slowly, in a garage that's more sanctuary than hobby space.`},
  {h:'Public reputation', t:`Not really part of "the room" socially — staff with real authority, an odd, slightly isolating position at a party like this.`},
  {h:'Private life', t:`Nothing scandalous — just a man trying to do a hard job well and provide for his family.`},
  {h:'The secret at the center of everything', key:true, t:`There's a gap in tonight's official movement log — a blind spot in coverage that he created by cutting a corner earlier in the evening to deal with a minor, unrelated issue. He's far more afraid of admitting that mistake than he is of being suspected of murder.`},
  {h:'Roleplay note', role:true, t:`Play professional and guarded; let genuine, respectful pressure (not accusation) be what gets him to admit the gap in the log.`}
]},
{ id:'constance', file:'15', name:'Constance Velez', code:'COMPASS', tier:'core', cls:'SUBJECT', age:50, occ:'CEO, a rival energy company',
  sections:[
  {h:'Residence', t:`A sleek, minimalist penthouse she rarely has time to enjoy.`},
  {h:'Family', t:`Self-made, estranged from most of her family after a bitter fight years ago over the company she built without their help or belief in her. No children by choice.`},
  {h:'Home life', t:`No pets — travels too much to justify one, something she says without regret. A workaholic in the most literal sense; the office is closer to home than home is.`},
  {h:'Physicality & presence', t:`Commands a room by simply not performing for it — still, direct, unbothered by silence. Doesn't do the social choreography this crowd expects.`},
  {h:'Voice & speech', t:`Business-first, allergic to small talk. Refers to people by their company titles rather than their names more often than she probably realizes.`},
  {h:'Hobbies & interests', t:`Competitive sailing, one of the only arenas where she says "the wind doesn't care who your father was." Reads business biographies almost exclusively.`},
  {h:'Public reputation', t:`Widely seen as cold and opportunistic — not incorrect, just not sinister.`},
  {h:'Private life', key:true, t:`Has a term sheet already drafted for acquiring parts of Kane Oil, prepared before tonight, opportunistic rather than murderous — but it looks terrible if found in her bag.`},
  {h:'Motive read', t:`Business opportunity — a strong, obvious-feeling red herring.`},
  {h:'Roleplay note', role:true, t:`Play total confidence and zero grief performance — she barely knew Alex and isn't going to pretend otherwise, which will read as suspicious to the table even though it isn't.`}
]},
{ id:'daniel', file:'16', name:'Daniel Ortiz', code:'HEADLINE', tier:'core', cls:'SUBJECT', age:38, occ:'Investigative journalist',
  sections:[
  {h:'Residence', t:`A cluttered one-bedroom apartment that doubles as his office — files everywhere, most of them about the Kane family.`},
  {h:'Family', t:`Working-class background; parents proud but worried about the instability of his career. No spouse, no kids — the job doesn't leave room.`},
  {h:'Home life', t:`Owns an old, unbothered cat named Scoop that sleeps on his research notes constantly. Lives on coffee and deadline adrenaline.`},
  {h:'Physicality & presence', t:`Watchful, patient, good at fading into a room's background until he wants to be noticed. Takes mental notes visibly — a small notebook he "forgets" to put away.`},
  {h:'Voice & speech', t:`Asks a lot of "harmless" follow-up questions in a friendly, unhurried tone. Never quite answers what he's actually working on when asked directly.`},
  {h:'Hobbies & interests', t:`Long-distance running, mostly to think through a story. Collects old newspapers and archival documents — genuinely, obsessively.`},
  {h:'Public reputation', t:`An outsider here by class and by design — invited under the pretense of "family friend," a lie he's fully aware of and comfortable maintaining.`},
  {h:'Private life', t:`Financially unremarkable; his currency is information, not money, and he's used to being underestimated because of it.`},
  {h:'The secret at the center of everything', key:true, t:`Has been independently investigating Richard Kane's death for over a year and has partial evidence of his own, separate from Alex's, that corroborates part of the original conspiracy.`},
  {h:'Roleplay note', role:true, t:`Play curious and disarming, never predatory — he gets more from people by seeming harmless than by pushing.`}
]},
{ id:'wesley', file:'17', name:'Wesley Kane', code:'LONGSHOT', tier:'core', cls:'SUBJECT', age:29, occ:'Between jobs, currently "consulting" for a friend\'s startup that isn\'t really paying him',
  sections:[
  {h:'Residence', t:`A cramped apartment he describes, generously, as "temporary."`},
  {h:'Family', t:`Distant cousin on Richard Kane's side; his branch of the family fell out of favor and money two generations back, a fact he brings up more than anyone wants him to.`},
  {h:'Home life', t:`Owns a scrappy, well-loved mutt named Tank, honestly the most stable relationship in his life right now. Behind on rent more often than he admits out loud.`},
  {h:'Physicality & presence', t:`Overeager, restless energy, laughs a little too loud at things that aren't that funny. Dresses one notch too formal, trying visibly hard to fit in.`},
  {h:'Voice & speech', t:`Oversells his closeness to the family ("we're basically family, obviously"). Gets prickly and defensive if reminded how distant that relationship actually is.`},
  {h:'Hobbies & interests', t:`Plays in an amateur band that's never played a real venue. Genuinely good with numbers, a skill nobody in the family has ever taken seriously or given him a chance to use.`},
  {h:'Public reputation', t:`Not really accepted as "real family" by anyone else in the room, and it visibly stings every time it comes up.`},
  {h:'Private life', t:`Struggling financially more than he lets on; would be next in line for a modest inheritance if Alex died without a revised will — a fact he's uncomfortably aware of.`},
  {h:'The secret at the center of everything', key:true, t:`Recently asked a lawyer, not Harold, about inheritance law "hypothetically" — looks bad out of context, means very little in reality.`},
  {h:'Motive read', t:`Weak, financial, more pathetic than sinister — good comic-relief suspect for the table.`},
  {h:'Roleplay note', role:true, t:`Play the desperation to belong as sincere, not sinister — he wants a family, not a fortune, even if he'd never admit that out loud.`}
]},
{ id:'edgar', file:'18', name:'Edgar Voss', code:'GARDENER', tier:'core', cls:'SUBJECT', age:70, occ:'Retired household butler/driver for the Kane family, over 20 years of service',
  sections:[
  {h:'Residence', t:`A small cottage on the far edge of the Kane estate grounds, a gift from Richard Kane himself decades ago.`},
  {h:'Family', t:`Widower; his late wife also worked for the Kane household for years. One adult son, a schoolteacher two states away, who calls every Sunday.`},
  {h:'Home life', t:`Owns an old, gentle basset hound named Duchess, the only creature he fully relaxes around anymore. Tends a small vegetable garden with real, quiet pride.`},
  {h:'Physicality & presence', t:`Formal, gentle, moves a little slower than he used to but carries himself with old-world dignity regardless. Stands when anyone approaches him, out of decades of habit he can't unlearn.`},
  {h:'Voice & speech', t:`Measured, respectful, occasionally drifts unprompted into reminiscence about "Mr. Kane" with real, uncomplicated love in his voice. Clams up completely if approached with rudeness or accusation.`},
  {h:'Hobbies & interests', t:`Gardening, chess (though he always let Richard win, a private joke he's never told anyone). Reads mystery novels, with some irony he's aware of tonight.`},
  {h:'Public reputation', t:`Universally liked, considered a trusted, gentle fixture of the family for two decades.`},
  {h:'Private life', t:`Was present the night Richard Kane died and has always privately doubted the official story, but never had proof — until Alex started quietly asking him questions in recent months.`},
  {h:'The secret at the center of everything', key:true, t:`Holds a genuine, specific memory from that night that he's never shared with anyone, and will only share if approached with real respect rather than pressure or accusation.`},
  {h:'Roleplay note', role:true, t:`Play warmth and dignity throughout — reward players who treat him kindly with real information; shut down completely for anyone who's rude to him.`}
]},
{ id:'lucia', file:'19', name:'Lucia Ferrante', code:'LEDGER', tier:'core', cls:'SUBJECT', age:63, occ:'Retired; one of Kane Oil\'s first employees, decades ago',
  sections:[
  {h:'Residence', t:`A comfortable but modest condo, paid off years ago.`},
  {h:'Family', t:`No family in attendance tonight; the company was effectively her family for most of her working life. One niece she's close to but rarely sees.`},
  {h:'Home life', t:`Owns two elderly cats, Penny and Dime, named during her accounting years — a small joke she still finds funny. Lives quietly, watches a lot of old movies alone.`},
  {h:'Physicality & presence', t:`Sharp-eyed, quiet, watches far more than she participates in conversation. Sits near the edges of rooms, out of decades-old habit.`},
  {h:'Voice & speech', t:`Careful, deliberate, chooses her words like she's still worried about being overheard by someone from thirty years ago.`},
  {h:'Hobbies & interests', t:`Genealogy research — ironic, given how carefully she's buried a piece of her own company's history. Bakes for neighbors more than for herself.`},
  {h:'Public reputation', t:`Mostly forgotten by the current social circle; invited more out of politeness and history than genuine closeness.`},
  {h:'Private life', t:`Financially secure, but her sense of self and safety has always depended on the company's good name and stability.`},
  {h:'The secret at the center of everything', key:true, t:`Saw something suspicious involving company money around the time of Richard Kane's death and buried it out of fear for her job and safety at the time. Has never told anyone, until tonight, maybe.`},
  {h:'Roleplay note', role:true, t:`Play quiet and watchful most of the night — the reveal of what she knows should feel like something finally being set down after thirty years of carrying it.`}
]},
{ id:'simone', file:'20', name:'Dr. Simone Asante', code:'ORCHID', tier:'core', cls:'SUBJECT', age:45, occ:'Licensed therapist, Alex\'s personal confidant and clinician for two years',
  sections:[
  {h:'Residence', t:`A calm, understated house that looks exactly like you'd expect a therapist's home to look.`},
  {h:'Family', t:`Married to her wife, Jordan, an artist, quietly and happily for eight years. No children by choice, a decision she's completely at peace with.`},
  {h:'Home life', t:`Owns a very calm, very large orange cat named Freud — a joke she rolls her eyes at every time someone makes it, which is often. Genuinely relaxes at home in a way her professional life doesn't allow.`},
  {h:'Physicality & presence', t:`Calm, observant, professionally guarded posture even in social settings — reads people for a living and it shows in how she holds a room.`},
  {h:'Voice & speech', t:`Careful generalities when asked direct personal questions about Alex ("I really can't discuss that"). Occasionally lets something genuine slip when she's truly moved or provoked, more than she'd like.`},
  {h:'Hobbies & interests', t:`Practices yoga daily, more for mental discipline than fitness. Paints badly and privately, purely for herself, never shown to anyone including her wife.`},
  {h:'Public reputation', t:`Respected, a little apart from the social fabric of this crowd by professional necessity.`},
  {h:'Private life', t:`Financially independent of Alex, though Alex has been a long-standing, high-profile client — a fact she never advertises and treats with real seriousness.`},
  {h:'The secret at the center of everything', key:true, t:`Knows Alex's exact state of mind heading into tonight, including specifically who Alex had recently become wary of — information bound by confidentiality, but real grief and real stakes tonight might crack that open.`},
  {h:'Roleplay note', role:true, t:`The strongest possible nudge toward suspicion of Nathaniel, if a player can get her to break professional distance through genuine emotional connection rather than interrogation.`}
]},

/* ---------- EXTENDED CAST (lighter files) ---------- */
{ id:'bunny', file:'X1', name:'Bunny Vanderhoff', code:'GOSSIP', tier:'ext', cls:'GUEST — SOCIALITE', age:54, occ:'Socialite, professional attendee of galas',
  sections:[
  {h:'Defining trait', t:`Cannot hold a secret longer than it takes to finish a canapé. Loves being the first to know, far more than being right.`},
  {h:'Home life', t:`Two Pomeranians, Fifi and Truffle, with a larger wardrobe than most guests here. Summers in a house she calls "the cottage" that has nine bedrooms.`},
  {h:'Gossip you are carrying', key:true, t:`Swears Victoria is wearing jewelry Richard gave her decades ago and "never gave back" (true, as it happens). Also swears Senator Hale is quietly getting divorced (completely false — you heard it from a manicurist).`},
  {h:'Roleplay note', role:true, t:`You arrived with your husband, Chip. Finish each other's sentences, then contradict each other's details. Half your information is wrong; deliver all of it with total confidence.`}
]},
{ id:'chip', file:'X2', name:'Chip Vanderhoff', code:'YACHT', tier:'ext', cls:'GUEST — SOCIALITE', age:57, occ:'"Retired from something in shipping"',
  sections:[
  {h:'Defining trait', t:`Agrees loudly with whatever Bunny said last, then embellishes it until it's a different story entirely.`},
  {h:'Home life', t:`Has been "restoring" a sailboat for eleven years. It has never left the dock. Makes his own terrible limoncello and gives it as gifts.`},
  {h:'Gossip you are carrying', key:true, t:`Heard that Constance Velez and Alex had "a screaming match" at an energy conference last year. It was a polite disagreement on a panel about offshore drilling. You were not there.`},
  {h:'Roleplay note', role:true, t:`Harmless, jolly, and a truly unreliable witness. Treat every rumor like breaking news.`}
]},
{ id:'martin', file:'X3', name:'Martin Pruitt', code:'DIVIDEND', tier:'ext', cls:'GUEST — MINOR SHAREHOLDER', age:61, occ:'Retired dentist; holds a small stake in Kane Oil',
  sections:[
  {h:'Defining trait', t:`Anxious about his money in a way that leaks into every conversation. Checks the stock ticker on his phone constantly, even though the markets are closed.`},
  {h:'Home life', t:`Widower. Builds an elaborate model railway in his basement, modeled on the town where he grew up.`},
  {h:'Gossip you are carrying', key:true, t:`Before dinner, you overheard Gordon Whitfield and Diane Okafor arguing in a hallway. Gordon: "You can't hide it forever." Diane: "Not tonight, Gordon." You're sure it's about money. (It is. It isn't about murder.)`},
  {h:'Roleplay note', role:true, t:`Tell your hallway story to anyone who'll listen, and ask everyone whether they think the stock will recover.`}
]},
{ id:'gloria', file:'X4', name:'Gloria Anand', code:'PORTFOLIO', tier:'ext', cls:'GUEST — MINOR SHAREHOLDER', age:49, occ:'Pension fund manager with a modest Kane Oil position',
  sections:[
  {h:'Defining trait', t:`Blunt, numerate, suspicious of anyone who uses the word "synergy." Believes every mystery is a spreadsheet in disguise.`},
  {h:'Home life', t:`Two teenagers, one very old tortoise named Warren Buffett. Does crossword puzzles in pen.`},
  {h:'Gossip you are carrying', key:true, t:`You heard the same Gordon/Diane argument as Martin — but a different part. Diane said, "If the sale goes through, the auditors will see everything." Gordon said, "Then we tell her together." You think it sounds like fraud. It's about accounting, not murder.`},
  {h:'Roleplay note', role:true, t:`You and Martin will disagree about what you heard. Neither of you is lying.`}
]},
{ id:'beatrice', file:'X5', name:'Beatrice Kane', code:'HEIRLOOM', tier:'ext', cls:'GUEST — EXTENDED FAMILY', age:78, occ:'Richard Kane\'s elderly cousin',
  sections:[
  {h:'Defining trait', t:`A sharp memory and a sharper tongue. Remembers every family scandal back to 1962 and considers it her duty to bring them up.`},
  {h:'Home life', t:`Still lives in the old Kane farmhouse where the family fortune started. Keeps chickens, all named after former presidents.`},
  {h:'Family history you carry', key:true, t:`Richard taught Alex chess at this very estate: "control the center of the board and you control everything." In his last year, Richard told you over Thanksgiving pie that "the partners aren't who I thought they were." You thought he meant business ethics. You've wondered since.`},
  {h:'Roleplay note', role:true, t:`Good for color and old family history. Not a suspect. Deeply unimpressed by Wesley's claims to be "basically family."`}
]},
{ id:'soren', file:'X6', name:'Soren Blake', code:'SEATING', tier:'ext', cls:'GUEST — EVENT PLANNER', age:36, occ:'Event planner for tonight\'s gala',
  sections:[
  {h:'Defining trait', t:`A perfectionist in a permanent low-grade panic. Clipboard, earpiece, and a smile that's doing a lot of work.`},
  {h:'Home life', t:`Lives with a boyfriend who is patient beyond reason and a fiddle-leaf fig that is always dying.`},
  {h:'Gossip you are carrying', key:true, t:`Something was off about tonight's seating chart: Alex asked for last-minute changes this afternoon. Camille was moved to the head table, and Victoria was bumped out to table nine. You're sure it's social drama and a deliberate snub. (It's social drama. It isn't murder.)`},
  {h:'Roleplay note', role:true, t:`Treat every problem tonight as a catering emergency, including the murders.`}
]},
{ id:'amara', file:'X7', name:'Amara Diallo', code:'SOUFFLE', tier:'ext', cls:'STAFF — HOUSEHOLD CHEF', age:41, occ:'Private chef to the Kane household',
  sections:[
  {h:'Defining trait', t:`Fiercely territorial about her kitchen. Guests who wander in uninvited get put to work peeling things.`},
  {h:'Home life', t:`Two kids, one husband, and a sourdough starter named Gerald that she has kept alive for nine years.`},
  {h:'Gossip you are carrying', key:true, t:`This morning Alex made an unusual request: an extra, empty place setting at the head table "for Dad," and her father's favorite vintage champagne for the toast. She seemed emotional, as if tonight really mattered. You don't know why.`},
  {h:'Roleplay note', role:true, t:`Warm but brisk. You loved working for Alex and you're furious someone ruined your dinner service.`}
]},
{ id:'rosa', file:'X8', name:'Rosa Delgado', code:'DUSTPAN', tier:'ext', cls:'STAFF — HOUSEKEEPER', age:52, occ:'Head housekeeper, Kane Estate',
  sections:[
  {h:'Defining trait', t:`Sees everything, says very little, and knows exactly which guests leave their rooms a mess.`},
  {h:'Home life', t:`Grandmother of three. Sings in a church choir on Sundays and is quietly very good.`},
  {h:'Gossip you are carrying', key:true, t:`While cleaning Alex's office this afternoon, you found a torn page under the chess set with "Tonight — the whole board" written on it and a list of chess moves you don't understand. You put it back where you found it.`},
  {h:'Roleplay note', role:true, t:`Only share what you found with someone who's polite to staff. You have a long memory for rudeness.`}
]},
{ id:'hannah', file:'X9', name:'Hannah Brooks', code:'DORMROOM', tier:'ext', cls:'GUEST — OLD FRIEND', age:32, occ:'Veterinarian in Vermont; Alex\'s freshman-year roommate',
  sections:[
  {h:'Defining trait', t:`Pure nostalgia. Hasn't seen Alex in years, and every sentence starts with "Remember when…"`},

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const fmtTime = ts => { if(typeof ts!=='number') return 'just now'; const d=new Date(ts); return d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}); };
const sleep = ms => new Promise(r => setTimeout(r, ms));
function patch(el, sig, html){ if(!el) return; if(el._sig !== sig){ el._sig = sig; el.innerHTML = html; } }
function setPath(obj, path, val){
  const parts = path.split('/'); let o = obj;
  for(let i=0;i<parts.length-1;i++){ if(typeof o[parts[i]]!=='object' || o[parts[i]]===null) o[parts[i]]={}; o=o[parts[i]]; }
  const k = parts[parts.length-1];
  if(val===null || val===undefined) delete o[k]; else o[k] = JSON.parse(JSON.stringify(val));
}
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('Failed to load '+src)); document.head.appendChild(s); }); }

/* per-device storage (localStorage with in-memory fallback for sandboxed iframes) */
const MEM = {};
const store = {
  k: k => 'kane:' + CONFIG.GAME_ID + ':' + k,
  get(k){ const key=this.k(k); try{ const v=localStorage.getItem(key); if(v!==null) return v; }catch(e){} return key in MEM ? MEM[key] : null; },
  set(k,v){ const key=this.k(k); MEM[key]=v; try{ localStorage.setItem(key, v); }catch(e){} },
  del(k){ const key=this.k(k); delete MEM[key]; try{ localStorage.removeItem(key); }catch(e){} }
};

/* =========================================================================
   SYNC BACKENDS — same interface: start(cb), update({path:value}), reset(state)
   ========================================================================= */
function LocalBackend(){
  const FULL = store.k('state'); let bc=null, cb=null, last=null;
  try{ bc = new BroadcastChannel(FULL); }catch(e){}
  const read = () => { try{ return JSON.parse(store.get('state') || '{}'); }catch(e){ return {}; } };
  const emit = () => { const raw = store.get('state') || '{}'; if(raw !== last){ last = raw; let v={}; try{ v=JSON.parse(raw); }catch(e){} cb && cb(v); } };
  const write = s => { store.set('state', JSON.stringify(s)); if(bc) bc.postMessage(1); emit(); };
  return {
    mode:'local', connected:true, now:()=>Date.now(), TS:()=>Date.now(),
    start(fn){ cb=fn; if(bc) bc.onmessage=emit; window.addEventListener('storage', e=>{ if(e.key===FULL) emit(); }); setInterval(emit, 1000); emit(); },
    update(paths){ const s=read(); for(const k in paths) setPath(s, k, paths[k]); write(s); return Promise.resolve(); },
    reset(init){ write(init); return Promise.resolve(); },
    onDisconnect(){}
  };
}
async function FirebaseBackend(){
  const v = '10.12.2';
  await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-app-compat.js`);
  await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-database-compat.js`);
  if(!firebase.apps.length) firebase.initializeApp(CONFIG.FIREBASE);
  const db = firebase.database();
  const root = db.ref('games/' + CONFIG.GAME_ID);
  let offset = 0;
  db.ref('.info/serverTimeOffset').on('value', s => { offset = s.val() || 0; });
  const be = {
    mode:'firebase', connected:false, now:()=>Date.now()+offset, TS:()=>firebase.database.ServerValue.TIMESTAMP,
    start(fn){ root.on('value', s => fn(s.val() || {}), err => { console.error(err); toast('DATABASE ERROR', 'Permission denied — check your Firebase rules.', 'err'); }); },
    update(p){ return root.update(p).catch(e => { console.error(e); toast('WRITE FAILED', e.message, 'err'); }); },
    reset(init){ return root.set(init); },
    onDisconnect(path, val){ try{ root.child(path).onDisconnect().set(val); }catch(e){} }
  };
  db.ref('.info/connected').on('value', s => { be.connected = !!s.val(); renderConn(); });
  return be;
}

function freshState(){

function norm(s){
  s = s || {};
  return {
    epoch: s.epoch || '0',
    flags: Object.assign({ lockdown:false, killer:false, voting:false }, s.flags || {}),
    evidence: s.evidence || {},

    players: s.players || {}
  };
}
let backend = null, S = norm({}), ready = false;
// session: per-tab (sessionStorage) so several tabs can rehearse different roles; localStorage copy survives a closed tab
const TAB_KEY = store.k('session');
let session = (() => { let raw = null; try{ raw = sessionStorage.getItem(TAB_KEY); }catch(e){} if(!raw) raw = store.get('session'); try{ return JSON.parse(raw || 'null'); }catch(e){ return null; } })();
const ui = { built:null, bypass:false, selTarget:null, seenEvidence:null };

const saveSession = s => {
  session = s; const raw = s ? JSON.stringify(s) : null;
  try{ raw ? sessionStorage.setItem(TAB_KEY, raw) : sessionStorage.removeItem(TAB_KEY); }catch(e){}
  if(raw) store.set('session', raw); else store.del('session');
};
const isHostDevice = () => store.get('hostDevice') === '1';
const me = () => session && session.role==='player' ? CH[session.id] : null;
const deadIds = () => { const d = new Set(CHARACTERS.filter(c=>c.dead).map(c=>c.id)); if(S.kill && S.kill.victim) d.add(S.kill.victim); return d; };
function playerRec(id){ const p = S.players[id]; return (p && p.epoch === S.epoch) ? p : null; }
function isOnline(id){ const p = playerRec(id); return !!(p && typeof p.lastSeen==='number' && backend && backend.now() - p.lastSeen < CONFIG.ONLINE_WINDOW_MS); }

/* =========================================================================
   BOOT
   ========================================================================= */
async function boot(){
  render();
  try{
    backend = CONFIG.FIREBASE ? await FirebaseBackend() : LocalBackend();
  }catch(e){
    console.error(e); backend = LocalBackend();
    toast('LIVE LINK FAILED', 'Could not reach Firebase. Running in local mode.', 'err');
  }
  backend.start(raw => {
    const prev = S, wasReady = ready;
    S = norm(raw); ready = true;
    onState(prev, wasReady);
  });
  setInterval(heartbeat, CONFIG.HEARTBEAT_MS);
  setInterval(() => { if(session && session.role==='admin') renderAdmin(); }, 2000);
  document.addEventListener('visibilitychange', () => { if(!document.hidden) heartbeat(); });
}

function onState(prev, wasReady){
  // hard reset → kick players back to login
  if(session && session.role==='player' && session.epoch !== S.epoch){
    saveSession(null); ui.built = null;
    toast('SESSION TERMINATED', 'The system was reset by the administrator. Enter your code word again.', 'err');
  }
  if(!S.flags.lockdown) ui.bypass = false;
  const c = me();
  if(wasReady && c){
    const newEv = Object.keys(S.evidence).filter(id => !prev.evidence[id] && EV[id]);
    if(newEv.length) toast('NEW EVIDENCE RELEASED', EV[newEv[0]].title + (newEv.length>1 ? ` (+${newEv.length-1} more)` : ''), '', () => scrollToId('evidencePanel'));
    if(S.flags.voting && !prev.flags.voting) toast('VOTING IS NOW OPEN', 'Submit your official accusation.', 'ok', () => scrollToId('votePanel'));
  }
  if(wasReady && S.alert && (!prev.alert || prev.alert.id !== S.alert.id) && S.alert.type==='kill'){
    try{ navigator.vibrate && navigator.vibrate([300,120,300,120,500]); }catch(e){}
  }
  if(session && session.role==='player' && !prev.players[session.id] ) heartbeat();
  render();
}

function heartbeat(){
  if(!backend || !ready || !session || session.role!=='player') return;
  if(session.epoch !== S.epoch) return;
  const p = 'players/' + session.id;
  const upd = { [p+'/lastSeen']: backend.TS(), [p+'/epoch']: session.epoch, [p+'/unlocked']: true };
  const rec = S.players[session.id];
  if(!rec || rec.epoch !== session.epoch || !rec.unlockedAt) upd[p+'/unlockedAt'] = backend.TS();
  backend.update(upd);
}

}

function bindLogin(){

    ['ok','  [ OK ] encrypted channel established'],
    ['gold','> 33 personnel files sealed · clearance required'],

    err.textContent = 'ACCESS DENIED'; card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    btn.disabled = false; btn.textContent = 'AUTHENTICATE';

}
function updateLoginReady(){

  const secs = c.sections.map(s => {
    if(s.hostOnly && !host) return s.playerText ? `<div class="sec"><h3>${esc(s.h)}</h3><p>${esc(s.playerText)}</p></div>` : '';
    if(s.sealed && !reveal){
      if(s.sealed === true) return sealedHTML(s.h);
      return `<div class="sec ${s.role?'role':''}"><h3>${esc(s.h)}</h3><p>${esc(s.sealed)}</p><div class="sealed" style="margin-top:10px;padding:8px 12px"><div class="bars"><i style="width:80%"></i></div><small>▲ ADDITIONAL RECORDS SEALED</small></div></div>`;
    }
    const hostTag = s.hostOnly ? ' <span class="pill gold">HOST ONLY</span>' : '';
    return `<div class="sec ${s.key?'key':''} ${s.role?'role':''}"><h3>${esc(s.h)}${hostTag}</h3><p>${esc(s.t)}</p></div>`;
  }).join('');
  return `
    <div class="dhead">${hexBadge(c, isKillerCls || killedNow)}
      <div><div class="mono" style="font-size:11px;letter-spacing:.2em;color:var(--dim)">PERSONNEL FILE ${esc(c.file)}${c.tier==='ext'?' · EXTENDED CAST':''}</div>
      <h1 class="dname">${esc(c.name)}</h1>
      <div class="cls ${isKillerCls||killedNow?'red':''}">CLASSIFICATION: ${esc(cls)}${killedNow && !/DECEASED/.test(cls)?' · DECEASED':''}</div></div>
    </div>
    <div class="kv">
      <div><b>Code word</b><span class="mono">${esc(c.code)}</span></div>
      <div><b>Age</b><span>${esc(c.age)}</span></div>
      <div style="grid-column:span 2"><b>Occupation</b><span>${esc(c.occ)}</span></div>
    </div>
    <div style="margin-top:6px">${secs}</div>
    <div class="stamp">████ END OF FILE ████ OPERATION: THE LAST TOAST ████</div>`;
}

      sel.value = cur || (mine && mine.vote ? mine.vote.suspect : '');

    }
    const mine = playerRec(c.id), v = mine && mine.vote;
    patch($('#voteStatus'), v ? v.suspect + v.ts : 'none', v

      <div class="body"><div class="src">SOURCE · ${esc(e.src)}</div>${esc(e.body)}</div></details>`;

}

   ========================================================================= */
function renderOverlays(){
  // lockdown — never on the admin view; host device can bypass on the player view
  const lk = $('#lockdown');
  const lockOn = S.flags.lockdown && !(session && session.role==='admin') && !ui.bypass;
  lk.classList.toggle('hidden', !lockOn);
  $('#bypassWrap').classList.toggle('hidden', !isHostDevice());
  document.body.style.overflow = lockOn ? 'hidden' : '';

  // alert banner
  const a = S.alert, bar = $('#alertbar');
  const dismissed = store.get('alertDismissed');
  const showAlert = a && a.id !== dismissed;
  patch(bar, showAlert ? a.id : 'none', showAlert ? `<div class="alert ${a.type==='notice'?'notice':''}" role="alert"><span class="h">${a.type==='kill'?'⚠ CRITICAL INCIDENT · ALL PERSONNEL':'◆ PRIORITY NOTICE · COMMAND CENTER'}</span>${esc(a.text)}<button class="x" aria-label="Dismiss" id="alertX">✕</button></div>` : '');
  const x = $('#alertX'); if(x) x.onclick = () => { store.set('alertDismissed', a.id); renderOverlays(); };
  $('#app').style.paddingTop = showAlert ? (bar.offsetHeight + 12) + 'px' : '';

  // killed victim & killer reveal (player only)
  const fm = $('#fullmsg'), c = me();
  let html = '', sig = 'none';
  if(c && S.kill && S.kill.victim === c.id && store.get('termAck') !== S.epoch + S.kill.ts){
    sig = 'dead';
    html = `<div class="overlay fullmsg dead"><div class="box">
      <div class="k">KANE-OS · PERSONNEL STATUS UPDATE</div>
      <h1>YOU HAVE BEEN<br>TERMINATED</h1>
      <p>You've been murdered. Stay where you are. When it feels right, collapse dramatically, and stay in character as the body until the host tells you otherwise.</p>
      <p style="color:var(--red2)">Don't reveal what your screen says to anyone.</p>
      <button class="btn danger" id="termAck" style="margin-top:8px">ACKNOWLEDGE</button></div></div>`;
  } else if(c && c.id === CONFIG.KILLER_ID && S.flags.killer && store.get('revealSeen') !== S.epoch){
    sig = 'reveal';
    html = `<div class="overlay fullmsg reveal"><div class="box">
      <div class="k">CLEARANCE ELEVATED · FILE 02 UNSEALED</div>
      <h1>YOU ARE THE KILLER</h1>
      <div class="typed">&gt; subject: CROSS, NATHANIEL<br>&gt; birth name: FERRIS, DANIEL ████<br>&gt; status: responsible for the deaths of A. KANE, G. WHITFIELD<br>&gt; new directive: available</div>
      <p>Your full file is now unsealed. A Termination Directive is waiting for you. Keep your screen hidden. Stay warm. Stay calm.</p>
      <button class="btn danger" id="revealAck">OPEN MY FILE</button></div></div>`;
  }
  patch(fm, sig, html);
  const ta = $('#termAck'); if(ta) ta.onclick = () => { store.set('termAck', S.epoch + S.kill.ts); renderOverlays(); };
  const ra = $('#revealAck'); if(ra) ra.onclick = () => { store.set('revealSeen', S.epoch); renderOverlays(); window.scrollTo({top:0, behavior:'smooth'}); };
}
$('#bypassBtn').addEventListener('click', () => { ui.bypass = true; renderOverlays(); toast('HOST OVERRIDE', 'Lockdown bypassed on this device only.', 'ok'); });

/* =========================================================================
   MODAL & TOASTS
   ========================================================================= */
function openModal(html){
  const m = $('#modal');
  m.innerHTML = `<div class="mcard" role="dialog" aria-modal="true"><button class="iconbtn mclose" data-close>CLOSE ✕</button>${html}</div>`;
  m.classList.add('open'); m.scrollTop = 0;
}
function closeModal(){ const m = $('#modal'); m.classList.remove('open'); m.innerHTML = ''; }
$('#modal').addEventListener('click', e => { if(e.target.id==='modal' || e.target.closest('[data-close]')) closeModal(); });
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });
function toast(title, msg, kind='', onClick){
  const t = document.createElement('div');
  t.className = 'toast ' + kind;
  t.innerHTML = `<b>${esc(title)}</b>${msg ? esc(msg) : ''}`;
  t.onclick = () => { if(onClick) onClick(); t.remove(); };
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), 5200);
}

boot();
</script>
</body>
</html>
