<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Kane Oil Database</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
<script>document.write('<link rel="stylesheet" href="theme.css?v=' + Date.now() + '">');</script>
<style>
/* ---------- login ---------- */
.login-wrap{min-height:calc(100vh - 40px);display:flex;align-items:center;justify-content:center;padding:20px 0}
.login{width:100%;max-width:400px;text-align:center;animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.lbrand{display:flex;align-items:center;justify-content:center;gap:10px;font-size:12px;letter-spacing:.32em;margin-bottom:34px}
.lbrand svg{filter:drop-shadow(0 4px 14px rgba(212,162,76,.4))}
.login h1{margin:0;font-size:30px;font-weight:400;letter-spacing:-.01em;line-height:1.1}
.lcard{margin-top:22px;padding:18px;border:1px solid var(--line);border-radius:22px;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:0 18px 44px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.07);text-align:left}
.lcard .btn{margin-top:12px}
.scanwait{display:flex;gap:10px;align-items:center;justify-content:center;border:1px solid rgba(201,184,255,.4);background:rgba(201,184,255,.08);color:var(--cyan);border-radius:14px;padding:10px 12px;font-size:13px;margin-top:16px}
.term{font-size:13px;color:var(--muted);margin-top:6px;min-height:20px}
.term div{display:none}.term div:last-child{display:block;animation:typein .3s ease both}
.term .ok{color:var(--green)}.term .err{color:var(--red2)}
@keyframes typein{from{opacity:0;transform:translateY(3px)}}.code-input{text-align:center;letter-spacing:.3em;font-size:19px;text-transform:uppercase;font-weight:500;color:var(--gold2);padding:14px}
.login .foot{margin-top:22px;font-size:9.5px;letter-spacing:.22em;line-height:1.8;color:var(--dim)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.login-err{color:var(--red2);font-size:12px;letter-spacing:.08em;min-height:18px;margin-top:10px;text-align:center}
.loading{min-height:60vh;display:grid;place-items:center;font-family:var(--mono);letter-spacing:.2em;color:var(--cyan);font-size:12px}

/* ---------- player navigation ---------- */
.pnav{position:sticky;top:76px;z-index:19;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:5px;margin:-6px 0 16px;border:1px solid var(--line);border-radius:22px;background:rgba(18,17,23,.62);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:0 12px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06)}
.pnav button{position:relative;border:0;background:transparent;border-radius:17px;padding:9px 4px 8px;cursor:pointer;color:var(--muted);font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:3px;transition:.25s}
.pnav button svg{width:19px;height:19px;transition:transform .25s}
.pnav button.on{color:var(--gold2);background:linear-gradient(180deg,rgba(212,162,76,.2),rgba(212,162,76,.07));box-shadow:inset 0 0 0 1px rgba(212,162,76,.38),0 6px 18px rgba(212,162,76,.12)}
.pnav button.on svg{transform:translateY(-1px) scale(1.08)}
.pnav .nb{position:absolute;top:5px;right:calc(50% - 20px);min-width:16px;height:16px;border-radius:999px;background:var(--red);color:#fff;font-size:9.5px;letter-spacing:0;display:grid;place-items:center;padding:0 4px;box-shadow:0 0 10px rgba(255,77,94,.6);animation:pop .3s ease}
.view{animation:viewIn .35s cubic-bezier(.2,.7,.2,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}}
/* phones: floating glass tab bar at the bottom, like an app */
@media(max-width:700px){
  .pnav{position:fixed;top:auto;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));margin:0;z-index:40;border-radius:26px;padding:6px;background:rgba(24,22,28,.7)}
  .pnav button{border-radius:20px;padding:9px 2px 8px;letter-spacing:.06em;text-transform:none;font-size:11px}
  body:has(.pnav) #app{padding-bottom:120px}
  body:has(.pnav) #toasts{bottom:calc(100px + env(safe-area-inset-bottom))}
}

/* ---------- dossier ---------- */
.dhead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.03));box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.hex{width:78px;height:78px;min-width:78px;aspect-ratio:1;align-self:center;border-radius:50%;padding:2.5px;background:conic-gradient(from 200deg,#fbe7b0,#8a5f22,#d4a24c,#fbe7b0);display:grid;flex:none;box-shadow:0 8px 30px rgba(212,162,76,.25);animation:ringIn .9s cubic-bezier(.2,.7,.2,1) both}
.hex span{display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 30% 25%,#2a2530,#121117 70%);font-weight:500;font-size:24px;letter-spacing:.02em;background-clip:padding-box}
.hex span{color:var(--gold2)}
/* brief */
.bsec{border-top:1px solid var(--line);padding:16px 0}
.bsec:first-of-type{border-top:0}
.bsec h3{margin:0 0 10px;font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--gold2);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bsec p{margin:0;font-size:16.5px;line-height:1.6}
.bsec ul{margin:0;padding-left:20px}.bsec li{font-size:15.5px;line-height:1.55;margin-bottom:8px}
.bsec small{display:block;margin-top:8px;font-size:12.5px;color:var(--muted);line-height:1.45}
.bsec.goal{background:linear-gradient(90deg,rgba(212,162,76,.12),transparent 85%);border:1px solid rgba(212,162,76,.3);border-radius:16px;padding:14px 16px;margin-bottom:6px}
.bsec.goal p{font-size:17.5px}
.bsec.held h3{color:var(--cyan)}
.bsec.secret{border:1px solid rgba(255,77,94,.45);background:var(--red-dim);border-radius:16px;padding:14px 16px}
.bsec.secret h3{color:var(--red2)}
.bsec.costume p{font-style:italic;color:#e6dccb}
.shr{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;margin-bottom:8px;border:1px solid var(--line);border-radius:14px;background:var(--glass);cursor:pointer;font-size:15.5px;line-height:1.5;transition:.2s}
.shr input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:#d4a24c}
.shr.done{opacity:.55}.shr.done span{text-decoration:line-through;text-decoration-color:rgba(247,220,154,.5)}
.tl{list-style:none;padding:0!important}
.tl li{display:grid;grid-template-columns:minmax(84px,auto) 1fr;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);margin:0!important}
.tl li b{font-size:12px;font-weight:500;letter-spacing:.06em;color:var(--gold2);padding-top:2px}
.bnote{border:1px dashed rgba(201,184,255,.45);border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:14px;color:var(--cyan)}
.hex span img,.person .mono-av img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.person .mono-av{overflow:hidden}
.linkish{background:none;border:0;padding:0;margin-top:9px;font-size:12.5px;color:var(--gold2);cursor:pointer;text-decoration:underline;text-decoration-color:rgba(247,220,154,.4);text-underline-offset:3px}
.guest .gphoto.sm{width:34px;height:34px}
.guest .gphoto{width:54px;height:54px;border-radius:50%;object-fit:cover;border:1.5px solid rgba(212,162,76,.6);flex:none}
.guest .contact{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;margin:6px 0 2px}
.guest .contact a{color:var(--gold2);text-decoration:none}
.hex.red{background:conic-gradient(from 200deg,#ffb3ba,#8a1424,#ff4d5e,#ffb3ba);box-shadow:0 8px 30px rgba(255,77,94,.35)}
.hex.red span{color:var(--red2)}
@keyframes ringIn{from{transform:rotate(-120deg) scale(.8);opacity:0}}
.dname{margin:0;font-size:clamp(24px,6vw,34px);line-height:1.08;font-weight:400;letter-spacing:-.01em;color:#fff}
.cls{display:inline-block;margin-top:10px;font-size:11px;letter-spacing:.14em;padding:5px 11px;border-radius:999px;border:1px solid rgba(212,162,76,.45);color:var(--gold2);background:var(--gold-dim);line-height:1.4}
.cls.red{border-color:rgba(255,77,94,.6);color:var(--red2);background:var(--red-dim);box-shadow:0 0 16px rgba(255,77,94,.25)}
.cls.blue{border-color:rgba(201,184,255,.6);color:var(--cyan);background:rgba(201,184,255,.08)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:16px}
.kv div{border:1px solid var(--line);border-radius:16px;padding:10px 13px;background:var(--glass)}
.kv b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--dim);font-weight:500;margin-bottom:3px;text-transform:uppercase}
.kv span{font-size:14px;font-weight:600}
.sec{padding:18px 0;border-top:1px solid var(--line);animation:rise .4s ease both}
.sec:first-child{border-top:0}
.sec h3{margin:0 0 8px;font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700;display:flex;gap:8px;align-items:center}
.sec p{margin:0;font-size:16.5px;line-height:1.7;color:#ece6da;max-width:72ch}
.sec.key{background:linear-gradient(90deg,rgba(212,162,76,.1),transparent 80%);border-left:2px solid var(--gold);padding-left:16px;border-top:0;border-radius:0 16px 16px 0}
.sec.key h3{color:var(--gold2)}
.sec.role p{font-style:italic;color:var(--muted)}
.sealed{border:1px solid rgba(255,77,94,.35);border-radius:10px;padding:12px;background:repeating-linear-gradient(135deg,rgba(255,77,94,.07) 0 10px,transparent 10px 20px)}
.sealed .bars{display:flex;flex-direction:column;gap:6px}
.sealed .bars i{display:block;height:12px;background:#1a0a10;border-radius:2px;box-shadow:inset 0 0 0 1px rgba(255,77,94,.25)}
.sealed small{display:block;margin-top:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--red2)}
.stamp{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--dim);text-align:center;margin-top:8px}

/* ---------- who's who ---------- */
.dir-tools{display:flex;gap:8px;margin-bottom:12px}
.dir-tools .input{flex:1}
.dir-group{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;margin:16px 0 8px;display:flex;align-items:center;gap:10px}
.dir-group::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(212,162,76,.4),transparent)}
.dir{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.person{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;border:1px solid var(--line);border-radius:16px;padding:12px;background:rgba(255,255,255,.04);animation:rise .4s ease both;transition:.2s}
.person:hover{border-color:rgba(212,162,76,.45)}
.person .mono-av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:600;color:var(--gold2);background:linear-gradient(135deg,rgba(212,162,76,.22),rgba(139,108,255,.12));border:1px solid rgba(212,162,76,.4)}
.person b{display:block;font-size:15px}
.person .ti{display:block;font-size:12.5px;color:var(--cyan);margin:2px 0 5px}
.person p{margin:0;font-size:13.5px;line-height:1.5;color:#cfc7b8}
.person.me{border-color:var(--gold);box-shadow:0 0 18px rgba(212,162,76,.18)}
.person.gone{opacity:.62}
.person.gone b{text-decoration:line-through;text-decoration-color:rgba(255,77,94,.6)}
.person .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}

/* ---------- evidence / memories / map / hints ---------- */
.ev{border:1px solid var(--line2);border-radius:16px;background:rgba(255,255,255,.04);margin-bottom:10px;overflow:hidden;animation:rise .35s ease both}
.ev summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;align-items:center;gap:10px}
.ev summary::-webkit-details-marker{display:none}
.ev summary .t{flex:1;font-weight:700;font-size:15px}
.ev summary .when{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.ev summary::after{content:"+";font-family:var(--mono);color:var(--gold);font-size:18px;transition:transform .2s}
.ev[open] summary::after{transform:rotate(45deg)}
.ev .body{padding:0 14px 14px;font-size:15.5px;line-height:1.7;color:#ece6da;white-space:pre-line;animation:rise .35s ease both}
.ev .src{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--cyan);margin-bottom:8px;white-space:normal}
.ev .who{font-family:var(--mono);font-size:11px;color:var(--gold);margin-bottom:8px;white-space:normal}
.ev.new{border-color:var(--gold);box-shadow:0 0 22px rgba(212,162,76,.3);animation:evglow 1.6s ease-in-out 3}
@keyframes evglow{50%{box-shadow:0 0 36px rgba(212,162,76,.6)}}
.tx{border:1px solid rgba(201,184,255,.35);border-radius:16px;padding:12px 14px;margin-bottom:10px;background:linear-gradient(90deg,rgba(201,184,255,.07),transparent);animation:rise .35s ease both}
.tx .h{display:flex;gap:8px;align-items:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--cyan);margin-bottom:6px;flex-wrap:wrap}
.tx p{margin:0;font-size:15.5px;line-height:1.65;white-space:pre-line}
.tx.cue{border-color:rgba(212,162,76,.45);background:linear-gradient(90deg,rgba(212,162,76,.08),transparent)}
.tx.cue .h{color:var(--gold)}
.rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.room{border:1px solid var(--line2);border-radius:16px;padding:11px 12px;background:rgba(255,255,255,.04);display:flex;gap:10px;align-items:flex-start;transition:.4s}
.room .ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;border:1px solid var(--line2)}
.room b{display:block;font-size:14.5px}
.room small{display:block;color:var(--muted);font-size:12px;line-height:1.4;margin-top:2px}
.room.open{border-color:rgba(95,227,168,.45);background:linear-gradient(90deg,rgba(95,227,168,.07),transparent)}
.room.open .ico{border-color:var(--green);color:var(--green);box-shadow:0 0 12px rgba(95,227,168,.3)}
.room.fresh{animation:roomOpen 1.4s ease 2}
@keyframes roomOpen{50%{box-shadow:0 0 30px rgba(95,227,168,.55);transform:scale(1.02)}}
.room.closed .ico{border-color:rgba(255,77,94,.45);color:var(--red2)}
.room .st{font-family:var(--mono);font-size:10px;letter-spacing:.14em;margin-top:4px}
.room.open .st{color:var(--green)}.room.closed .st{color:var(--red2)}
.lines{font-family:var(--serif);font-size:19px;line-height:1.6;color:#f1ead8;white-space:pre-line;background:linear-gradient(180deg,rgba(212,162,76,.08),rgba(212,162,76,.02));border:1px solid rgba(212,162,76,.35);border-radius:18px;padding:14px 16px}
.lines-lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--gold);margin-bottom:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.official{border:1px solid rgba(201,184,255,.45);border-radius:16px;padding:14px;margin-top:12px;background:rgba(255,255,255,.05);animation:rise .4s ease both}
.official h4{margin:4px 0 2px;font-size:17px}
.official .src{font-family:var(--mono);font-size:11px;color:var(--cyan);margin-bottom:8px}
.official .body{white-space:pre-line;font-size:15.5px;line-height:1.7;color:#ece6da;margin-bottom:12px}
.hint{border-left:3px solid var(--gold);padding:8px 0 8px 12px;margin-bottom:10px;font-size:15.5px;line-height:1.6;animation:rise .4s ease both}
.hint b{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--gold);margin-bottom:2px}
.meter{height:10px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid var(--line);overflow:hidden;margin:10px 0 6px}
.meter i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#b98533,#f5dc93);box-shadow:0 0 14px rgba(212,162,76,.6);transition:width .6s cubic-bezier(.2,.7,.2,1)}
.btn.voted-on{border-color:var(--green);color:var(--green);background:rgba(95,227,168,.1)}

/* ---------- vote / directive / verdict ---------- */
.voted{border:1px solid rgba(95,227,168,.4);background:rgba(95,227,168,.06);border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:14px;line-height:1.5}
.voted b{color:var(--green)}
.targets{display:grid;gap:10px;margin:6px 0 16px}
.target{display:flex;gap:12px;align-items:center;border:1px solid rgba(255,77,94,.35);border-radius:16px;padding:12px 14px;background:rgba(20,4,10,.6);cursor:pointer;text-align:left;width:100%;transition:.2s}
.target.sel{border-color:var(--red);background:rgba(255,77,94,.14);box-shadow:0 0 22px rgba(255,77,94,.3)}
.target .rad{width:18px;height:18px;border-radius:50%;border:2px solid var(--red2);flex:none;display:grid;place-items:center}
.target.sel .rad::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--red)}
.target b{display:block;font-size:16px}
.target small{display:block;font-size:13px;color:var(--red2);font-family:var(--mono);margin-top:2px}
.deadstrip{border:1px solid var(--red);background:var(--red-dim);color:var(--red2);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-align:center}
.verdict-box{text-align:center}
.verdict-box .big{font-size:clamp(24px,6vw,36px);font-weight:600;margin:6px 0}
.verdict-box .alias{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--muted)}
.verdict-box p{font-size:15.5px;line-height:1.65;color:#ece6da;text-align:left}

/* ---------- host ---------- */
.tabs{display:flex;gap:6px;margin:0 0 16px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:max-content;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-radius:999px;padding:12px 16px;font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--muted);cursor:pointer;text-transform:uppercase;transition:.2s;display:flex;align-items:center;gap:7px;justify-content:center}
.tab:hover{color:var(--text)}
.tab.on{border-color:var(--gold);color:var(--gold2);background:var(--gold-dim);box-shadow:0 0 18px rgba(212,162,76,.18)}
.tab .badge{background:var(--red);color:#fff;border-radius:999px;font-size:10px;padding:1px 6px;letter-spacing:0}
[data-pane]{animation:viewIn .35s ease both}
.grid2{display:grid;grid-template-columns:1fr;gap:0 16px}
@media(min-width:900px){.grid2{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{border:1px solid var(--line);border-radius:18px;padding:14px 16px;background:var(--panel);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);animation:rise .5s ease both}
.stat b{display:block;font-size:28px;font-weight:400;color:var(--gold2);font-variant-numeric:tabular-nums}
.stat b em{font-style:normal;font-size:14px;color:var(--dim);font-weight:600}
.stat>span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.warnbar{display:flex;gap:10px;align-items:center;border:1px solid rgba(255,77,94,.5);background:linear-gradient(90deg,rgba(255,77,94,.12),transparent);border-radius:12px;padding:11px 14px;margin-bottom:14px;font-size:14px;cursor:pointer;animation:rise .4s ease both}
.warnbar b{color:var(--red2)}
.ctl{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.ctl:first-of-type{border-top:0;padding-top:0}
.ctl .txt{flex:1;min-width:0}
.ctl .txt b{display:block;font-size:15px}
.ctl .txt small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.4}
.toggle{position:relative;width:60px;height:32px;border-radius:999px;border:1px solid var(--line2);background:#141318;cursor:pointer;flex:none;transition:.25s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#6f6a60;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:.25s cubic-bezier(.3,1.4,.5,1)}

.toggle.red[aria-pressed="true"]::after{background:var(--red)}
.state{font-family:var(--mono);font-size:10px;letter-spacing:.12em;width:30px;text-align:right;color:var(--dim)}
.state.on{color:var(--green)}.state.on.r{color:var(--red2)}
.relist{display:flex;flex-direction:column;gap:8px}
.reitem{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:16px;padding:9px 11px;background:rgba(255,255,255,.04);font-size:14px;flex-wrap:wrap}

.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(90px,150px) 1fr 34px;gap:10px;align-items:center;font-size:14px}

.bar .track{height:14px;border-radius:7px;background:rgba(255,255,255,.08);overflow:hidden;border:1px solid var(--line)}
.bar .fill{height:100%;border-radius:7px;background:linear-gradient(90deg,#5b3fb0,#c9b8ff);transition:width .6s ease}
.bar.lead .fill{background:linear-gradient(90deg,#b98533,#f5dc93);box-shadow:0 0 14px rgba(212,162,76,.6)}
.bar.lead .n{color:var(--gold2);font-weight:700}
.bar .c{font-family:var(--mono);font-weight:700;text-align:right}
.dot{width:10px;height:10px;border-radius:50%;background:#3a3833;flex:none}
.dot.on{background:var(--green);box-shadow:0 0 10px var(--green);animation:pdot 2s ease-in-out infinite}
.host-notes{font-size:14.5px;line-height:1.65;color:#ece6da}.host-notes li{margin-bottom:6px}
.scenes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.linkrow{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.linkrow:first-child{border-top:0;padding-top:0}
.linkrow .u{font-family:var(--mono);font-size:12px;color:var(--cyan);word-break:break-all}
.linkrow b{display:block;font-size:14px}
@media(max-width:560px){.linkrow{grid-template-columns:1fr}}
.guest{border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;background:rgba(255,255,255,.04)}
.guest .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.guest .gn{font-weight:700;font-size:15px;flex:1;min-width:120px}
.guest .meta{font-size:12.5px;color:var(--muted);margin:6px 0 8px;line-height:1.5}
.assign{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.assign .who{font-size:12px;color:var(--dim);font-family:var(--mono);grid-column:1 / -1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.invsteps{grid-column:1 / -1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.invnote{grid-column:1 / -1;font-size:13px;color:var(--gold2);font-style:italic;line-height:1.4}
.assign .hp{grid-column:1 / -1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.pstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;margin:0 0 14px}
.pstats button{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:14px;padding:9px 11px;background:rgba(255,255,255,.04);display:flex;flex-direction:column;gap:2px}
.pstats button:hover{border-color:var(--line2)}
.pstats button.on{border-color:var(--gold);box-shadow:0 0 0 1px rgba(212,162,76,.35) inset}
.pstats b{font-size:20px;color:var(--gold2);font-weight:700}
.pstats span{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.checkedin{display:flex;align-items:center;gap:10px;border:1px solid rgba(95,227,168,.4);background:rgba(95,227,168,.07);color:var(--green);border-radius:14px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.backups{grid-column:1 / -1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.chip2{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(201,184,255,.4);color:var(--cyan);border-radius:999px;padding:3px 4px 3px 10px;font-size:12px;background:rgba(201,184,255,.06)}
.chip2 button{border:0;background:rgba(255,255,255,.08);color:inherit;border-radius:50%;width:20px;height:20px;cursor:pointer;line-height:1}
.chip2.used{border-color:rgba(95,227,168,.5);color:var(--green)}
.chip2.gone{border-color:rgba(255,77,94,.45);color:var(--red2);text-decoration:line-through}
.qrbox{background:#fff;border-radius:12px;padding:14px;display:inline-block}
.qrbox img{display:block;image-rendering:pixelated;width:240px;height:240px}
.cast-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.cast-tools .input{flex:1;min-width:160px}
.crow{border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px;background:rgba(255,255,255,.04);transition:.2s}
.crow.revoked{border-color:rgba(255,77,94,.45);background:linear-gradient(90deg,rgba(255,77,94,.08),transparent)}
.crow .l1{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.crow .cn{font-weight:700;font-size:15px}
.crow.dead .cn{color:var(--red2);text-decoration:line-through;text-decoration-color:rgba(255,77,94,.5)}
.crow .occ{color:var(--dim);font-size:12.5px;flex:1;min-width:120px}
.crow .l2{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0 10px;font-size:12.5px;color:var(--muted)}
.crow .code{font-family:var(--mono);font-weight:700;letter-spacing:.14em;color:var(--gold2);background:var(--gold-dim);border:1px solid rgba(212,162,76,.35);border-radius:6px;padding:2px 8px}
.crow .acts{display:flex;gap:6px;flex-wrap:wrap}
.pill.must{border-color:var(--red);color:#fff;background:linear-gradient(180deg,#ff5068,#c21c35)}
/* game tab */
.phase-now{border:1px solid rgba(212,162,76,.4);border-radius:20px;padding:14px;background:linear-gradient(180deg,rgba(212,162,76,.08),transparent);margin-bottom:12px}
.phase-now.flash{animation:phaseFlash 1.2s ease}
@keyframes phaseFlash{0%{box-shadow:0 0 0 rgba(212,162,76,0);transform:scale(.985)}30%{box-shadow:0 0 50px rgba(212,162,76,.55);transform:scale(1.01)}100%{box-shadow:0 0 0 rgba(212,162,76,0);transform:none}}
.phase-now .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--gold);display:flex;gap:10px;flex-wrap:wrap}
.phase-now .timer{color:var(--cyan)}
.phase-now h3{margin:4px 0 10px;font-size:22px}
.cue{font-size:14px;color:#cfc7b8;line-height:1.6;white-space:pre-line;border-left:2px solid var(--cyan);padding:2px 0 2px 12px;margin:8px 0}
.cue b{color:var(--cyan);font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;display:block;margin-bottom:2px}
.say{font-family:var(--serif);font-size:18px;line-height:1.55;color:#f1ead8;white-space:pre-line;border-left:2px solid var(--gold);padding:2px 0 2px 12px;margin:10px 0}
.say b{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--gold);display:block;margin-bottom:4px}
details.more>summary{cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--cyan);list-style:none;margin-top:6px}
details.more>summary::-webkit-details-marker{display:none}
.auto{margin:0;padding-left:18px;color:#cfc7b8;font-size:13.5px;line-height:1.7}
.phases{margin-top:12px}
.phases .ph-row{display:flex;gap:10px;align-items:center;padding:8px 2px;border-top:1px solid var(--line);font-size:14px}
.phases .ph-row .n{font-family:var(--mono);color:var(--dim);width:22px}
.phases .ph-row .tm{font-family:var(--mono);color:var(--cyan);font-size:11px;min-width:70px}
.phases .ph-row .t{flex:1}
.phases .ph-row.done .t{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(95,227,168,.5)}
.phases .ph-row.cur .t{color:var(--gold2);font-weight:700}
.progress{height:6px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;margin:2px 0 14px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));box-shadow:0 0 12px rgba(212,162,76,.6);transition:width .8s cubic-bezier(.2,.7,.2,1)}
.quick{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.quick .input{flex:1;min-width:180px}
.lockbtn{min-width:190px}
.lockbtn.on{background:linear-gradient(180deg,#ff5068,#c21c35);border-color:#ff8494;color:#fff;box-shadow:0 0 22px rgba(255,77,94,.45);animation:pulse 1.6s ease-in-out infinite}
.evrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:7px;background:rgba(255,255,255,.04);transition:.3s}
.evrow b{font-size:14.5px}
.evrow small{display:block;font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:3px}
.evrow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.log{max-height:420px;overflow:auto;font-family:var(--mono);font-size:12px;line-height:1.5}
.log div{display:grid;grid-template-columns:70px 1fr;gap:8px;padding:6px 0;border-top:1px solid var(--line);animation:rise .3s ease both}
.log div:first-child{border-top:0}
.log .t{color:var(--dim)}
.log .player{color:var(--cyan)}.log .alert{color:var(--red2)}.log .host{color:var(--text)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.check{display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer;margin:6px 0}
.check input{width:18px;height:18px;accent-color:#d4a24c}
/* the NEXT bar */
.nextbar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:30;width:min(1148px,calc(100% - 24px));display:flex;gap:12px;align-items:center;padding:10px 10px 10px 18px;border:1px solid rgba(212,162,76,.45);border-radius:24px;background:rgba(22,19,16,.72);-webkit-backdrop-filter:var(--blur);box-shadow:0 16px 40px rgba(0,0,0,.55),0 0 30px rgba(212,162,76,.15),inset 0 1px 0 rgba(255,255,255,.07);backdrop-filter:var(--blur);animation:barIn .5s cubic-bezier(.2,.8,.3,1.1) both}
@keyframes barIn{from{transform:translate(-50%,120%)}}
.nextbar .nx{flex:1;min-width:0}
.nextbar .nx small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--gold)}
.nextbar .nx b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nextbar .nx span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hold{position:relative;overflow:hidden;min-width:170px;min-height:56px;border-radius:18px;border:1px solid rgba(251,231,176,.7);background:var(--gold-grad);box-shadow:0 8px 26px rgba(212,162,76,.3),inset 0 1px 0 rgba(255,255,255,.5);color:#1a1204;font-weight:600;letter-spacing:.08em;font-size:14px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none}
.hold .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.55);pointer-events:none}
.hold .lbl2{position:relative;display:flex;flex-direction:column;line-height:1.15}
.hold .lbl2 small{font-size:9.5px;letter-spacing:.2em;opacity:.75;font-weight:700}
.hold.go{animation:goFlash .6s ease}
@keyframes goFlash{50%{box-shadow:0 0 40px rgba(245,220,147,.9);transform:scale(1.04)}}
.hold:disabled{opacity:.5;cursor:default}
body.has-nextbar #app{padding-bottom:120px}

/* ---------- overlays ---------- */
#alertbar{position:fixed;left:0;right:0;top:0;z-index:60;pointer-events:none}
.alert{pointer-events:auto;margin:8px;border-radius:12px;padding:12px 44px 12px 14px;position:relative;font-weight:700;font-size:14.5px;line-height:1.4;border:1px solid var(--red);background:linear-gradient(180deg,#5c0716,#2a030a);color:#fff;box-shadow:0 0 40px rgba(255,77,94,.55);animation:drop .4s cubic-bezier(.2,.8,.3,1.2),flash 1s steps(1) .4s infinite}
@keyframes drop{from{transform:translateY(-120%)}}
.alert .h{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--red2);margin-bottom:3px}
.alert.notice{border-color:var(--gold);background:linear-gradient(180deg,#3a2c0c,#1b1405);box-shadow:0 0 30px rgba(212,162,76,.45);animation:drop .4s cubic-bezier(.2,.8,.3,1.2)}
.alert.notice .h{color:var(--gold2)}
.alert .x{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:transparent;cursor:pointer;color:#fff}
@keyframes flash{0%{background:linear-gradient(180deg,#8a0b20,#3c040e)}50%{background:linear-gradient(180deg,#2a030a,#14020a)}}
.overlay{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;animation:ovIn .35s ease both}

.overlay .box{animation:rise .5s .1s cubic-bezier(.2,.7,.2,1) both}
#lockdown{background:radial-gradient(circle at 50% 40%,rgba(120,8,24,.96),rgba(10,2,6,.99) 70%);flex-direction:column}
#lockdown::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,rgba(255,77,94,.07) 0 22px,transparent 22px 44px);animation:slide 3s linear infinite}
@keyframes slide{to{background-position:62px 0}}
.lk{position:relative;max-width:560px}
.lk .ring{width:120px;height:120px;margin:0 auto 22px;border-radius:50%;border:3px solid var(--red);display:grid;place-items:center;box-shadow:0 0 50px rgba(255,77,94,.7),inset 0 0 30px rgba(255,77,94,.5);animation:pulse 1.4s ease-in-out infinite}

.lk .m{margin-top:20px;font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--red2)}
.fullmsg{background:rgba(7,8,11,.97);flex-direction:column;overflow-y:auto;align-items:stretch}
.fullmsg .box{max-width:560px;position:relative;width:100%;margin:auto}
.fullmsg h1{margin:0 0 12px;font-size:clamp(26px,7vw,40px);letter-spacing:.1em;font-weight:600}

.fullmsg .k{font-family:var(--mono);font-size:11px;letter-spacing:.22em;margin-bottom:14px}
.fullmsg.dead{background:radial-gradient(circle at 50% 40%,rgba(90,0,14,.97),rgba(4,0,2,.99) 70%)}
.fullmsg.dead h1{color:#fff;text-shadow:0 0 30px var(--red)}
.fullmsg.dead .k,.fullmsg.blocked .k{color:var(--red2)}
.fullmsg.reveal{background:radial-gradient(circle at 50% 40%,rgba(60,0,10,.97),rgba(2,0,2,.99) 72%)}

.fullmsg.memory .msg{border-color:rgba(212,162,76,.45);background:rgba(20,15,4,.8);font-family:var(--serif);font-size:21px;box-shadow:0 0 30px rgba(212,162,76,.15)}
.wipe{animation:wipe 1.8s cubic-bezier(.3,.6,.3,1) .25s both}

.typed{font-family:var(--mono);font-size:13px;line-height:1.8;color:#9fc3ff;text-align:left;background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 18px}

/* ---------- host: control room ---------- */

.hud{display:flex;gap:6px 16px;flex-wrap:wrap;align-items:center;margin:0 0 14px;padding:9px 14px;border:1px solid var(--line);border-radius:16px;background:rgba(14,13,18,.6);font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}

  const id = ui.selTarget; if (!id) return;
  openModal(`<div class="ph"><h2 style="color:var(--red2)">Confirm Execution</h2></div>
    <p style="font-size:17px;line-height:1.6;margin:0 0 8px">Target: <b style="color:var(--red2)">${esc(rname(id))}</b></p>
    <p class="note" style="margin:0 0 18px">This can't be undone. A red alert goes out to every screen immediately.</p>
    <div class="row-gap"><button class="btn danger" id="doKill">EXECUTE</button><button class="btn ghost" data-close>ABORT</button></div>`);
  $('#doKill').onclick = () => {
    if (!S.kill) {
      backend.update({
        'live/kill': { victim: id, ts: backend.TS() },
        'live/alert': { id: uid('a'), type: 'kill', text: `${rname(id)} has been found dead. All personnel remain where you are. Do not leave the premises.`, ts: backend.TS() }
      });
      log(`THE KILLER STRUCK: ${rname(id)} is dead`, 'alert');
    }
    closeModal();
  };
}

/* ---------------- host: actions (one place, used by every button) ---------------- */
const A = {
  flag(f, v) { const upd = { ['live/flags/' + f]: v }; if (f === 'hints' && v) upd['live/hintTotal'] = HOST.hints.length; backend.update(upd); log(`${FLAGS[f]} ${v ? 'ON' : 'OFF'}`); },
  scene(scene, extra = {}) { backend.update({ 'live/display': Object.assign({ scene, ts: backend.TS() }, extra) }); },
  broadcast(text) { backend.update({ 'live/alert': { id: uid('a'), type: 'notice', text, ts: backend.TS() } }); log(`Announcement: ${text}`); },
  death(id, text) { backend.update({ ['live/deaths/' + id]: backend.TS(), 'live/alert': { id: uid('a'), type: 'kill', text, ts: backend.TS() } }); log(`Death announced: ${rname(id)}`, 'alert'); },
  undoDeath(id) { backend.update({ ['live/deaths/' + id]: null, ['live/succession/' + id]: null }); log(`Death undone: ${rname(id)}`); },
  room(id, open) { backend.update({ ['live/rooms/' + id]: open ? backend.TS() : null, ...(open ? { 'live/alert': { id: uid('a'), type: 'notice', text: `${roomName(id)} is now open to investigators.`, ts: backend.TS() } } : {}) }); log(`${roomName(id)} ${open ? 'opened' : 'sealed'}`); },
  deliver(id) { backend.update({ ['live/delivered/' + id]: backend.TS() }); log(`Sent to the Inspector: ${(HOST.ev[id] || {}).title || id}`); },
  release(id, how) { const e = HOST.ev[id]; if (!e || S.evidence[id]) return; revealEvidence(e, how === 'official' ? HOST.inspectorId : 'host', how === 'official' ? 'Official report' : roomName(e.room), how === 'official' ? 'official' : 'found'); log(`Host released: ${e.title}`); },
  retract(id) { backend.update({ ['live/evidence/' + id]: null }); log(`Evidence retracted: ${(HOST.ev[id] || {}).title || id}`); },
  unlockHint() {
    const round = Object.keys(S.hintsOpen).length, text = HOST.hints[round]; if (!text || S.hintsOpen[round]) return;
    backend.update({ [`live/hintsOpen/${round}`]: { text, ts: backend.TS() }, 'live/alert': { id: uid('a'), type: 'notice', text: `HINT ${round + 1}: ${text}`, ts: backend.TS() } });
    log(`Hint ${round + 1} unlocked`);
  },
  async message(id, text) {
    const c = HOST.chars[id]; if (!c || !text) return;
    if (!HOST.msgKeys[id]) HOST.msgKeys[id] = await deriveMsgKey(c.code);
    const blob = await encryptJSON(HOST.msgKeys[id], { text });
    const mid = uid('m'); HOST.threadCache[mid] = text;
    await backend.update({ [`live/msgs/${id}/${mid}`]: Object.assign(blob, { ts: backend.TS() }) });
    log(`Message sent to ${c.name}`); toast('MESSAGE SENT', `Delivered to ${c.name}.`, 'ok');
  },
  revoke(id) { backend.update({ ['live/revoked/' + id]: backend.TS() }); log(`Access revoked: ${rname(id)}`); toast('ACCESS REVOKED', rname(id), 'err'); },
  restore(id) { backend.update({ ['live/revoked/' + id]: null }); log(`Access restored: ${rname(id)}`); toast('ACCESS RESTORED', rname(id), 'ok'); },
  kick(id) { backend.update({ ['live/kick/' + id]: Date.now(), [PL(id) + '/lastSeen']: 0 }); log(`Signed out: ${rname(id)}`); toast('DEVICE SIGNED OUT', rname(id), 'ok'); },
  clearVote(id) { backend.update({ [PL(id) + '/vote']: null }); log(`Vote cleared: ${rname(id)}`); },
  clearVerdict() { backend.update({ 'live/verdict': null }); log('Verdict cleared'); }
};
function tallyRows() {
  const counts = {};
  HOST.list.forEach(c => { const p = playerRec(c.id); if (p && p.vote && p.vote.suspect) counts[p.vote.suspect] = (counts[p.vote.suspect] || 0) + 1; });
  return Object.entries(counts).sort((a, b) => b[1] - a[1]);
}
const topVoted = () => (tallyRows()[0] || [])[0];
function verdictReveal() {

/* RSVP photos follow the guest onto whichever character they're assigned (and onto a backup role

async function syncPhotoLinks() {
  if (!ui.dirKey || !HOST.rsvpKey) return;
  await syncRsvpSecrets(); await syncHostPhotos();
  const want = {}, vetoed = new Set(), np = HOST.assign.nophoto || {};
  // 1. the photo sent with the RSVP (the guest's own, or the one they sent for their plus-one)
  for (const [key, cid] of Object.entries(HOST.assign.map || {})) {
    if (np[key]) { vetoed.add(cid); continue; }
    const [rid, plus] = key.split('#'), r = S.rsvps[rid], sec = HOST.rsvpSec[rid];
    const photo = sec && sec.d ? (plus ? sec.d.plusPhoto : sec.d.photo) : null;
    if (r && r.sec && photo) want[cid] = { src: 'rsvp:' + key + ':' + r.sec.iv, photo, ts: +r.ts || 0 };
    const hp = hostPhotoFor(key);

  }

  }

  for (const [deadId, s] of Object.entries(S.succession)) {
    if (!s || !s.to || want[s.to] || vetoed.has(s.to) || !want[deadId]) continue;
    want[s.to] = want[deadId].keep ? (S.photos[deadId] ? { copy: S.photos[deadId] } : null) : Object.assign({}, want[deadId], { src: want[deadId].src + '>' + s.to });
    if (!want[s.to]) delete want[s.to];
  }
  const upd = {};
  for (const [cid, w] of Object.entries(want)) {
    const cur = S.photos[cid];
    if (w.keep) continue;
    if (w.copy) { const src = 'copy:' + w.copy.iv; if (!cur || cur.src !== src) upd['live/photos/' + cid] = { iv: w.copy.iv, ct: w.copy.ct, src, b: w.copy.b || HOST.built }; continue; }
    if (cur && cur.src === w.src && cur.b === HOST.built) continue;
    upd['live/photos/' + cid] = Object.assign(await encryptJSON(ui.dirKey, { p: w.photo }), { src: w.src, b: HOST.built });
  }
  for (const cid of Object.keys(S.photos)) if (!want[cid]) upd['live/photos/' + cid] = null;
  if (Object.keys(upd).length) await backend.update(upd);
}

    }
  }
  out.pending = false; JV.busy = false; JV.stream = null; renderJarvis();
}

/* ---------------- the case files (public recap, published after the game) ---------------- */
function compileRecap(opts) {
  const P = party(), v = S.verdict || {}, gone = dead(), kc = HOST.chars[HOST.killerId] || {};
  const who = {}; for (const [key, cid] of Object.entries(HOST.assign.map)) if (!who[cid]) who[cid] = key;
  const first = key => { const r = S.rsvps[key.replace(/#p$/, '')]; const n = r ? (/#p$/.test(key) ? r.plusOneName : r.name) : ''; return (n || '').trim().split(/\s+/)[0] || ''; };
  const played = HOST.list.filter(c => who[c.id] || playerRec(c.id) || c.mustCast);
  const counts = {}; HOST.list.forEach(c => { const p = playerRec(c.id); if (p && p.vote && p.vote.suspect) counts[p.vote.suspect] = (counts[p.vote.suspect] || 0) + 1; });
  const conf = HOST.show.flatMap(p => p.actions || []).find(a => a.scene === 'confessions' && a.order);
  const order = ((conf && conf.order) || []).filter(id => HOST.chars[id] && HOST.chars[id].confession && !(id in gone) && (who[id] || playerRec(id) || !Object.keys(who).length));
  return {
    ts: backend.TS(), title: P.title || 'The Last Toast', date: P.date || '', names: !!opts.names,
    killer: { name: kc.name || v.killerName || '', alias: HOST.solution.alias || '', summary: HOST.solution.summary || '' },
    accused: v.accused ? rname(v.accused) : '', caught: !!(v.accused && v.accused === HOST.killerId), solvers: v.solvers || [],
    tally: Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([id, n]) => [rname(id), n]),
    confessions: order.map(id => ({ name: HOST.chars[id].name, text: HOST.chars[id].confession, lie: !!HOST.chars[id].killer })),
    cast: (played.length ? played : HOST.list).map(c => {
      const key = (c.sections || []).find(s => s.key);
      return { name: c.name, occ: c.occ || '', player: opts.names && who[c.id] ? first(who[c.id]) : '', died: c.id in gone, killer: !!c.killer, inspector: !!c.inspector, secret: key ? key.t : '' };
    }),
    evidence: releasedEvidence(S).reverse().map(e => ({ title: e.title, src: e.src || '', body: e.body || '' })),
    awards: opts.awards, album: opts.album, note: opts.note
  };
}

/* ---------------- overlays (players) ---------------- */
function renderOverlays() {
  const isHost = ME && ME.type === 'host', c = ME && ME.type === 'player' ? ME.c : null;
  const blocked = c && (S.revoked[c.id] ? 'revoked' : S.flags.sealed ? 'sealed' : null);
  // the Inspector reads to the room during lockdowns, so their screen is never blocked
  const lockOn = S.flags.lockdown && !isHost && !(c && c.inspector) && !ui.bypass && !blocked;
  $('#lockdown').classList.toggle('hidden', !lockOn);
  $('#bypassWrap').classList.toggle('hidden', !isHostDevice());

  const a = S.alert, bar = $('#alertbar'), showAlert = a && a.id !== store.get('alertDismissed') && !blocked;
  patch(bar, showAlert ? a.id : 'none', showAlert ? `<div class="alert ${a.type === 'notice' ? 'notice' : ''}" role="alert"><span class="h">${a.type === 'kill' ? '⚠ CRITICAL INCIDENT · ALL PERSONNEL' : '◆ ANNOUNCEMENT'}</span>${esc(a.text)}<button class="x" aria-label="Dismiss" id="alertX">✕</button></div>` : '');
  const x = $('#alertX'); if (x) x.onclick = () => { store.set('alertDismissed', a.id); renderOverlays(); };
  $('#app').style.paddingTop = showAlert ? (bar.offsetHeight + 12) + 'px' : '';

  const fm = $('#fullmsg'), dd = dead();
  let html = '', sig = 'none', bind = null;
  const deathKey = c && (c.id in dd) ? S.epoch + ':' + c.id + ':' + dd[c.id] : null;
  const v = S.verdict, sc = ui.scan;
  const mem = c ? myMemories().find(m => store.get(memKey(m.j)) !== '1') : null;
  const unread = c ? myMessages().filter(m => !m.read).reverse()[0] : null;
  const insp = c && c.inspector ? ME.inspector : null;
  const newOfficial = insp ? (insp.official || []).find(e => S.delivered[e.id] && !S.evidence[e.id] && store.get(offKey(e.id)) !== '1') : null;
  const lines = insp ? currentLines() : null, newLines = lines && store.get(lineKey(lines.id)) !== '1' ? lines : null;

  if (blocked === 'revoked') {
    sig = 'revoked'; html = `<div class="overlay fullmsg blocked"><div class="box"><div class="k">KANE-OS · SECURITY NOTICE</div><h1>ACCESS REVOKED</h1><p>Your clearance has been suspended by the Command Center.</p><button class="btn ghost" id="blkOut">LOG OUT</button></div></div>`;
    bind = () => $('#blkOut').onclick = () => signOut(false);
  } else if (blocked === 'sealed') {
    sig = 'sealed'; html = `<div class="overlay fullmsg blocked"><div class="box"><div class="k">KANE-OS · DATABASE STATUS</div><h1>DATABASE SEALED</h1><p>All personnel files are sealed until further notice. Stand by.</p><button class="btn ghost" id="blkOut">LOG OUT</button></div></div>`;
    bind = () => $('#blkOut').onclick = () => signOut(false);
  } else if (deathKey && store.get('termAck') !== deathKey) {
    sig = 'dead'; html = `<div class="overlay fullmsg dead"><div class="box"><div class="k">KANE-OS · PERSONNEL STATUS UPDATE</div><h1>YOU HAVE BEEN<br>TERMINATED</h1>
      <p>You've been murdered. Play it out, then stay in character as the body until the host tells you otherwise.</p><p style="color:var(--red2)">Don't reveal what your screen says to anyone.</p><button class="btn danger" id="termAck" style="margin-top:8px">ACKNOWLEDGE</button></div></div>`;
    bind = () => $('#termAck').onclick = () => { store.set('termAck', deathKey); renderOverlays(); };
  } else if (c && deathKey && ui.succ) {
    const n = ui.succ;
    sig = 'succ' + n.id; html = `<div class="overlay fullmsg succ"><div class="box"><div class="antenna green"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2fe39b" stroke-width="2" stroke-linecap="round"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg></div>
      <div class="k">YOUR STORY ISN'T OVER</div><h1 style="font-size:clamp(24px,6vw,34px)">You return as<br><span style="color:var(--green)">${esc(n.name)}</span></h1>
      <p>When the host gives you the nod, slip away from your body and come back as someone new. Your new dossier is ready.</p><button class="btn gold" id="succGo">BECOME ${esc(n.name.toUpperCase())}</button></div></div>`;
    bind = () => $('#succGo').onclick = becomeNext;
  } else if (c && v && v.stage === 'reveal' && !newLines && store.get('verdictAck') !== String(v.ts)) {
    sig = 'verdict' + v.ts; html = `<div class="overlay fullmsg verdict"><div class="box panel gold" style="text-align:left">${verdictHTML(v, c)}<div style="text-align:center;margin-top:10px"><button class="btn gold" id="verdictAck">CLOSE THE FILE</button></div></div></div>`;
    bind = () => $('#verdictAck').onclick = () => { store.set('verdictAck', String(v.ts)); renderOverlays(); };
  } else if (c && c.killer && S.flags.killerKnows && store.get('revealSeen') !== S.epoch) {
    // the killer's big moment comes before any of their memories
    sig = 'reveal'; html = `<div class="overlay fullmsg reveal"><div class="box"><div class="k">CLEARANCE ELEVATED · FILE UNSEALED</div><h1>YOU ARE THE KILLER</h1>
      <div class="typed">${(c.killer.reveal || []).map((l, i) => `<span style="animation-delay:${0.5 + i * 0.45}s">&gt; ${esc(l)}</span>`).join('')}</div>
      <p>Your full file is now unsealed and your plan is in your memories. Keep your screen hidden. Stay warm. Stay calm.</p><button class="btn danger" id="revealAck">CONTINUE</button></div></div>`;
    bind = () => $('#revealAck').onclick = () => { store.set('revealSeen', S.epoch); renderOverlays(); };
  } else if (sc) {
    sig = (sc.kind === 'found' ? 'scanfound' : 'scan') + sc.kind + (sc.e ? sc.e.id : '') + (sc.e && S.evidence[sc.e.id] ? 'r' : '');
    const close = `<button class="btn ghost" id="scanClose">CLOSE</button>`;
    if (sc.kind === 'found') {
      const e = sc.e, rel = S.evidence[e.id];
      html = `<div class="overlay fullmsg found"><div class="box"><div class="antenna gold"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#f5dc93" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg></div>
        <div class="k">EVIDENCE FOUND · ${esc(roomName(e.room).toUpperCase())}</div>
        <div class="evbody"><h2>${esc(e.title)}</h2><div class="src">SOURCE · ${esc(e.src)}</div><div class="txt">${esc(e.body)}</div></div>
        ${rel ? `<p class="note">${rel.by && rel.by !== 'host' ? 'Already revealed to everyone by ' + esc(rname(rel.by)) + '.' : 'Already revealed to everyone.'}</p>${close}`
          : `<p class="note">Only you have seen this. Reveal it to everyone, or keep it to yourself for now (it's saved under "Evidence You Found").</p><div class="row-gap" style="justify-content:center"><button class="btn gold" id="scanReveal">REVEAL TO EVERYONE</button><button class="btn ghost" id="scanClose">KEEP IT FOR NOW</button></div>`}</div></div>`;
      bind = () => { const r = $('#scanReveal'); if (r) r.onclick = () => { revealEvidence(e, c.id, roomName(e.room), 'found'); log(`${c.name} revealed "${e.title}"`, 'player'); ui.scan = null; toast('REVEALED', 'Everyone can now see it.', 'ok'); render(); }; $('#scanClose').onclick = () => { ui.scan = null; render(); }; };
    } else {
      const msg = { nothing: ['NOTHING OF INTEREST', "This tag isn't part of the investigation."], dead: ['THE DEAD DON\'T INVESTIGATE', 'You can watch and listen, but you can\'t collect evidence.'],
        sealed: ['SEALED AREA', `${sc.e ? esc(roomName(sc.e.room)) : 'This room'} is sealed. Leave it as you found it until your phone says it's open.`], locked: ['LOCKED', 'This item can\'t be examined yet. Try again later in the night.'] }[sc.kind];
      html = `<div class="overlay fullmsg blocked"><div class="box"><div class="k">KANE-OS · EVIDENCE SCAN</div><h1 style="font-size:clamp(22px,6vw,32px)">${msg[0]}</h1><p>${msg[1]}</p>${close}</div></div>`;
      bind = () => $('#scanClose').onclick = () => { ui.scan = null; render(); };
    }
  } else if (newOfficial) {
    sig = 'off' + newOfficial.id; html = `<div class="overlay fullmsg incoming"><div class="box"><div class="antenna"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#c9b8ff" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></div>
      <div class="k">OFFICIAL REPORT RECEIVED</div><h1 style="font-size:clamp(22px,6vw,32px)">${esc(newOfficial.title)}</h1><p>It's in your Case File. Read it aloud to the room, then press <b>RELEASE TO ALL</b>.</p><button class="btn gold" id="offAck">OPEN CASE FILE</button></div></div>`;
    bind = () => $('#offAck').onclick = () => { store.set(offKey(newOfficial.id), '1'); renderOverlays(); goView('now', 'casePanel'); };
  } else if (newLines) {
    sig = 'lines' + newLines.id; html = `<div class="overlay fullmsg memory"><div class="box"><div class="k">YOUR LINES · ${esc(newLines.title.toUpperCase())}</div><div class="msg wipe">${esc(fillLines(newLines.text))}</div><button class="btn gold" id="lineAck">GOT IT</button></div></div>`;
    bind = () => $('#lineAck').onclick = () => { store.set(lineKey(newLines.id), '1'); renderOverlays(); goView('now', 'casePanel'); };
  } else if (mem) {
    sig = 'mem' + mem.j; html = `<div class="overlay fullmsg memory"><div class="box"><div class="k">${mem.cue ? 'INSTRUCTION FROM THE HOST' : 'A MEMORY SURFACES'}</div><div class="msg wipe">${esc(mem.text)}</div><button class="btn gold" id="memAck">${mem.cue ? 'UNDERSTOOD' : 'REMEMBER THIS'}</button></div></div>`;
    bind = () => $('#memAck').onclick = () => { store.set(memKey(mem.j), '1'); renderOverlays(); };
  } else if (unread) {
    sig = 'msg' + unread.mid; html = `<div class="overlay fullmsg incoming"><div class="box"><div class="k">MESSAGE FROM THE COMMAND CENTER</div><div class="msg wipe">${esc(unread.text)}</div><button class="btn gold" id="msgAck">ACKNOWLEDGE</button></div></div>`;
    bind = () => $('#msgAck').onclick = () => ackMsg(unread.mid);
  }
  if (patch(fm, sig, html) && sig !== 'none') {
    if (/^(mem|lines|off|succ|scanfound)/.test(sig)) buzz([120, 80, 120]);
    if (sig.startsWith('verdict') && c && v && ((playerRec(c.id) && playerRec(c.id).vote && playerRec(c.id).vote.suspect === v.killer) || (c.inspector && v.accused === v.killer))) confetti();
  }
  if (bind && fm.innerHTML) bind();
  document.body.style.overflow = (lockOn || sig !== 'none') ? 'hidden' : '';
}
$('#bypassBtn').addEventListener('click', () => { ui.bypass = true; renderOverlays(); toast('HOST OVERRIDE', 'Lockdown bypassed on this device only.', 'ok'); });

boot();
</script>
</body>
</html>
