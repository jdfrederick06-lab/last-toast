<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Kane Oil Database</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
/* ---------- login ---------- */
.login-wrap{min-height:calc(100vh - 40px);display:flex;align-items:center;justify-content:center;padding:20px 0}
.login{width:100%;max-width:440px;text-align:center}
.login .logo{margin:0 auto 14px;width:84px;height:84px;position:relative;filter:drop-shadow(0 0 18px rgba(217,178,91,.55));animation:float 5s ease-in-out infinite}
.login .logo::before{content:"";position:absolute;inset:-18px;border-radius:50%;border:1px solid rgba(90,214,255,.35);animation:radar 2.8s ease-out infinite}
@keyframes radar{from{transform:scale(.6);opacity:.9}to{transform:scale(1.5);opacity:0}}
@keyframes float{50%{transform:translateY(-4px)}}
.login h1{margin:0;font-size:22px;letter-spacing:.22em;font-weight:800;color:var(--gold2);text-shadow:0 0 22px rgba(217,178,91,.35)}
.login .tag{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--cyan);margin:6px 0 20px;text-transform:uppercase}
.scanwait{border:1px solid var(--cyan);background:rgba(90,214,255,.08);color:var(--cyan);border-radius:10px;padding:10px 12px;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;margin-bottom:14px}
.term{text-align:left;font-family:var(--mono);font-size:12px;line-height:1.7;color:#7fb2ff;background:rgba(2,6,14,.85);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:16px;min-height:96px}
.term .ok{color:var(--green)}.term .err{color:var(--red2)}
.term div{animation:typein .25s ease both}
@keyframes typein{from{opacity:0;transform:translateX(-4px)}}
.term .cursor{display:inline-block;width:8px;height:14px;background:var(--cyan);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.code-input{text-align:center;letter-spacing:.3em;font-family:var(--mono);font-size:20px;text-transform:uppercase;font-weight:700}
.login .foot{margin-top:18px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--dim)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.login-err{color:var(--red2);font-family:var(--mono);font-size:12px;letter-spacing:.1em;min-height:18px;margin-top:10px}
.loading{min-height:60vh;display:grid;place-items:center;font-family:var(--mono);letter-spacing:.2em;color:var(--cyan);font-size:12px}

/* ---------- dossier ---------- */
.dhead{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.hex{width:78px;height:88px;position:relative;display:grid;place-items:center;flex:none}
.hex svg{position:absolute;inset:0}
.hex span{position:relative;font-weight:800;font-size:24px;color:var(--gold2);text-shadow:0 0 12px rgba(217,178,91,.6)}
.hex.red span{color:var(--red2);text-shadow:0 0 12px rgba(255,59,84,.7)}
.dname{margin:0;font-size:clamp(22px,5.4vw,32px);line-height:1.1;font-weight:800}
.cls{display:inline-block;margin-top:10px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;padding:5px 9px;border-radius:7px;border:1px solid rgba(217,178,91,.45);color:var(--gold2);background:var(--gold-dim);line-height:1.4}
.cls.red{border-color:rgba(255,59,84,.6);color:var(--red2);background:var(--red-dim);box-shadow:0 0 16px rgba(255,59,84,.25)}
.cls.blue{border-color:rgba(90,214,255,.6);color:var(--cyan);background:rgba(90,214,255,.08)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:16px}
.kv div{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:rgba(3,7,16,.5)}
.kv b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--dim);font-weight:500;margin-bottom:3px;text-transform:uppercase}
.kv span{font-size:14px;font-weight:600}
.sec{padding:16px 0;border-top:1px dashed rgba(88,140,255,.18)}
.sec:first-child{border-top:0}
.sec h3{margin:0 0 8px;font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700;display:flex;gap:8px;align-items:center}
.sec p{margin:0;font-size:16.5px;line-height:1.7;color:#dbe4f4;max-width:72ch}
.sec.key{background:linear-gradient(90deg,rgba(217,178,91,.08),transparent);border-left:2px solid var(--gold);padding-left:14px;border-top:0;border-radius:0 8px 8px 0}
.sec.key h3{color:var(--gold2)}
.sec.role p{font-style:italic;color:var(--muted)}
.sealed{border:1px solid rgba(255,59,84,.35);border-radius:10px;padding:12px;background:repeating-linear-gradient(135deg,rgba(255,59,84,.07) 0 10px,transparent 10px 20px)}
.sealed .bars{display:flex;flex-direction:column;gap:6px}
.sealed .bars i{display:block;height:12px;background:#1a0a10;border-radius:2px;box-shadow:inset 0 0 0 1px rgba(255,59,84,.25)}
.sealed small{display:block;margin-top:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--red2)}
.stamp{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--dim);text-align:center;margin-top:8px}

/* ---------- evidence / memories / map ---------- */
.ev{border:1px solid var(--line2);border-radius:12px;background:rgba(3,7,16,.6);margin-bottom:10px;overflow:hidden}
.ev summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;align-items:center;gap:10px}
.ev summary::-webkit-details-marker{display:none}
.ev summary .t{flex:1;font-weight:700;font-size:15px}
.ev summary .when{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.ev summary::after{content:"+";font-family:var(--mono);color:var(--gold);font-size:18px;transition:transform .2s}
.ev[open] summary::after{transform:rotate(45deg)}
.ev .body{padding:0 14px 14px;font-size:15.5px;line-height:1.7;color:#d8e2f3;white-space:pre-line;animation:rise .35s ease both}
.ev .src{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--cyan);margin-bottom:8px;white-space:normal}
.ev .who{font-family:var(--mono);font-size:11px;color:var(--gold);margin-bottom:8px;white-space:normal}
.ev.new{border-color:var(--gold);box-shadow:0 0 22px rgba(217,178,91,.3);animation:evglow 1.6s ease-in-out 3}
@keyframes evglow{50%{box-shadow:0 0 36px rgba(217,178,91,.6)}}
.tx{border:1px solid rgba(90,214,255,.35);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:linear-gradient(90deg,rgba(90,214,255,.07),transparent)}
.tx .h{display:flex;gap:8px;align-items:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--cyan);margin-bottom:6px;flex-wrap:wrap}
.tx p{margin:0;font-size:15.5px;line-height:1.65;white-space:pre-line}
.tx.cue{border-color:rgba(217,178,91,.45);background:linear-gradient(90deg,rgba(217,178,91,.08),transparent)}
.tx.cue .h{color:var(--gold)}
.rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.room{border:1px solid var(--line2);border-radius:12px;padding:11px 12px;background:rgba(3,7,16,.55);display:flex;gap:10px;align-items:flex-start;transition:.3s}
.room .ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;border:1px solid var(--line2)}
.room b{display:block;font-size:14.5px}
.room small{display:block;color:var(--muted);font-size:12px;line-height:1.4;margin-top:2px}
.room.open{border-color:rgba(47,227,155,.45);background:linear-gradient(90deg,rgba(47,227,155,.07),transparent)}
.room.open .ico{border-color:var(--green);color:var(--green);box-shadow:0 0 12px rgba(47,227,155,.3)}
.room.closed .ico{border-color:rgba(255,59,84,.45);color:var(--red2)}
.room .st{font-family:var(--mono);font-size:10px;letter-spacing:.14em;margin-top:4px}
.room.open .st{color:var(--green)}.room.closed .st{color:var(--red2)}
.lines{font-family:var(--serif);font-size:19px;line-height:1.6;color:#f1ead8;white-space:pre-line;background:linear-gradient(180deg,rgba(217,178,91,.08),rgba(217,178,91,.02));border:1px solid rgba(217,178,91,.35);border-radius:12px;padding:14px 16px}
.lines-lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--gold);margin-bottom:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.official{border:1px solid rgba(90,214,255,.45);border-radius:12px;padding:14px;margin-top:12px;background:rgba(3,10,22,.7)}
.official h4{margin:4px 0 2px;font-size:17px}
.official .src{font-family:var(--mono);font-size:11px;color:var(--cyan);margin-bottom:8px}
.official .body{white-space:pre-line;font-size:15.5px;line-height:1.7;color:#d8e2f3;margin-bottom:12px}

/* ---------- vote / directive / verdict ---------- */
.voted{border:1px solid rgba(47,227,155,.4);background:rgba(47,227,155,.06);border-radius:11px;padding:12px 14px;margin-bottom:14px;font-size:14px;line-height:1.5}
.voted b{color:var(--green)}
.targets{display:grid;gap:10px;margin:6px 0 16px}
.target{display:flex;gap:12px;align-items:center;border:1px solid rgba(255,59,84,.35);border-radius:12px;padding:12px 14px;background:rgba(20,4,10,.6);cursor:pointer;text-align:left;width:100%;transition:.2s}
.target.sel{border-color:var(--red);background:rgba(255,59,84,.14);box-shadow:0 0 22px rgba(255,59,84,.3)}
.target .rad{width:18px;height:18px;border-radius:50%;border:2px solid var(--red2);flex:none;display:grid;place-items:center}
.target.sel .rad::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--red)}
.target b{display:block;font-size:16px}
.target small{display:block;font-size:13px;color:var(--red2);font-family:var(--mono);margin-top:2px}
.deadstrip{border:1px solid var(--red);background:var(--red-dim);color:var(--red2);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-align:center}
.verdict-box{text-align:center}
.verdict-box .big{font-size:clamp(24px,6vw,36px);font-weight:800;margin:6px 0}
.verdict-box .alias{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--muted)}
.verdict-box p{font-size:15.5px;line-height:1.65;color:#d8e2f3;text-align:left}

/* ---------- host ---------- */
.tabs{display:flex;gap:6px;margin:0 0 16px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:max-content;border:1px solid var(--line2);background:rgba(3,7,16,.6);border-radius:11px;padding:12px 16px;font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--muted);cursor:pointer;text-transform:uppercase;transition:.2s;display:flex;align-items:center;gap:7px;justify-content:center}
.tab:hover{color:var(--text)}
.tab.on{border-color:var(--gold);color:var(--gold2);background:var(--gold-dim);box-shadow:0 0 18px rgba(217,178,91,.18)}
.tab .badge{background:var(--red);color:#fff;border-radius:999px;font-size:10px;padding:1px 6px;letter-spacing:0}
.grid2{display:grid;grid-template-columns:1fr;gap:0 16px}
@media(min-width:900px){.grid2{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel);animation:rise .5s ease both}
.stat b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.stat b em{font-style:normal;font-size:14px;color:var(--dim);font-weight:600}
.stat>span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.ctl{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.ctl:first-of-type{border-top:0;padding-top:0}
.ctl .txt{flex:1;min-width:0}
.ctl .txt b{display:block;font-size:15px}
.ctl .txt small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.4}
.toggle{position:relative;width:60px;height:32px;border-radius:999px;border:1px solid var(--line2);background:#060b16;cursor:pointer;flex:none;transition:.25s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#4a5775;transition:.25s cubic-bezier(.3,1.4,.5,1)}
.toggle[aria-pressed="true"]{background:rgba(47,227,155,.2);border-color:var(--green);box-shadow:0 0 14px rgba(47,227,155,.35)}
.toggle[aria-pressed="true"]::after{left:31px;background:var(--green)}
.toggle.red[aria-pressed="true"]{background:rgba(255,59,84,.22);border-color:var(--red);box-shadow:0 0 16px rgba(255,59,84,.45)}
.toggle.red[aria-pressed="true"]::after{background:var(--red)}
.state{font-family:var(--mono);font-size:10px;letter-spacing:.12em;width:30px;text-align:right;color:var(--dim)}
.state.on{color:var(--green)}.state.on.r{color:var(--red2)}
.relist{display:flex;flex-direction:column;gap:8px}
.reitem{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:rgba(3,7,16,.5);font-size:14px;flex-wrap:wrap}
.reitem .t{flex:1;min-width:150px}
.reitem .t small{display:block;font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:2px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(90px,150px) 1fr 34px;gap:10px;align-items:center;font-size:14px}
.bar .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .track{height:14px;border-radius:7px;background:rgba(88,140,255,.08);overflow:hidden;border:1px solid var(--line)}
.bar .fill{height:100%;border-radius:7px;background:linear-gradient(90deg,#3d8bff,#5ad6ff);transition:width .6s ease}
.bar.lead .fill{background:linear-gradient(90deg,#c79b3f,#f5dc93);box-shadow:0 0 14px rgba(217,178,91,.6)}
.bar.lead .n{color:var(--gold2);font-weight:700}
.bar .c{font-family:var(--mono);font-weight:700;text-align:right}
.dot{width:10px;height:10px;border-radius:50%;background:#3a4560;flex:none}
.dot.on{background:var(--green);box-shadow:0 0 10px var(--green);animation:pdot 2s ease-in-out infinite}
.host-notes{font-size:14.5px;line-height:1.65;color:#d8e2f3}.host-notes li{margin-bottom:6px}
.scenes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.linkrow{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.linkrow:first-child{border-top:0;padding-top:0}
.linkrow .u{font-family:var(--mono);font-size:12px;color:var(--cyan);word-break:break-all}
.linkrow b{display:block;font-size:14px}
@media(max-width:560px){.linkrow{grid-template-columns:1fr}}
.guest{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:rgba(3,7,16,.5)}
.guest .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.guest .gn{font-weight:700;font-size:15px;flex:1;min-width:120px}
.guest .meta{font-size:12.5px;color:var(--muted);margin:6px 0 8px;line-height:1.5}
.assign{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;margin-top:8px}
.assign .who{font-size:12px;color:var(--dim);font-family:var(--mono);grid-column:1 / -1;display:flex;gap:8px;align-items:center}
.qrbox{background:#fff;border-radius:12px;padding:14px;display:inline-block}
.qrbox img{display:block;image-rendering:pixelated;width:240px;height:240px}
.cast-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.cast-tools .input{flex:1;min-width:160px}
.crow{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;background:rgba(3,7,16,.5);transition:.2s}
.crow.revoked{border-color:rgba(255,59,84,.45);background:linear-gradient(90deg,rgba(255,59,84,.08),transparent)}
.crow .l1{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.crow .cn{font-weight:700;font-size:15px}
.crow.dead .cn{color:var(--red2);text-decoration:line-through;text-decoration-color:rgba(255,59,84,.5)}
.crow .occ{color:var(--dim);font-size:12.5px;flex:1;min-width:120px}
.crow .l2{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0 10px;font-size:12.5px;color:var(--muted)}
.crow .code{font-family:var(--mono);font-weight:700;letter-spacing:.14em;color:var(--gold2);background:var(--gold-dim);border:1px solid rgba(217,178,91,.35);border-radius:6px;padding:2px 8px}
.crow .acts{display:flex;gap:6px;flex-wrap:wrap}
/* game tab */
.phase-now{border:1px solid rgba(217,178,91,.45);border-radius:14px;padding:14px;background:linear-gradient(180deg,rgba(217,178,91,.08),transparent);margin-bottom:14px}
.phase-now .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--gold)}
.phase-now h3{margin:4px 0 10px;font-size:22px}
.cue{font-size:14px;color:#c9d4e8;line-height:1.6;white-space:pre-line;border-left:2px solid var(--cyan);padding:2px 0 2px 12px;margin:8px 0}
.cue b{color:var(--cyan);font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;display:block;margin-bottom:2px}
.say{font-family:var(--serif);font-size:18px;line-height:1.55;color:#f1ead8;white-space:pre-line;border-left:2px solid var(--gold);padding:2px 0 2px 12px;margin:10px 0}
.say b{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--gold);display:block;margin-bottom:4px}
details.more>summary{cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--cyan);list-style:none;margin-top:6px}
details.more>summary::-webkit-details-marker{display:none}
.next-box{border:1px dashed rgba(90,214,255,.4);border-radius:14px;padding:14px;margin-bottom:12px}
.next-box .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--cyan)}
.next-box h4{margin:4px 0 8px;font-size:17px}
.auto{margin:0 0 12px;padding-left:18px;color:#c9d4e8;font-size:14px;line-height:1.7}
.bignext{width:100%;min-height:64px;font-size:17px;letter-spacing:.08em}
.phases{margin-top:12px}
.phases .ph-row{display:flex;gap:10px;align-items:center;padding:8px 2px;border-top:1px solid var(--line);font-size:14px}
.phases .ph-row .n{font-family:var(--mono);color:var(--dim);width:22px}
.phases .ph-row .tm{font-family:var(--mono);color:var(--cyan);font-size:11px;min-width:64px}
.phases .ph-row .t{flex:1}
.phases .ph-row.done .t{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(47,227,155,.5)}
.phases .ph-row.cur .t{color:var(--gold2);font-weight:700}
.progress{height:6px;border-radius:999px;background:rgba(88,140,255,.12);overflow:hidden;margin:2px 0 14px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));box-shadow:0 0 12px rgba(217,178,91,.6);transition:width .6s ease}
.quick{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.quick .input{flex:1;min-width:180px}
.lockbtn{min-width:190px}
.lockbtn.on{background:linear-gradient(180deg,#ff5068,#c21c35);border-color:#ff8494;color:#fff;box-shadow:0 0 22px rgba(255,59,84,.45)}
.evrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:7px;background:rgba(3,7,16,.5)}
.evrow b{font-size:14.5px}
.evrow small{display:block;font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:3px}
.evrow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.log{max-height:420px;overflow:auto;font-family:var(--mono);font-size:12px;line-height:1.5}
.log div{display:grid;grid-template-columns:70px 1fr;gap:8px;padding:6px 0;border-top:1px solid var(--line);animation:rise .3s ease both}
.log div:first-child{border-top:0}

<body class="grid">
<div id="app"></div>
<div id="alertbar"></div>
<div id="lockdown" class="overlay hidden" role="alertdialog" aria-live="assertive">
  <div class="lk">
    <div class="ring"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="4" y="10.5" width="16" height="10.5" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/><circle cx="12" cy="15.5" r="1.2" fill="#fff"/></svg></div>
    <h1>LOCKDOWN</h1>
    <p>All personnel: put down your device and direct your attention to the front of the room.</p>
    <div class="m">KANE OIL SECURITY PROTOCOL 7 · TERMINALS SUSPENDED</div>
    <div class="hidden" id="bypassWrap" style="margin-top:26px"><button class="btn ghost sm" id="bypassBtn">HOST OVERRIDE · BYPASS ON THIS DEVICE</button></div>
  </div>
</div>
<div id="fullmsg"></div>

<script>/* always load the newest copy of these files (GitHub Pages lets browsers cache them for 10 minutes) */
['config.js', 'party.js', 'story.locked.js', 'core.js', 'printkit.js'].forEach(f => document.write('<script src="' + f + '?v=' + Date.now() + '"><\/script>'));</script>
<script>
/* =========================================================================
   KANE OIL DATABASE — player dossiers, evidence scanning, the Inspector's
   case file, and the host's master control terminal
   ========================================================================= */
const ROSTER_LIST = window.STORY_ROSTER || [];
const ROSTER = Object.fromEntries(ROSTER_LIST.map(r => [r.id, r]));
const ROOMS = window.STORY_ROOMS || [];
let backend = null, S = normRoot({}), RAW = {}, ready = false;
let ME = null;    // this device's decrypted bundle: {type:'player', c, inspector?} or {type:'host', …}
let HOST = null;  // host-only conveniences
const rname = id => (ROSTER[id] && ROSTER[id].name) || (HOST && HOST.chars[id] && HOST.chars[id].name) || id || '—';
const PL = id => 'live/players/' + id;
const FLAGS = { lockdown: 'Lockdown', killer: 'Killer Phase', voting: 'Voting', sealed: 'Dossiers sealed' };
const SCENES = { company: 'Company page', title: 'Title card', evidence: 'Latest evidence', wall: 'Evidence wall', voting: 'Voting screen', tally: 'Results', message: 'Message', accused: 'The accused', reveal: 'The truth' };
const PEND = 'kane:' + CONFIG.GAME_ID + ':pendingScan';

/* Sessions.
   Host: kept only in this browser tab. Closing the tab, logging out, or 30 minutes idle locks the terminal.
   Player: remembered on their own phone so a refresh doesn't log them out. */
const TAB_KEY = store.k('session');
const HOST_IDLE_MS = 30 * 60 * 1000;
let session = (() => {
  let s = null;
  try { s = JSON.parse(sessionStorage.getItem(TAB_KEY) || 'null'); } catch (e) { }
  if (!s) { try { s = JSON.parse(store.get('session') || 'null'); } catch (e) { } if (s && s.role !== 'player') { store.del('session'); s = null; } }
  if (s && s.role === 'admin' && Date.now() - (s.active || 0) > HOST_IDLE_MS) s = null;
  return s;
})();
const saveSession = s => {
  session = s; const raw = s ? JSON.stringify(s) : null;
  try { raw ? sessionStorage.setItem(TAB_KEY, raw) : sessionStorage.removeItem(TAB_KEY); } catch (e) { }
  if (s && s.role === 'player') store.set('session', raw); else store.del('session');
};
['pointerdown', 'keydown', 'scroll'].forEach(ev => addEventListener(ev, () => {
  if (session && session.role === 'admin' && Date.now() - (session.active || 0) > 15000) { session.active = Date.now(); saveSession(session); }
}, { passive: true }));
setInterval(() => {
  if (session && session.role === 'admin' && Date.now() - (session.active || 0) > HOST_IDLE_MS) { signOut(true); toast('TERMINAL LOCKED', 'Locked after 30 minutes of inactivity. Enter the host code to continue.', 'err'); }
}, 20000);

const ui = { built: null, bypass: false, selTarget: null, seenEvidence: null, tab: store.get('hostTab') || 'game', msgCache: {}, msgKey: null, loggedOpen: null, castFilter: '', scan: null, finds: {} };
const isHostDevice = () => store.get('hostDevice') === '1';
const dead = () => deathsOf(S);
const log = (t, k) => backend && logEvent(backend, t, k);
function playerRec(id) { const p = S.players[id]; return (p && p.epoch === S.epoch) ? p : null; }
function isOnline(id) { const p = playerRec(id); return !!(p && typeof p.lastSeen === 'number' && backend && backend.now() - p.lastSeen < CONFIG.ONLINE_WINDOW_MS); }
const party = () => mergeParty(window.PARTY, S.site);
const isInspector = () => !!(ME && ME.type === 'player' && ME.c.inspector);
function fillLines(t) {
  const v3 = S.kill ? rname(S.kill.victim) : '[the third victim]';
  const acc = S.verdict && S.verdict.accused ? rname(S.verdict.accused) : '[the accused]';
  return String(t || '').replace(/\{victim3\}/g, v3).replace(/\{accused\}/g, acc);
}

/* ---------------- boot ---------------- */
async function boot() {
  if (!window.STORY_LOCKED) { $('#app').innerHTML = offline('story.locked.js is missing. Build it with private/build.html and upload it next to this page.'); return; }
  if (!window.crypto || !crypto.subtle) { $('#app').innerHTML = offline('This page must be opened over a secure (https) connection.'); return; }
  const hashCode = (location.hash.match(/^#k=([^&]+)/) || [])[1];
  const hashTag = (location.hash.match(/^#e=([^&]+)/) || [])[1];
  if (hashCode || hashTag) history.replaceState(null, '', location.pathname + location.search);
  if (hashTag) { try { sessionStorage.setItem(PEND, decodeURIComponent(hashTag)); } catch (e) { } }
  render();
  backend = await connectBackend(renderConn);
  backend.on(raw => { RAW = raw; const prev = S, was = ready; S = normRoot(raw); ready = true; onState(prev, was); });
  if (session) await restore();
  if (hashCode) {
    if (session && session.role === 'admin') toast('ACCESS LINK IGNORED', 'This device is signed in as the host.', 'err');
    else { if (session) signOut(true); await doLogin(decodeURIComponent(hashCode)); }
  }
  checkPendingScan();
  setInterval(heartbeat, CONFIG.HEARTBEAT_MS);
  setInterval(() => { if (HOST) renderAdmin(); }, 2000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) heartbeat(); });
}
const offline = msg => `<div class="panel red" style="margin-top:40px"><div class="ph"><h2>System offline</h2></div><p class="note">${esc(msg)}</p></div>`;

async function restore() {
  let b = null; try { b = await unlockStory(session.code); } catch (e) { }
  if (!b || b.type === 'evidence') saveSession(null); else await adopt(b);
  ui.built = null; render();
}
async function adopt(b) {
  ME = b; ui.msgCache = {}; ui.msgKey = null; ui.finds = {};
  if (b.type === 'host') {
    HOST = {
      list: b.characters, chars: Object.fromEntries(b.characters.map(c => [c.id, c])),
      evidence: b.evidence, ev: Object.fromEntries(b.evidence.map(e => [e.id, e])),
      notes: b.hostNotes, killerId: b.killerId, inspectorId: b.inspectorId, built: b.built,
      rooms: b.rooms || [], show: b.show || [], solution: b.solution || {},
      assign: { map: {}, sent: {} }, assignCt: null, assignKey: await deriveAssignKey(session.code), msgKeys: {}, threadCache: {}
    };
    await syncAssign();
  } else {
    HOST = null;
    ui.msgKey = await deriveMsgKey(session.code);
    decryptInbox(); loadFinds();
  }
}
async function syncAssign() {
  if (!HOST) return;
  const blob = S.assign, ct = blob ? blob.ct : '';
  if (ct === HOST.assignCt) return;
  HOST.assignCt = ct;
  if (!blob) { HOST.assign = { map: {}, sent: {} }; return; }
  try { const d = await decryptJSON(HOST.assignKey, blob); HOST.assign = d && d.map ? { map: d.map || {}, sent: d.sent || {} } : { map: d || {}, sent: {} }; }
  catch (e) { HOST.assign = { map: {}, sent: {} }; }
}
async function saveAssign() {
  const blob = await encryptJSON(HOST.assignKey, HOST.assign);
  HOST.assignCt = blob.ct;
  await backend.set('assign', blob);
  renderAdmin();
}

function onState(prev, was) {
  if (session && session.role === 'player' && ME) {
    const id = ME.c.id;
    if (session.epoch !== S.epoch) { signOut(true); toast('SESSION ENDED', 'The system was reset. Enter your code word again.', 'err'); }
    else if ((S.kick[id] || 0) !== (session.kick || 0)) { signOut(true); toast('SIGNED OUT', 'The Command Center has signed this device out.', 'err'); }
  }
  if (!S.flags.lockdown) ui.bypass = false;
  if (was && ME && ME.type === 'player') {
    const newEv = Object.keys(S.evidence).filter(id => !prev.evidence[id]);
    if (newEv.length) toast('EVIDENCE REVEALED', (S.evidence[newEv[0]].title || '') + (newEv.length > 1 ? ` (+${newEv.length - 1} more)` : ''), '', () => scrollToId('evidencePanel'));
    if (S.flags.voting && !prev.flags.voting && !isInspector()) toast('VOTING IS NOW OPEN', 'Submit your official accusation.', 'ok', () => scrollToId('votePanel'));
    const newRooms = Object.keys(S.rooms).filter(r => !prev.rooms[r]);
    if (newRooms.length) toast('ROOM OPENED', newRooms.map(roomName).join(', ') + ' can now be searched.', 'ok', () => scrollToId('mapPanel'));
    decryptInbox();
  }
  if (was && S.alert && (!prev.alert || prev.alert.id !== S.alert.id) && S.alert.type === 'kill') buzz([300, 120, 300, 120, 500]);
  if (ME && ME.type === 'player' && !playerRec(ME.c.id)) heartbeat();
  if (HOST && (S.assign ? S.assign.ct : '') !== HOST.assignCt) syncAssign().then(renderAdmin);
  render();
  checkPendingScan();   // a scanned tag waits until we're logged in and connected
}
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) { } };

function heartbeat() {
  if (!backend || !ready || !ME || ME.type !== 'player' || session.epoch !== S.epoch) return;
  const id = ME.c.id, p = PL(id), rec = S.players[id];
  const upd = { [p + '/lastSeen']: backend.TS(), [p + '/epoch']: session.epoch, [p + '/unlocked']: true };
  if (!rec || rec.epoch !== session.epoch || !rec.unlockedAt) {
    upd[p + '/unlockedAt'] = backend.TS();
    if (ui.loggedOpen !== S.epoch + id) { ui.loggedOpen = S.epoch + id; log(`${ME.c.name} opened their dossier`, 'player'); }
  }
  backend.update(upd);
}
function signOut(silent) {
  if (!silent && ME && ME.type === 'player') backend.update({ [PL(ME.c.id) + '/lastSeen']: 0 });
  saveSession(null); ME = null; HOST = null; ui.built = null; ui.scan = null;
  render(); window.scrollTo(0, 0);
}

/* ---------------- render root ---------------- */
function render() {
  const app = $('#app');
  if (!session) {
    if (ui.built !== 'login') { ui.built = 'login'; app.innerHTML = loginHTML(); bindLogin(); }
  } else if (!ME) {
    if (ui.built !== 'loading') { ui.built = 'loading'; app.innerHTML = `<div class="loading"><span><span class="pulse-dot"></span> DECRYPTING…</span></div>`; }
  } else if (ME.type === 'host') {
    if (ui.built !== 'admin') { ui.built = 'admin'; app.innerHTML = adminShellHTML(); bindAdmin(); }
    renderAdmin();
  } else {
    if (ui.built !== 'p:' + ME.c.id) { ui.built = 'p:' + ME.c.id; app.innerHTML = playerShellHTML(); bindPlayer(); }
    renderPlayer();
  }
  renderOverlays(); renderConn();
}
function renderConn() {
  const el = $('#connChip'); if (!el) return;
  let cls = 'warn', txt = 'CONNECTING';
  if (backend) { if (backend.mode === 'local') txt = 'LOCAL MODE'; else if (backend.connected) { cls = ''; txt = 'LINK SECURE'; } else { cls = 'bad'; txt = 'RECONNECTING'; } }
  el.className = 'chip ' + cls; el.innerHTML = `<span class="d"></span><span class="lbl">${txt}</span>`;
}
const topbar = (sub, extra = '') => `<header class="topbar"><div class="brand">${LOGO(34)}<div><b>KANE OIL</b><small>${sub}</small></div></div><span class="chip" id="connChip"></span>${extra}<button class="iconbtn" id="logoutBtn">LOG OUT</button></header>`;
function bindLogout() { $('#logoutBtn').addEventListener('click', () => signOut(false)); }
function scrollToId(id) { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }

/* ---------------- login (reveals nothing about roles or files) ---------------- */
function loginHTML() {
  let pending = false; try { pending = !!sessionStorage.getItem(PEND); } catch (e) { }
  return `<div class="login-wrap"><div class="login panel gold">
    <div class="logo">${LOGO(84)}</div>
    <h1>KANE OIL &amp; ENERGY</h1>
    <div class="tag">Secure Personnel Portal</div>
    ${pending ? `<div class="scanwait">◆ EVIDENCE TAG DETECTED · LOG IN TO EXAMINE IT</div>` : ''}
    <div class="term" id="term"></div>
    <form id="loginForm" autocomplete="off">
      <label class="lbl" for="codeIn" style="text-align:left">Code word</label>
      <input class="input code-input" id="codeIn" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="••••••••" maxlength="40">
      <div style="height:12px"></div>
      <button class="btn gold block" id="authBtn" type="submit">AUTHENTICATE</button>
      <div class="login-err" id="loginErr"></div>
    </form>
    <div class="foot">AUTHORIZED PERSONNEL ONLY · ALL ACCESS IS LOGGED</div>
  </div></div>`;
}
function bindLogin() {
  const term = $('#term');
  const lines = [['', '> KANE-OS secure boot'], ['ok', '  [ OK ] encrypted channel established'], ['', '> awaiting credential']];
  let i = 0;
  (function next() { if (!term.isConnected) return; if (i < lines.length) { term.innerHTML = lines.slice(0, ++i).map(([c, t]) => `<div class="${c}">${esc(t)}</div>`).join('') + '<span class="cursor"></span>'; setTimeout(next, 380); } })();
  $('#loginForm').addEventListener('submit', e => { e.preventDefault(); doLogin($('#codeIn').value); });
}
async function doLogin(raw) {
  if (ui.built !== 'login') { ui.built = null; saveSession(null); render(); }
  const code = normCode(raw), err = $('#loginErr'), card = $('.login'), btn = $('#authBtn'), term = $('#term');
  if (!code) return;
  const lockUntil = +store.get('lockUntil') || 0;
  if (Date.now() < lockUntil) { err.textContent = `TOO MANY ATTEMPTS · TRY AGAIN IN ${Math.ceil((lockUntil - Date.now()) / 1000)}s`; return; }
  const deny = (msg, count) => {
    if (count) { const fails = (+store.get('fails') || 0) + 1; if (fails >= 5) { store.set('lockUntil', String(Date.now() + 30000)); store.set('fails', '0'); msg = 'TOO MANY ATTEMPTS · TRY AGAIN IN 30s'; } else store.set('fails', String(fails)); }
    term.insertAdjacentHTML('beforeend', `<div class="err">  [FAIL] ${esc(msg.toLowerCase())}</div>`);
    err.textContent = msg; card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    btn.disabled = false; btn.textContent = 'AUTHENTICATE';
  };
  btn.disabled = true; btn.textContent = 'VERIFYING…'; err.textContent = '';
  term.querySelector('.cursor')?.remove();
  term.insertAdjacentHTML('beforeend', `<div>&gt; verifying credential…</div>`);
  const [b] = await Promise.all([unlockStory(code).catch(() => null), sleep(700)]);
  if (!b) return deny('ACCESS DENIED', true);
  if (b.type === 'evidence') return deny('THAT IS AN EVIDENCE TAG · SCAN IT WITH YOUR CAMERA', false);
  store.set('fails', '0');
  for (let n = 0; n < 50 && !ready; n++) await sleep(200);
  if (b.type === 'player') {
    if (S.revoked[b.c.id]) return deny('ACCESS SUSPENDED · SEE THE COMMAND CENTER');
    if (S.flags.sealed) return deny('DATABASE SEALED · DOSSIERS ARE NOT OPEN YET');
  }
  term.insertAdjacentHTML('beforeend', `<div class="ok">  [ OK ] access granted</div>`);
  await sleep(250);
  const id = b.c ? b.c.id : null;
  saveSession({ role: b.type === 'host' ? 'admin' : 'player', code, id, epoch: S.epoch, kick: id ? (S.kick[id] || 0) : 0, active: Date.now() });
  if (b.type === 'host') store.set('hostDevice', '1');
  await adopt(b);
  if (b.type === 'player') { backend.onDisconnect(PL(id) + '/lastSeen', 0); heartbeat(); }
  ui.built = null; render(); window.scrollTo(0, 0);
  checkPendingScan();
}

/* ---------------- evidence tags (QR scans) ---------------- */
const findsKey = () => 'finds:' + S.epoch + ':' + (ME && ME.c ? ME.c.id : '');
async function loadFinds() {
  let list = []; try { list = JSON.parse(store.get(findsKey()) || '[]'); } catch (e) { }
  for (const f of list) { if (ui.finds[f.id]) continue; try { const b = await unlockStory(f.token); if (b && b.type === 'evidence') ui.finds[b.e.id] = { e: b.e, token: f.token }; } catch (e) { } }
  render();
}
function rememberFind(e, token) {
  ui.finds[e.id] = { e, token };
  let list = []; try { list = JSON.parse(store.get(findsKey()) || '[]'); } catch (x) { }
  if (!list.some(f => f.id === e.id)) { list.push({ id: e.id, token }); store.set(findsKey(), JSON.stringify(list)); }
}
async function checkPendingScan() {
  let token = null; try { token = sessionStorage.getItem(PEND); } catch (e) { }
  if (!token || !ME || !ready) return;
  try { sessionStorage.removeItem(PEND); } catch (e) { }
  const b = await unlockStory(token).catch(() => null);
  if (!b || b.type !== 'evidence') { ui.scan = { kind: 'nothing' }; render(); return; }
  const e = b.e;
  if (ME.type === 'host') {
    const st = evStatus(e.id);
    openModal(`<div class="ph"><h2>Tag test · ${esc(e.title)}</h2><span class="sub">HOST PREVIEW</span></div>
      <p class="note">Room: <b>${esc(roomName(e.room))}</b> (${roomOpen(S, e.room) ? 'open' : 'sealed'})${e.after ? ` · can't be scanned until "${esc((HOST.show.find(s => s.id === e.after) || {}).title || e.after)}"` : ''}<br>Status: ${esc(st.text)}</p>
      <p class="note">This tag works. Players who scan it will see the evidence once its room is open.</p>`);
    return;
  }
  const me = ME.c.id;
  if (me in dead()) { ui.scan = { kind: 'dead' }; render(); return; }
  if (!roomOpen(S, e.room)) { ui.scan = { kind: 'sealed', e }; render(); return; }
  if (e.after && !S.phaseLog[e.after]) { ui.scan = { kind: 'locked', e }; render(); return; }
  rememberFind(e, token);
  if (!S.found[e.id] && !S.evidence[e.id]) { backend.update({ ['live/found/' + e.id]: { by: me, ts: backend.TS() } }); log(`${ME.c.name} found "${e.title}" in ${roomName(e.room)}`, 'player'); }
  ui.scan = { kind: 'found', e }; buzz([80, 60, 80]); render();
}
function revealEvidence(e, byId, where, kind) {
  if (S.evidence[e.id]) return;
  const upd = { ['live/evidence/' + e.id]: { ts: backend.TS(), title: e.title, src: e.src || '', body: e.body, tier: e.tier || '', by: byId || null, where: where || '', kind: kind || 'found' } };
  upd['live/display'] = { scene: 'evidence', evidenceId: e.id, ts: backend.TS() };
  backend.update(upd);
}

const inspectorActive = () => !!(ME && ME.inspector && Object.keys(ME.inspector.scripts || {}).some(id => S.phaseLog[id]));
function revealedFor(c, host) { return host || (c.killer ? S.flags.killer : c.inspector ? inspectorActive() : (c.id in dead())); }
function hexBadge(c, red) {

  return `<div class="hex ${red ? 'red' : ''}"><svg viewBox="0 0 78 88"><path d="M39 2 75 22.5v43L39 86 3 65.5v-43z" fill="rgba(3,7,16,.7)" stroke="${col}" stroke-width="2"/><path d="M39 10 68 26.5v35L39 78 10 61.5v-35z" fill="none" stroke="rgba(90,214,255,.35)"/></svg><span>${esc(initials(c.name))}</span></div>`;
}
const sealedBlock = (small = 'SEALED · CLEARANCE INSUFFICIENT', bars = [96, 88, 72]) => `<div class="sealed"><div class="bars">${bars.map(w => `<i style="width:${w}%"></i>`).join('')}</div><small>▲ ${small}</small></div>`;
function dossierHTML(c, host = false) {
  const rv = revealedFor(c, host), isDead = c.id in dead();
  const cls = rv && c.clsSecret ? c.clsSecret : c.cls;
  const red = (rv && c.killer) || isDead;
  const secs = c.sections.map(s => {
    if (s.hostOnly && !host) return '';

      if (s.sealed === true) return `<div class="sec"><h3>${esc(s.h)}</h3>${sealedBlock()}</div>`;
      return `<div class="sec ${s.role ? 'role' : ''}"><h3>${esc(s.h)}</h3><p>${esc(s.sealed)}</p><div style="margin-top:10px">${sealedBlock('ADDITIONAL RECORDS SEALED', [80])}</div></div>`;

    return `<div class="sec ${s.key ? 'key' : ''} ${s.role ? 'role' : ''}"><h3>${esc(s.h)} ${tag}</h3><p>${esc(s.t)}</p></div>`;
  }).join('');

    <div class="dhead">${hexBadge(c, red)}
      <div><div class="mono" style="font-size:11px;letter-spacing:.2em;color:var(--dim)">PERSONNEL FILE${host ? ' ' + esc(c.file || '') + (c.tier === 'ext' ? ' · EXTENDED CAST' : '') : ''}</div>

      <div class="cls ${red ? 'red' : c.inspector && rv ? 'blue' : ''}">CLASSIFICATION: ${esc(cls || 'SUBJECT')}${isDead && !/DECEASED/.test(cls || '') ? ' · DECEASED' : ''}</div></div>

      <div><b>Age</b><span>${esc(c.age)}</span></div>
      <div style="grid-column:span 2"><b>Occupation</b><span>${esc(c.occ)}</span></div>

    <div class="stamp">████ END OF FILE ████</div>`;
}

function bindPlayer() {

async function decryptInbox() {
  if (!ME || ME.type !== 'player' || !ui.msgKey) return;
  const box = S.msgs[ME.c.id] || {}; let changed = false;
  for (const [mid, m] of Object.entries(box)) {
    if (ui.msgCache[mid] !== undefined || !m || !m.ct) continue;
    try { ui.msgCache[mid] = (await decryptJSON(ui.msgKey, m)).text; } catch (e) { ui.msgCache[mid] = null; }
    changed = true;
  }
  if (changed) render();
}
const isRead = mid => !!((S.msgread[ME.c.id] || {})[mid]);
function ackMsg(mid) { backend.update({ [`live/msgread/${ME.c.id}/${mid}`]: backend.TS() }); }
function myMessages() {
  const box = S.msgs[ME.c.id] || {};
  return Object.entries(box).filter(([mid]) => ui.msgCache[mid]).map(([mid, m]) => ({ mid, ts: m.ts, text: ui.msgCache[mid], read: isRead(mid) })).sort((a, b) => (b.ts || 0) - (a.ts || 0));
}
const memKey = j => 'mem:' + S.epoch + ':' + ME.c.id + ':' + j;
function myMemories() { return (ME.c.memories || []).map((m, j) => Object.assign({ j }, m)).filter(m => memoryDue(S, m.when)); }
const lineKey = pid => 'line:' + S.epoch + ':' + pid;
const offKey = id => 'off:' + S.epoch + ':' + id;
function currentLines() {
  const scripts = (ME.inspector && ME.inspector.scripts) || {};

  // verdict

      ? `<div class="voted"><b>✓ ACCUSATION ON RECORD:</b> ${esc(rname(mv.suspect))} <span class="mono" style="color:var(--dim);font-size:11px">· ${fmtTime(mv.ts)}</span><br><span style="color:var(--muted)">You can change it until voting closes.</span></div>`

  }).join(''));
}

    }
    closeModal();
  };

/* ---------------- host: actions (one place, used by every button) ---------------- */
const A = {
  flag(f, v) { backend.update({ ['live/flags/' + f]: v }); log(`${FLAGS[f]} ${v ? 'ON' : 'OFF'}`); },
  scene(scene, extra = {}) { backend.update({ 'live/display': Object.assign({ scene, ts: backend.TS() }, extra) }); },
  broadcast(text) { backend.update({ 'live/alert': { id: uid('a'), type: 'notice', text, ts: backend.TS() } }); log(`Announcement: ${text}`); },
  death(id, text) { backend.update({ ['live/deaths/' + id]: backend.TS(), 'live/alert': { id: uid('a'), type: 'kill', text, ts: backend.TS() } }); log(`Death announced: ${rname(id)}`, 'alert'); },
  undoDeath(id) { backend.update({ ['live/deaths/' + id]: null }); log(`Death undone: ${rname(id)}`); },
  room(id, open) { backend.update({ ['live/rooms/' + id]: open ? backend.TS() : null, ...(open ? { 'live/alert': { id: uid('a'), type: 'notice', text: `${roomName(id)} is now open to investigators.`, ts: backend.TS() } } : {}) }); log(`${roomName(id)} ${open ? 'opened' : 'sealed'}`); },
  deliver(id) { backend.update({ ['live/delivered/' + id]: backend.TS() }); log(`Sent to the Inspector: ${(HOST.ev[id] || {}).title || id}`); },
  release(id, how) { const e = HOST.ev[id]; if (!e || S.evidence[id]) return; revealEvidence(e, how === 'official' ? HOST.inspectorId : 'host', how === 'official' ? 'Official report' : roomName(e.room), how === 'official' ? 'official' : 'found'); log(`Host released: ${e.title}`); },
  retract(id) { backend.update({ ['live/evidence/' + id]: null }); log(`Evidence retracted: ${(HOST.ev[id] || {}).title || id}`); },
  async message(id, text) {
    const c = HOST.chars[id]; if (!c || !text) return;
    if (!HOST.msgKeys[id]) HOST.msgKeys[id] = await deriveMsgKey(c.code);
    const blob = await encryptJSON(HOST.msgKeys[id], { text });
    const mid = uid('m'); HOST.threadCache[mid] = text;
    await backend.update({ [`live/msgs/${id}/${mid}`]: Object.assign(blob, { ts: backend.TS() }) });
    log(`Message sent to ${c.name}`); toast('MESSAGE SENT', `Delivered to ${c.name}.`, 'ok');
  },
  revoke(id) { backend.update({ ['live/revoked/' + id]: backend.TS() }); log(`Access revoked: ${rname(id)}`); toast('ACCESS REVOKED', rname(id), 'err'); },
  restore(id) { backend.update({ ['live/revoked/' + id]: null }); log(`Access restored: ${rname(id)}`); toast('ACCESS RESTORED', rname(id), 'ok'); },
  kick(id) { backend.update({ ['live/kick/' + id]: Date.now(), [PL(id) + '/lastSeen']: 0 }); log(`Signed out: ${rname(id)}`); toast('DEVICE SIGNED OUT', rname(id), 'ok'); },
  clearVote(id) { backend.update({ [PL(id) + '/vote']: null }); log(`Vote cleared: ${rname(id)}`); },
  clearVerdict() { backend.update({ 'live/verdict': null }); log('Verdict cleared'); }
};
function tallyRows() {
  const counts = {};
  HOST.list.forEach(c => { const p = playerRec(c.id); if (p && p.vote && p.vote.suspect) counts[p.vote.suspect] = (counts[p.vote.suspect] || 0) + 1; });
  return Object.entries(counts).sort((a, b) => b[1] - a[1]);
}
const topVoted = () => (tallyRows()[0] || [])[0];
function verdictReveal() {
  const k = HOST.killerId, kc = HOST.chars[k] || {};
  const solvers = HOST.list.filter(c => { const p = playerRec(c.id); return p && p.vote && p.vote.suspect === k; }).map(c => c.name);
  return { stage: 'reveal', accused: (S.verdict && S.verdict.accused) || topVoted() || null, killer: k, killerName: kc.name || '', alias: HOST.solution.alias || '', summary: HOST.solution.summary || '', solvers, ts: backend.TS() };
}

/* ---------------- host: the game flow (NEXT) ---------------- */
function actLabel(a) {
  switch (a.do) {
    case 'flag': return a.flag === 'sealed' ? (a.value ? 'Seal every dossier' : 'Dossiers open') : `${FLAGS[a.flag]} ${a.value ? 'ON' : 'OFF'}`;
    case 'death': return `☠ ${rname(a.id)} dies (red alert on every screen)`;
    case 'room': return `🚪 ${roomName(a.id)} opens`;
    case 'deliver': return `📁 "${(HOST.ev[a.id] || {}).title || a.id}" goes to the Inspector to read aloud`;
    case 'scene': return `Projector: ${SCENES[a.scene] || a.scene}`;
    case 'broadcast': return `Announcement: "${a.text}"`;
    case 'verdict': return a.stage === 'reveal' ? '⚖ The truth is revealed on every screen' : '⚖ You name the accused (top vote pre-selected)';
  }
  return a.do;
}
function phaseMemories(st) {
  const out = [];
  HOST.list.forEach(c => (c.memories || []).forEach(m => { if (m.when && m.when.phase === st.id) out.push(`${m.cue ? 'Cue' : 'Memory'} → ${c.name}`); }));
  return out;
}
function runPhase(i, accused) {
  const st = HOST.show[i]; if (!st) return;
  const upd = { 'live/phase': { i, id: st.id, ts: backend.TS() }, [`live/phaseLog/${st.id}`]: backend.TS() };
  let alert = null, roomNames = [];
  for (const a of st.actions || []) {
    switch (a.do) {
      case 'flag': upd['live/flags/' + a.flag] = !!a.value; break;
      case 'room': upd['live/rooms/' + a.id] = backend.TS(); roomNames.push(roomName(a.id)); break;
      case 'deliver': upd['live/delivered/' + a.id] = backend.TS(); break;
      case 'death': { const c = HOST.chars[a.id] || {}; upd['live/deaths/' + a.id] = backend.TS(); alert = { id: uid('a'), type: 'kill', text: c.deathAlert || `${c.name} has been found dead. All personnel remain where you are.`, ts: backend.TS() }; break; }
      case 'scene': upd['live/display'] = { scene: a.scene, ts: backend.TS() }; break;
      case 'broadcast': if (!alert) alert = { id: uid('a'), type: 'notice', text: a.text, ts: backend.TS() }; break;
      case 'verdict':
        if (a.stage === 'reveal') { upd['live/verdict'] = verdictReveal(); upd['live/display'] = { scene: 'reveal', ts: backend.TS() }; }
        else { upd['live/verdict'] = { stage: 'accuse', accused: accused || topVoted() || null, ts: backend.TS() }; upd['live/display'] = { scene: 'accused', ts: backend.TS() }; }
        break;
    }
  }
  if (!alert && roomNames.length) alert = { id: uid('a'), type: 'notice', text: `${roomNames.join(' and ')} ${roomNames.length > 1 ? 'are' : 'is'} now open to investigators.`, ts: backend.TS() };
  if (alert) upd['live/alert'] = alert;
  backend.update(upd);
  log(`▶ Phase ${i + 1}: ${st.title}`);
}
function confirmPhase(i) {
  const st = HOST.show[i]; if (!st) return;
  const acts = (st.actions || []).map(actLabel), mems = phaseMemories(st);
  const needsAccused = (st.actions || []).some(a => a.do === 'verdict' && a.stage === 'accuse');
  const rows = tallyRows(), top = rows[0] ? rows[0][0] : '';
  const accSel = needsAccused ? `<label class="lbl" for="accSel" style="margin-top:12px">The accused</label><select class="input" id="accSel">${HOST.list.filter(c => c.suspect !== false).map(c => { const n = (rows.find(r => r[0] === c.id) || [0, 0])[1]; return `<option value="${esc(c.id)}" ${c.id === top ? 'selected' : ''}>${esc(c.name)}${n ? ` (${n} vote${n > 1 ? 's' : ''})` : ''}</option>`; }).join('')}</select>` : '';
  openModal(`<div class="ph"><h2>Start phase ${i + 1}: ${esc(st.title)}</h2></div>
    ${acts.length || mems.length ? `<p class="note" style="margin:0 0 6px">This happens immediately:</p><ul class="auto">${acts.map(t => `<li>${esc(t)}</li>`).join('')}${mems.map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : `<p class="note">Nothing automatic. This phase is just a marker for you and the Inspector.</p>`}
    ${accSel}
    <div class="row-gap" style="margin-top:14px"><button class="btn gold" id="phaseGo">▶ START</button><button class="btn ghost" data-close>CANCEL</button></div>`);
  $('#phaseGo').onclick = () => { runPhase(i, needsAccused ? $('#accSel').value : null); closeModal(); };
}
function renderGame() {
  const steps = HOST.show, cur = S.phase && typeof S.phase.i === 'number' ? S.phase.i : -1, now = steps[cur], nxt = steps[cur + 1];
  $('#phaseSub').textContent = cur >= 0 ? `PHASE ${cur + 1} OF ${steps.length}` : 'NOT STARTED';
  $('#phaseBar').style.width = Math.round((cur + 1) / Math.max(1, steps.length) * 100) + '%';
  animateNum($('#n-phase'), cur + 1);
  const sig = JSON.stringify([cur, S.kill && S.kill.victim, S.verdict && S.verdict.accused, topVoted()]);
  patch($('#phaseNow'), sig, now ? `<div class="phase-now"><div class="k">NOW · ${esc(now.time || '')}</div><h3>${esc(now.title)}</h3>
      ${now.cue ? `<div class="cue"><b>YOUR CUE</b>${esc(now.cue)}</div>` : ''}
      ${now.host ? `<div class="say"><b>YOU SAY</b>${esc(fillLines(now.host))}</div>` : ''}
      ${now.inspector ? `<details class="more"><summary>▸ THE INSPECTOR IS READING THIS</summary><div class="say"><b>INSPECTOR</b>${esc(fillLines(now.inspector))}</div></details>` : ''}</div>`
    : `<div class="phase-now"><div class="k">NOT STARTED</div><h3>Ready when you are</h3><p class="note" style="margin:0">Press the button below to begin. Each press starts the next part of the night and does everything that part needs: rooms, reports, deaths, the projector.</p></div>`);
  patch($('#phaseNext'), sig + '|n', nxt ? `<div class="next-box"><div class="k">NEXT UP · ${esc(nxt.time || '')}</div><h4>${esc(nxt.title)}</h4>
      ${nxt.cue ? `<div class="cue"><b>WHEN</b>${esc(nxt.cue)}</div>` : ''}
      <button class="btn gold bignext" id="nextBtn">▶ START: ${esc(nxt.title.toUpperCase())}</button></div>`
    : `<div class="next-box"><div class="k">THE END</div><h4>That was the final phase.</h4><p class="note" style="margin:0">Thank everyone and take the group photo.</p></div>`);
  const nb = $('#nextBtn'); if (nb) nb.onclick = () => confirmPhase(cur + 1);
  patch($('#phaseList'), 'pl' + cur, steps.map((st, i) => `<div class="ph-row ${i < cur ? 'done' : i === cur ? 'cur' : ''}"><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="tm">${esc(st.time || '')}</span><span class="t">${esc(st.title)}</span><button class="btn sm ghost" data-runphase="${i}">${i <= cur ? 'RE-RUN' : 'JUMP'}</button></div>`).join(''));

  // rooms
  patch($('#roomCtl'), JSON.stringify(S.rooms), (HOST.rooms || []).map(r => { const o = roomOpen(S, r.id); return `<div class="reitem"><span class="pill ${o ? 'green' : 'red'}">${o ? 'OPEN' : 'SEALED'}</span><div class="t"><b>${esc(r.name)}</b><small>${esc(r.place || '')}</small></div>${r.alwaysOpen ? '<span class="pill">ALWAYS OPEN</span>' : `<button class="btn sm ${o ? 'ghost' : ''}" data-room="${esc(r.id)}" data-open="${o ? '0' : '1'}">${o ? 'SEAL' : 'OPEN'}</button>`}</div>`; }).join(''));

  // evidence board
  const evs = releasedEvidence(S);
  $('#evSub').textContent = `${evs.length} REVEALED · ${Object.keys(S.found).filter(id => !S.evidence[id]).length} FOUND, NOT SHARED`;
  patch($('#evBoard'), JSON.stringify([S.evidence && Object.keys(S.evidence), S.found, S.delivered, S.rooms, Object.keys(S.phaseLog)]), HOST.evidence.map(e => {
    const st = evStatus(e.id);
    let acts = '';
    if (S.evidence[e.id]) acts = `<button class="btn sm ghost" data-retract="${esc(e.id)}">RETRACT</button>`;
    else if (e.official) acts = S.delivered[e.id] ? `<button class="btn sm" data-release="${esc(e.id)}" data-how="official">RELEASE NOW</button>` : `<button class="btn sm" data-deliver="${esc(e.id)}">SEND TO INSPECTOR</button>`;
    else acts = `<button class="btn sm ghost" data-release="${esc(e.id)}" data-how="found">REVEAL NOW</button>`;
    return `<div class="evrow"><div><span class="pill ${st.cls}">${esc(st.pill)}</span> <b>${esc(e.title)}</b><small>${e.official ? 'Official report' : '▣ QR tag · ' + esc(roomName(e.room))} · ${esc(st.text)}</small></div><div class="acts">${acts}</div></div>`;
  }).join(''));

  // accusations + verdict (visible once voting starts)
  const rows = tallyRows(), max = rows.length ? rows[0][1] : 0, v = S.verdict;
  $('#tallyPanel').classList.toggle('hidden', !S.flags.voting && !rows.length && !v);
  $('#tallySub').textContent = (S.flags.voting ? 'VOTING OPEN · ' : 'VOTING CLOSED · ') + rows.reduce((n, r) => n + r[1], 0) + ' CAST';

function evStatus(id) {
  const e = (HOST && HOST.ev[id]) || {};
  const rel = S.evidence[id];
  if (rel) return { pill: 'REVEALED', cls: 'green', text: rel.kind === 'official' ? `released ${fmtTime(rel.ts)}` : `by ${rname(rel.by)} ${fmtTime(rel.ts)}` };
  if (e.official) return S.delivered[id] ? { pill: 'WITH INSPECTOR', cls: 'gold', text: 'waiting for them to read & release' } : { pill: 'NOT SENT', cls: '', text: 'sent by its phase' };
  const f = S.found[id];
  if (f) return { pill: 'FOUND', cls: 'gold', text: `by ${rname(f.by)}, not shared yet` };
  if (!roomOpen(S, e.room)) return { pill: 'SEALED', cls: '', text: 'room not open yet' };
  if (e.after && !S.phaseLog[e.after]) return { pill: 'LOCKED', cls: '', text: 'unlocks later in the night' };
  return { pill: 'HIDDEN', cls: 'blue', text: 'waiting to be found' };
}

async function showQR(url) {

function confirmModal(title, body, yesLabel, fn, danger = true) {

function openDossierModal(id) {

function whenText(w) {
  w = w || {};
  if (w.phase) return 'phase: ' + ((HOST.show.find(s => s.id === w.phase) || {}).title || w.phase);
  if (w.evidence) return 'when revealed: ' + ((HOST.ev[w.evidence] || {}).title || w.evidence);
  if (w.death) return 'when ' + rname(w.death) + ' dies';

}
function castActions(c) {
  const id = esc(c.id), p = playerRec(c.id);
  return `<button class="btn sm" data-ca="dossier" data-id="${id}">DOSSIER</button>
    <button class="btn sm ghost" data-ca="qr" data-id="${id}">ACCESS QR</button>

    <button class="btn sm ghost" data-ca="kick" data-id="${id}">SIGN OUT</button>
    <button class="btn sm ghost" data-ca="msg" data-id="${id}">MESSAGE</button>
    ${p && p.vote ? `<button class="btn sm ghost" data-ca="clearvote" data-id="${id}">CLEAR VOTE</button>` : ''}
    ${(c.id in S.deaths) ? `<button class="btn sm ghost" data-ca="undodeath" data-id="${id}">UNDO DEATH</button>` : (S.kill && S.kill.victim === c.id) || c.inspector ? '' : `<button class="btn sm danger" data-ca="death" data-id="${id}">KILL</button>`}`;
}
function handleCastAction(act, id) {
  const n = esc(rname(id));
  switch (act) {
    case 'dossier': return openDossierModal(id);
    case 'msg': return messageModal(id);
    case 'qr': return accessQR(id);
    case 'revoke': return confirmModal('Revoke access?', `${n}'s phone is blocked immediately, and the code word won't work until you restore it.`, 'REVOKE', () => A.revoke(id));
    case 'restore': A.restore(id); return closeModal();
    case 'kick': return confirmModal('Sign out this phone?', `Whoever is logged in as ${n} is signed out. They can log back in with the code word unless you also revoke access.`, 'SIGN OUT', () => A.kick(id), false);
    case 'clearvote': A.clearVote(id); return closeModal();
    case 'undodeath': A.undoDeath(id); return closeModal();
    case 'death': return announceDeath(id);
  }
}

async function openPrint(which) {
  if (!window.PrintKit) { toast('PRINT UNAVAILABLE', 'printkit.js is missing from the site. Upload it next to database.html.', 'err'); return; }

  if (!w) { toast('POP-UP BLOCKED', 'Allow pop-ups for this site, then press PRINT again.', 'err'); return; }
  w.document.write('<p style="font:16px sans-serif;padding:20px">Preparing…</p>');
  if (which === 'tags' || which === 'all') { try { await loadQR(); } catch (e) { } }
  const qr = window.qrcode ? (text => { const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createImgTag(5, 0); }) : null;
  const story = { characters: HOST.list, evidence: HOST.evidence, show: HOST.show, rooms: HOST.rooms, solution: HOST.solution, hostNotes: HOST.notes, inspectorId: HOST.inspectorId };
  const r = PrintKit.render(story, party(), which, { qr, base: siteBase() });
  w.document.open();
  w.document.write(`<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>The Last Toast · ${esc(r.label)}</title><style>${r.pageCSS}</style><style>${PrintKit.CSS}</style></head>

  w.document.close();
  log(`Printable document opened: ${r.label}`);
}

  $('#emVotes').onclick = () => confirmModal('Clear every accusation?', 'All votes and the verdict are wiped.', 'CLEAR VOTES', () => {
    const upd = { 'live/verdict': null }; Object.keys(S.players).forEach(id => { if (S.players[id] && S.players[id].vote) upd[PL(id) + '/vote'] = null; });

  });
  $('#emExport').onclick = () => {

    a.download = `last-toast-backup-${new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-')}.json`; document.body.appendChild(a); a.click(); a.remove();

  };
  $('#emImport').onclick = () => $('#emFile').click();
  $('#emFile').onchange = async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    let data; try { data = JSON.parse(await f.text()); } catch (err) { toast('NOT A BACKUP', 'That file could not be read.', 'err'); return; }
    confirmModal('Restore this backup?', `Everything (game, RSVPs, roles, page edits) will be replaced with <b>${esc(f.name)}</b>.`, 'RESTORE', async () => { await backend.setRoot(data); toast('BACKUP RESTORED', '', 'ok'); });
  };
  $('#resetBtn').addEventListener('click', () => {
    openModal(`<div class="ph"><h2 style="color:var(--red2)">Hard Reset</h2></div>
      <p style="line-height:1.6">Starts a brand-new game: wipes phases, rooms, evidence finds, deaths, votes, alerts, messages and logins. Every player is signed out. RSVPs, role assignments and page edits are kept.</p>
      <label class="lbl" for="resetConfirm">Type RESET to confirm</label>
      <input class="input mono" id="resetConfirm" autocomplete="off" autocapitalize="characters">
      <div class="row-gap" style="margin-top:14px"><button class="btn danger" id="resetYes" disabled>START A NEW GAME</button><button class="btn ghost" data-close>CANCEL</button></div>`);
    const inp = $('#resetConfirm'), yes = $('#resetYes');
    inp.focus(); inp.oninput = () => { yes.disabled = inp.value.trim().toUpperCase() !== 'RESET'; };
    yes.onclick = async () => { yes.disabled = true; yes.textContent = 'WIPING…'; await backend.set('live', freshLive()); log('HARD RESET: new game started'); toast('SYSTEM RESET', 'Ready for a new game.', 'ok'); closeModal(); };
  });
  $('#emRsvps').onclick = () => confirmModal('Delete every RSVP?', 'All RSVPs and all role assignments are permanently removed.', 'DELETE ALL', async () => { await backend.update({ rsvps: null, assign: null }); log('All RSVPs deleted'); });
}
const linkUrl = k => ({ invite: siteBase(), db: siteBase() + 'database.html', display: siteBase() + 'display.html' })[k];
function roleMessage(name, c) {
  const P = party();
  return `Hi ${name}! Your role for ${(P.title || 'The Last Toast').toUpperCase()}:\n\n${c.name}\n${c.occ || ''}\n\nYour secret code word: ${c.code}\n\nOpen ${siteBase()}database.html and enter it to read your dossier. Keep your code word to yourself, and don't show your dossier to anyone!`;
}

/* ---------------- host: render ---------------- */
function guestFor() {
  const m = {};
  for (const [key, cid] of Object.entries(HOST.assign.map || {})) {
    const [rid, plus] = key.split('#'); const r = S.rsvps[rid]; if (!r) continue;
    m[cid] = plus ? (r.plusOneName || (r.name + "'s guest")) : r.name;
  }
  return m;
}
function renderAdmin(force) {
  if (!HOST || !$('#tabs')) return;
  if (force) $$('#app [data-pane] *').forEach(el => { if (el._sig !== undefined) el._sig = undefined; });
  patch($('#modeNote'), backend ? backend.mode : 'x', backend && backend.mode === 'local'
    ? `<div class="panel" style="border-color:rgba(217,178,91,.5);padding:12px 14px"><p class="note" style="margin:0"><b style="color:var(--gold2)">LOCAL MODE:</b> only syncs between tabs on this device. Add your Firebase config to <span class="mono">config.js</span> for the real game.</p></div>` : '');
  const L = HOST.list, who = guestFor();
  const badge = (k, n) => { const b = $('#badge-' + k); if (b) { b.textContent = n; b.classList.toggle('hidden', !n); } };
  badge('guests', Object.entries(S.rsvps).filter(([, r]) => r && r.name && r.attending !== 'no').flatMap(([id, r]) => r.plusOne ? [id, id + '#p'] : [id]).filter(key => !HOST.assign.map[key]).length);
  badge('players', Object.keys(S.revoked).length);

  Object.keys(FLAGS).forEach(f => {
    const t = $(`[data-flag="${f}"]`); if (!t) return; const on = !!S.flags[f];
    t.setAttribute('aria-pressed', on);
    const st = $('#st-' + f); st.textContent = on ? 'ON' : 'OFF'; st.className = 'state' + (on ? ' on' + (f !== 'voting' ? ' r' : '') : '');
  });
  animateNum($('#n-online'), L.filter(c => isOnline(c.id)).length);
  animateNum($('#n-ev'), releasedEvidence(S).length);
  animateNum($('#n-votes'), tallyRows().reduce((n, r) => n + r[1], 0));

  renderGame(); renderCast(who); renderGuests(who); renderTools();
}
function renderCast(who) {
  const showCodes = store.get('showCodes') !== '0', dd = dead(), f = ui.castFilter;
  const list = HOST.list.filter(c => !f || (c.name + ' ' + (c.occ || '') + ' ' + (who[c.id] || '') + ' ' + c.code).toLowerCase().includes(f));
  $('#castSub').textContent = `${HOST.list.filter(c => isOnline(c.id)).length} ONLINE · ${Object.keys(S.revoked).length} REVOKED`;
  const sig = JSON.stringify([list.map(c => { const p = playerRec(c.id); return [c.id, isOnline(c.id), p && p.unlocked, p && p.vote && p.vote.suspect, c.id in dd, !!S.revoked[c.id], (c.memories || []).filter(m => memoryDue(S, m.when)).length, c.id in S.deaths, S.kill && S.kill.victim]; }), who, showCodes]);
  patch($('#castList'), sig, list.map(c => {
    const p = playerRec(c.id), on = isOnline(c.id), isD = c.id in dd, mem = c.memories || [], due = mem.filter(m => memoryDue(S, m.when)).length;
    return `<div class="crow ${isD ? 'dead' : ''} ${S.revoked[c.id] ? 'revoked' : ''}">
      <div class="l1"><span class="dot ${on ? 'on' : ''}"></span><span class="cn">${esc(c.name)}</span><span class="occ">${esc(c.occ || '')}</span>
        ${c.inspector ? '<span class="pill blue" style="border-color:var(--cyan);color:var(--cyan)">INSPECTOR</span>' : ''}${c.id === HOST.killerId ? '<span class="pill red">KILLER</span>' : ''}${isD ? '<span class="pill red">DECEASED</span>' : ''}${S.revoked[c.id] ? '<span class="pill red">REVOKED</span>' : ''}<span class="pill ${p && p.unlocked ? 'green' : ''}">${p && p.unlocked ? 'OPENED' : 'NOT OPENED'}</span></div>
      <div class="l2"><span>Code: <span class="code">${showCodes ? esc(c.code) : '••••••'}</span></span><span>Player: <b style="color:var(--cyan)">${esc(who[c.id] || 'unassigned')}</b></span>${mem.length ? `<span>Memories: ${due}/${mem.length}</span>` : ''}${p && p.vote ? `<span>Accuses: <b style="color:var(--gold2)">${esc(rname(p.vote.suspect))}</b></span>` : ''}</div>
      <div class="acts">${castActions(c)}</div></div>`;
  }).join('') || `<div class="empty">NO MATCHES</div>`);
}
function renderGuests(who) {
  const rs = Object.entries(S.rsvps).filter(([, r]) => r && r.name).sort((a, b) => (a[1].ts || 0) - (b[1].ts || 0));
  const yes = rs.filter(([, r]) => r.attending === 'yes'), maybe = rs.filter(([, r]) => r.attending === 'maybe'), no = rs.filter(([, r]) => r.attending === 'no');
  $('#rsvpSub').textContent = `${yes.length + yes.filter(([, r]) => r.plusOne).length} COMING · ${maybe.length} MAYBE · ${no.length} NO`;
  const taken = {}; for (const [key, cid] of Object.entries(HOST.assign.map)) taken[cid] = key;
  const openCore = HOST.list.filter(c => c.tier !== 'ext' && !who[c.id]);
  patch($('#openRoles'), openCore.map(c => c.id).join(), openCore.length ? `<p class="note" style="margin:0 0 12px"><b style="color:var(--gold2)">Principal roles still open (${openCore.length}):</b> ${openCore.map(c => esc(c.name)).join(', ')}</p>` : `<p class="note" style="margin:0 0 12px;color:var(--green)">✓ Every principal role is assigned.</p>`);
  const select = key => {
    const cur = HOST.assign.map[key] || '';
    const opt = c => `<option value="${esc(c.id)}" ${c.id === cur ? 'selected' : ''}>${esc(c.name)}${c.inspector ? ' ★ INSPECTOR' : ''}${taken[c.id] && taken[c.id] !== key ? ' (taken)' : ''}</option>`;
    return `<select class="input sm" data-assign="${esc(key)}"><option value="">— Unassigned —</option><optgroup label="Principal">${HOST.list.filter(c => c.tier !== 'ext').map(opt).join('')}</optgroup><optgroup label="Extended cast">${HOST.list.filter(c => c.tier === 'ext').map(opt).join('')}</optgroup></select>`;
  };
  const prefs = { big: 'Big dramatic role', medium: 'Medium role', small: 'Small, low-pressure role', surprise: 'Surprise me' };
  const card = ([id, r]) => {
    const st = r.attending === 'yes' ? ['green', 'COMING'] : r.attending === 'maybe' ? ['gold', 'MAYBE'] : ['', "CAN'T MAKE IT"];
    const meta = [r.plusOne ? `Plus-one: ${esc(r.plusOneName || 'yes')}` : '', r.pref ? esc(prefs[r.pref] || r.pref) : '', r.diet ? 'Diet: ' + esc(r.diet) : '', r.note ? '“' + esc(r.note) + '”' : ''].filter(Boolean).join(' · ');
    const assignRow = (key, name) => { const s = HOST.assign.sent[key]; return `<div class="assign">${select(key)}<button class="btn sm" data-rolemsg="${esc(key)}" data-name="${esc(name)}">COPY ROLE TEXT</button><button class="btn sm ghost" data-accessqr="${esc(key)}">QR</button><span class="who">${esc(name)} ${HOST.assign.map[key] ? (s ? `<span class="pill green">ROLE SENT ${fmtTime(s)}</span>` : '<span class="pill gold">NOT SENT YET</span>') : ''}</span></div>`; };
    return `<div class="guest"><div class="top"><span class="gn">${esc(r.name)}</span><span class="pill ${st[0]}">${st[1]}</span><button class="btn sm ghost" data-delrsvp="${esc(id)}" aria-label="Delete RSVP">✕</button></div>
      ${meta ? `<div class="meta">${meta}</div>` : ''}
      ${r.attending !== 'no' ? assignRow(id, r.name) + (r.plusOne ? assignRow(id + '#p', r.plusOneName || r.name + "'s guest") : '') : ''}</div>`;
  };
  patch($('#rsvpList'), JSON.stringify([rs, HOST.assign]), rs.length ? rs.map(card).join('') : `<div class="empty">NO RSVPS YET. SEND THE INVITATION LINK ABOVE.</div>`);
}
function renderTools() {
  const ps = projectorState(S);
  $('#projNow').textContent = 'NOW SHOWING · ' + ({ lockdown: 'LOCKDOWN', incident: 'DEATH ALERT', notice: 'ANNOUNCEMENT' }[ps.kind] || (SCENES[ps.kind] || ps.kind).toUpperCase());
  $$('#scenes [data-scene]').forEach(b => b.classList.toggle('on', b.dataset.scene === ps.kind));

  $('#logSub').textContent = `${Object.keys(S.log).length} EVENTS`;
  patch($('#logList'), entries.length + ':' + (entries[0] ? entries[0].ts + entries[0].t : ''), entries.length ? entries.map(e => `<div><span class="t">${fmtTime(e.ts)}</span><span class="${esc(e.k || 'host')}">${esc(e.t)}</span></div>`).join('') : `<div class="empty" style="display:block">NOTHING LOGGED YET</div>`);
  const siteSig = JSON.stringify(S.site);
  if (ui.siteSig !== siteSig) { ui.siteSig = siteSig; const ae = document.activeElement; if (!(ae && ae.closest && ae.closest('[data-pane="tools"]'))) ui.fillEditor && ui.fillEditor(); }
}

/* ---------------- overlays (players) ---------------- */
function renderOverlays() {
  const isHost = ME && ME.type === 'host', c = ME && ME.type === 'player' ? ME.c : null;
  const blocked = c && (S.revoked[c.id] ? 'revoked' : S.flags.sealed ? 'sealed' : null);
  // the Inspector reads to the room during lockdowns, so their screen is never blocked
  const lockOn = S.flags.lockdown && !isHost && !(c && c.inspector) && !ui.bypass && !blocked;
  $('#lockdown').classList.toggle('hidden', !lockOn);
  $('#bypassWrap').classList.toggle('hidden', !isHostDevice());

  const a = S.alert, bar = $('#alertbar'), showAlert = a && a.id !== store.get('alertDismissed') && !blocked;
  patch(bar, showAlert ? a.id : 'none', showAlert ? `<div class="alert ${a.type === 'notice' ? 'notice' : ''}" role="alert"><span class="h">${a.type === 'kill' ? '⚠ CRITICAL INCIDENT · ALL PERSONNEL' : '◆ ANNOUNCEMENT'}</span>${esc(a.text)}<button class="x" aria-label="Dismiss" id="alertX">✕</button></div>` : '');
  const x = $('#alertX'); if (x) x.onclick = () => { store.set('alertDismissed', a.id); renderOverlays(); };
  $('#app').style.paddingTop = showAlert ? (bar.offsetHeight + 12) + 'px' : '';

  const fm = $('#fullmsg'), dd = dead();
  let html = '', sig = 'none', bind = null;
  const deathKey = c && (c.id in dd) ? S.epoch + ':' + c.id + ':' + dd[c.id] : null;
  const v = S.verdict, sc = ui.scan;
  const mem = c ? myMemories().find(m => store.get(memKey(m.j)) !== '1') : null;
  const unread = c ? myMessages().filter(m => !m.read).reverse()[0] : null;
  const insp = c && c.inspector ? ME.inspector : null;
  const newOfficial = insp ? (insp.official || []).find(e => S.delivered[e.id] && !S.evidence[e.id] && store.get(offKey(e.id)) !== '1') : null;
  const lines = insp ? currentLines() : null, newLines = lines && store.get(lineKey(lines.id)) !== '1' ? lines : null;

  if (blocked === 'revoked') {
    sig = 'revoked'; html = `<div class="overlay fullmsg blocked"><div class="box"><div class="k">KANE-OS · SECURITY NOTICE</div><h1>ACCESS REVOKED</h1><p>Your clearance has been suspended by the Command Center.</p><button class="btn ghost" id="blkOut">LOG OUT</button></div></div>`;
    bind = () => $('#blkOut').onclick = () => signOut(false);
  } else if (blocked === 'sealed') {
    sig = 'sealed'; html = `<div class="overlay fullmsg blocked"><div class="box"><div class="k">KANE-OS · DATABASE STATUS</div><h1>DATABASE SEALED</h1><p>All personnel files are sealed until further notice. Stand by.</p><button class="btn ghost" id="blkOut">LOG OUT</button></div></div>`;
    bind = () => $('#blkOut').onclick = () => signOut(false);
  } else if (deathKey && store.get('termAck') !== deathKey) {
    sig = 'dead'; html = `<div class="overlay fullmsg dead"><div class="box"><div class="k">KANE-OS · PERSONNEL STATUS UPDATE</div><h1>YOU HAVE BEEN<br>TERMINATED</h1>
      <p>You've been murdered. Play it out, then stay in character as the body until the host tells you otherwise.</p><p style="color:var(--red2)">Don't reveal what your screen says to anyone.</p><button class="btn danger" id="termAck" style="margin-top:8px">ACKNOWLEDGE</button></div></div>`;
    bind = () => $('#termAck').onclick = () => { store.set('termAck', deathKey); renderOverlays(); };
  } else if (c && v && v.stage === 'reveal' && !newLines && store.get('verdictAck') !== String(v.ts)) {
    sig = 'verdict' + v.ts; html = `<div class="overlay fullmsg verdict"><div class="box panel gold" style="text-align:left">${verdictHTML(v, c)}<div style="text-align:center;margin-top:10px"><button class="btn gold" id="verdictAck">CLOSE THE FILE</button></div></div></div>`;
    bind = () => $('#verdictAck').onclick = () => { store.set('verdictAck', String(v.ts)); renderOverlays(); };
  } else if (sc) {
    sig = 'scan' + sc.kind + (sc.e ? sc.e.id : '') + (sc.e && S.evidence[sc.e.id] ? 'r' : '');
    const close = `<button class="btn ghost" id="scanClose">CLOSE</button>`;
    if (sc.kind === 'found') {
      const e = sc.e, rel = S.evidence[e.id];
      html = `<div class="overlay fullmsg found"><div class="box"><div class="antenna gold"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#f5dc93" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg></div>
        <div class="k">EVIDENCE FOUND · ${esc(roomName(e.room).toUpperCase())}</div>
        <div class="evbody"><h2>${esc(e.title)}</h2><div class="src">SOURCE · ${esc(e.src)}</div><div class="txt">${esc(e.body)}</div></div>
        ${rel ? `<p class="note">${rel.by ? 'Already revealed to everyone by ' + esc(rname(rel.by)) + '.' : 'Already revealed to everyone.'}</p>${close}`
          : `<p class="note">Only you have seen this. Reveal it to everyone, or keep it to yourself for now (it's saved under "Evidence You Found").</p><div class="row-gap" style="justify-content:center"><button class="btn gold" id="scanReveal">REVEAL TO EVERYONE</button><button class="btn ghost" id="scanClose">KEEP IT FOR NOW</button></div>`}</div></div>`;
      bind = () => { const r = $('#scanReveal'); if (r) r.onclick = () => { revealEvidence(e, c.id, roomName(e.room), 'found'); log(`${c.name} revealed "${e.title}"`, 'player'); ui.scan = null; toast('REVEALED', 'Everyone can now see it.', 'ok'); render(); }; $('#scanClose').onclick = () => { ui.scan = null; render(); }; };
    } else {
      const msg = { nothing: ['NOTHING OF INTEREST', "This tag isn't part of the investigation."], dead: ['THE DEAD DON\'T INVESTIGATE', 'You can watch and listen, but you can\'t collect evidence.'],
        sealed: ['SEALED AREA', `${sc.e ? esc(roomName(sc.e.room)) : 'This room'} is sealed. Leave it as you found it until your phone says it's open.`], locked: ['LOCKED', 'This item can\'t be examined yet. Try again later in the night.'] }[sc.kind];
      html = `<div class="overlay fullmsg blocked"><div class="box"><div class="k">KANE-OS · EVIDENCE SCAN</div><h1 style="font-size:clamp(22px,6vw,32px)">${msg[0]}</h1><p>${msg[1]}</p>${close}</div></div>`;
      bind = () => $('#scanClose').onclick = () => { ui.scan = null; render(); };
    }
  } else if (newOfficial) {
    sig = 'off' + newOfficial.id; html = `<div class="overlay fullmsg incoming"><div class="box"><div class="antenna"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#5ad6ff" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></div>
      <div class="k">OFFICIAL REPORT RECEIVED</div><h1 style="font-size:clamp(22px,6vw,32px)">${esc(newOfficial.title)}</h1><p>It's in your Case File. Read it aloud to the room, then press <b>RELEASE TO ALL</b>.</p><button class="btn gold" id="offAck">OPEN CASE FILE</button></div></div>`;
    bind = () => $('#offAck').onclick = () => { store.set(offKey(newOfficial.id), '1'); renderOverlays(); scrollToId('casePanel'); };
  } else if (newLines) {
    sig = 'lines' + newLines.id; html = `<div class="overlay fullmsg memory"><div class="box"><div class="k">YOUR LINES · ${esc(newLines.title.toUpperCase())}</div><div class="msg">${esc(fillLines(newLines.text))}</div><button class="btn gold" id="lineAck">GOT IT</button></div></div>`;
    bind = () => $('#lineAck').onclick = () => { store.set(lineKey(newLines.id), '1'); renderOverlays(); scrollToId('casePanel'); };
  } else if (mem) {
    sig = 'mem' + mem.j; html = `<div class="overlay fullmsg memory"><div class="box"><div class="k">${mem.cue ? 'INSTRUCTION FROM THE HOST' : 'A MEMORY SURFACES'}</div><div class="msg">${esc(mem.text)}</div><button class="btn gold" id="memAck">${mem.cue ? 'UNDERSTOOD' : 'REMEMBER THIS'}</button></div></div>`;
    bind = () => $('#memAck').onclick = () => { store.set(memKey(mem.j), '1'); renderOverlays(); };
  } else if (unread) {
    sig = 'msg' + unread.mid; html = `<div class="overlay fullmsg incoming"><div class="box"><div class="k">MESSAGE FROM THE COMMAND CENTER</div><div class="msg">${esc(unread.text)}</div><button class="btn gold" id="msgAck">ACKNOWLEDGE</button></div></div>`;
    bind = () => $('#msgAck').onclick = () => ackMsg(unread.mid);
  } else if (c && c.killer && S.flags.killer && store.get('revealSeen') !== S.epoch) {
    sig = 'reveal'; html = `<div class="overlay fullmsg reveal"><div class="box"><div class="k">CLEARANCE ELEVATED · FILE UNSEALED</div><h1>YOU ARE THE KILLER</h1>
      <div class="typed">${(c.killer.reveal || []).map(l => '&gt; ' + esc(l)).join('<br>')}</div>
      <p>Your full file is now unsealed. A Termination Directive is waiting for you. Keep your screen hidden. Stay warm. Stay calm.</p><button class="btn danger" id="revealAck">OPEN MY FILE</button></div></div>`;
    bind = () => $('#revealAck').onclick = () => { store.set('revealSeen', S.epoch); renderOverlays(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  }
  if (patch(fm, sig, html) && sig !== 'none') buzz(sig.startsWith('mem') || sig.startsWith('lines') || sig.startsWith('off') ? [120, 80, 120] : []);
  if (bind && fm.innerHTML) bind();
  document.body.style.overflow = (lockOn || sig !== 'none') ? 'hidden' : '';
}
$('#bypassBtn').addEventListener('click', () => { ui.bypass = true; renderOverlays(); toast('HOST OVERRIDE', 'Lockdown bypassed on this device only.', 'ok'); });

boot();
