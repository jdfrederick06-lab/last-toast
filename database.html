<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Kane Oil Database</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
/* login */
.login-wrap{min-height:calc(100vh - 40px);display:flex;align-items:center;justify-content:center;padding:20px 0}
.login{width:100%;max-width:440px;text-align:center}
.login .logo{margin:0 auto 14px;width:84px;height:84px;filter:drop-shadow(0 0 18px rgba(217,178,91,.55));animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-4px)}}
.login h1{margin:0;font-size:22px;letter-spacing:.22em;font-weight:800;color:var(--gold2);text-shadow:0 0 22px rgba(217,178,91,.35)}
.login .tag{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--cyan);margin:6px 0 20px;text-transform:uppercase}
.term{text-align:left;font-family:var(--mono);font-size:12px;line-height:1.7;color:#7fb2ff;background:rgba(2,6,14,.85);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:16px;min-height:96px}
.term .ok{color:var(--green)}.term .err{color:var(--red2)}
.term .cursor{display:inline-block;width:8px;height:14px;background:var(--cyan);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.code-input{text-align:center;letter-spacing:.3em;font-family:var(--mono);font-size:20px;text-transform:uppercase;font-weight:700}
.login .foot{margin-top:18px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--dim)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.login-err{color:var(--red2);font-family:var(--mono);font-size:12px;letter-spacing:.1em;min-height:18px;margin-top:10px}
.loading{min-height:60vh;display:grid;place-items:center;font-family:var(--mono);letter-spacing:.2em;color:var(--cyan);font-size:12px}

/* dossier */
.dhead{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.hex{width:78px;height:88px;position:relative;display:grid;place-items:center;flex:none}
.hex svg{position:absolute;inset:0}
.hex span{position:relative;font-weight:800;font-size:24px;color:var(--gold2);text-shadow:0 0 12px rgba(217,178,91,.6)}
.hex.red span{color:var(--red2);text-shadow:0 0 12px rgba(255,59,84,.7)}
.dname{margin:0;font-size:clamp(22px,5.4vw,32px);line-height:1.1;font-weight:800}
.cls{display:inline-block;margin-top:10px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;padding:5px 9px;border-radius:7px;border:1px solid rgba(217,178,91,.45);color:var(--gold2);background:var(--gold-dim);line-height:1.4}
.cls.red{border-color:rgba(255,59,84,.6);color:var(--red2);background:var(--red-dim);box-shadow:0 0 16px rgba(255,59,84,.25)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:16px}
.kv div{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:rgba(3,7,16,.5)}
.kv b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--dim);font-weight:500;margin-bottom:3px;text-transform:uppercase}
.kv span{font-size:14px;font-weight:600}
.sec{padding:16px 0;border-top:1px dashed rgba(88,140,255,.18)}
.sec:first-child{border-top:0}
.sec h3{margin:0 0 8px;font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700;display:flex;gap:8px;align-items:center}
.sec p{margin:0;font-size:16.5px;line-height:1.7;color:#dbe4f4;max-width:72ch}
.sec.key{background:linear-gradient(90deg,rgba(217,178,91,.08),transparent);border-left:2px solid var(--gold);padding-left:14px;border-top:0;border-radius:0 8px 8px 0}
.sec.key h3{color:var(--gold2)}
.sec.role p{font-style:italic;color:var(--muted)}
.sealed{border:1px solid rgba(255,59,84,.35);border-radius:10px;padding:12px;background:repeating-linear-gradient(135deg,rgba(255,59,84,.07) 0 10px,transparent 10px 20px)}
.sealed .bars{display:flex;flex-direction:column;gap:6px}
.sealed .bars i{display:block;height:12px;background:#1a0a10;border-radius:2px;box-shadow:inset 0 0 0 1px rgba(255,59,84,.25)}
.sealed small{display:block;margin-top:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--red2)}
.stamp{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--dim);text-align:center;margin-top:8px}

/* evidence */
.ev{border:1px solid var(--line2);border-radius:12px;background:rgba(3,7,16,.6);margin-bottom:10px;overflow:hidden}
.ev summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;align-items:center;gap:10px}
.ev summary::-webkit-details-marker{display:none}
.ev summary .t{flex:1;font-weight:700;font-size:15px}
.ev summary .when{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.ev summary::after{content:"+";font-family:var(--mono);color:var(--gold);font-size:18px}
.ev[open] summary::after{content:"–"}
.ev .body{padding:0 14px 14px;font-size:15.5px;line-height:1.7;color:#d8e2f3;white-space:pre-line}
.ev .src{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--cyan);margin-bottom:8px}
.ev.new{border-color:var(--gold);box-shadow:0 0 22px rgba(217,178,91,.3);animation:evglow 1.6s ease-in-out 3}
@keyframes evglow{50%{box-shadow:0 0 36px rgba(217,178,91,.6)}}

/* vote / directive */
.voted{border:1px solid rgba(47,227,155,.4);background:rgba(47,227,155,.06);border-radius:11px;padding:12px 14px;margin-bottom:14px;font-size:14px;line-height:1.5}
.voted b{color:var(--green)}
.targets{display:grid;gap:10px;margin:6px 0 16px}
.target{display:flex;gap:12px;align-items:center;border:1px solid rgba(255,59,84,.35);border-radius:12px;padding:12px 14px;background:rgba(20,4,10,.6);cursor:pointer;text-align:left;width:100%}
.target.sel{border-color:var(--red);background:rgba(255,59,84,.14);box-shadow:0 0 22px rgba(255,59,84,.3)}
.target .rad{width:18px;height:18px;border-radius:50%;border:2px solid var(--red2);flex:none;display:grid;place-items:center}
.target.sel .rad::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--red)}
.target b{display:block;font-size:16px}
.target small{display:block;font-size:13px;color:var(--red2);font-family:var(--mono);margin-top:2px}
.deadstrip{border:1px solid var(--red);background:var(--red-dim);color:var(--red2);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-align:center}

/* admin */
.tabs{display:flex;gap:6px;margin:0 0 16px;overflow-x:auto;padding-bottom:2px}
.tab{flex:1;min-width:max-content;border:1px solid var(--line2);background:rgba(3,7,16,.6);border-radius:11px;padding:11px 14px;font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;color:var(--muted);cursor:pointer;text-transform:uppercase}
.tab.on{border-color:var(--gold);color:var(--gold2);background:var(--gold-dim);box-shadow:0 0 18px rgba(217,178,91,.18)}
.grid2{display:grid;grid-template-columns:1fr;gap:0 16px}
@media(min-width:900px){.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel)}
.stat b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.stat b em{font-style:normal;font-size:14px;color:var(--dim);font-weight:600}
.stat span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.ctl{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.ctl:first-of-type{border-top:0;padding-top:0}
.ctl .txt{flex:1;min-width:0}
.ctl .txt b{display:block;font-size:15px}
.ctl .txt small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.4}
.toggle{position:relative;width:60px;height:32px;border-radius:999px;border:1px solid var(--line2);background:#060b16;cursor:pointer;flex:none;transition:.2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#4a5775;transition:.2s}
.toggle[aria-pressed="true"]{background:rgba(47,227,155,.2);border-color:var(--green);box-shadow:0 0 14px rgba(47,227,155,.35)}
.toggle[aria-pressed="true"]::after{left:31px;background:var(--green)}
.toggle.red[aria-pressed="true"]{background:rgba(255,59,84,.22);border-color:var(--red);box-shadow:0 0 16px rgba(255,59,84,.45)}
.toggle.red[aria-pressed="true"]::after{background:var(--red)}
.state{font-family:var(--mono);font-size:10px;letter-spacing:.12em;width:30px;text-align:right;color:var(--dim)}
.state.on{color:var(--green)}.state.on.r{color:var(--red2)}
.relist{display:flex;flex-direction:column;gap:8px}
.reitem{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:rgba(3,7,16,.5);font-size:14px}
.reitem .t{flex:1;min-width:0}
.reitem .t small{display:block;font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(90px,150px) 1fr 34px;gap:10px;align-items:center;font-size:14px}
.bar .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .track{height:14px;border-radius:7px;background:rgba(88,140,255,.08);overflow:hidden;border:1px solid var(--line)}
.bar .fill{height:100%;border-radius:7px;background:linear-gradient(90deg,#3d8bff,#5ad6ff);transition:width .5s ease}
.bar.lead .fill{background:linear-gradient(90deg,#c79b3f,#f5dc93);box-shadow:0 0 14px rgba(217,178,91,.6)}
.bar.lead .n{color:var(--gold2);font-weight:700}
.bar .c{font-family:var(--mono);font-weight:700;text-align:right}
.roster-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--dim);margin:14px 0 8px;text-transform:uppercase}
.rrow{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:4px 10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:7px;background:rgba(3,7,16,.5);cursor:pointer}
.rrow:hover{border-color:var(--gold);background:rgba(217,178,91,.06)}
.rrow .nm{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .nm small{font-weight:500;color:var(--dim);font-family:var(--mono);font-size:10.5px;margin-left:6px}
.rrow .tags{display:flex;gap:5px;justify-content:flex-end;flex-wrap:wrap}
.rrow .vote{grid-column:2 / 4;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .vote b{color:var(--gold2);font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:#3a4560}
.dot.on{background:var(--green);box-shadow:0 0 10px var(--green)}
.rrow.dead .nm{color:var(--red2);text-decoration:line-through;text-decoration-color:rgba(255,59,84,.5)}
.host-notes{font-size:14.5px;line-height:1.65;color:#d8e2f3}.host-notes li{margin-bottom:6px}
.scenes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.linkrow{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.linkrow:first-child{border-top:0;padding-top:0}
.linkrow .u{font-family:var(--mono);font-size:12px;color:var(--cyan);word-break:break-all}
.linkrow b{display:block;font-size:14px}
.guest{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:rgba(3,7,16,.5)}
.guest .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.guest .gn{font-weight:700;font-size:15px;flex:1;min-width:120px}
.guest .meta{font-size:12.5px;color:var(--muted);margin:6px 0 8px;line-height:1.5}
.guest .assign{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;margin-top:6px}
.guest .assign .who{font-size:12px;color:var(--dim);font-family:var(--mono);grid-column:1 / -1;margin-top:4px}
.qrbox{background:#fff;border-radius:12px;padding:14px;display:inline-block}
.qrbox img{display:block;image-rendering:pixelated;width:260px;height:260px}

/* overlays */
#alertbar{position:fixed;left:0;right:0;top:0;z-index:60;pointer-events:none}
.alert{pointer-events:auto;margin:8px;border-radius:12px;padding:12px 44px 12px 14px;position:relative;font-weight:700;font-size:14.5px;line-height:1.4;border:1px solid var(--red);background:linear-gradient(180deg,#5c0716,#2a030a);color:#fff;box-shadow:0 0 40px rgba(255,59,84,.55);animation:flash 1s steps(1) infinite}
.alert .h{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--red2);margin-bottom:3px}
.alert.notice{border-color:var(--gold);background:linear-gradient(180deg,#3a2c0c,#1b1405);box-shadow:0 0 30px rgba(217,178,91,.45);animation:none}
.alert.notice .h{color:var(--gold2)}
.alert .x{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:transparent;cursor:pointer;color:#fff}
@keyframes flash{0%{background:linear-gradient(180deg,#8a0b20,#3c040e)}50%{background:linear-gradient(180deg,#2a030a,#14020a)}}
.overlay{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
#lockdown{background:radial-gradient(circle at 50% 40%,rgba(120,8,24,.96),rgba(10,2,6,.99) 70%);flex-direction:column}
#lockdown::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,rgba(255,59,84,.07) 0 22px,transparent 22px 44px)}
.lk{position:relative;max-width:560px}
.lk .ring{width:120px;height:120px;margin:0 auto 22px;border-radius:50%;border:3px solid var(--red);display:grid;place-items:center;box-shadow:0 0 50px rgba(255,59,84,.7),inset 0 0 30px rgba(255,59,84,.5);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07);box-shadow:0 0 80px rgba(255,59,84,.95),inset 0 0 40px rgba(255,59,84,.7)}}
.lk h1{margin:0 0 10px;font-size:clamp(28px,8vw,46px);letter-spacing:.14em;font-weight:800;color:#fff;text-shadow:0 0 24px rgba(255,59,84,.9)}
.lk p{margin:0 auto;font-size:clamp(17px,4.4vw,21px);line-height:1.5;color:#ffd6dc;max-width:30ch}
.lk .m{margin-top:20px;font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--red2)}
.fullmsg{background:rgba(2,4,10,.96);flex-direction:column}
.fullmsg .box{max-width:520px;position:relative}
.fullmsg h1{margin:0 0 12px;font-size:clamp(26px,7vw,40px);letter-spacing:.1em;font-weight:800}
.fullmsg p{font-size:17px;line-height:1.6;color:#d8e2f3;margin:0 0 12px}
.fullmsg .k{font-family:var(--mono);font-size:11px;letter-spacing:.22em;margin-bottom:14px}
.fullmsg.dead{background:radial-gradient(circle at 50% 40%,rgba(90,0,14,.97),rgba(4,0,2,.99) 70%)}
.fullmsg.dead h1{color:#fff;text-shadow:0 0 30px var(--red)}
.fullmsg.dead .k{color:var(--red2)}
.fullmsg.reveal h1{color:var(--red2);text-shadow:0 0 30px rgba(255,59,84,.7)}
.fullmsg.reveal .k{color:var(--gold2)}
.typed{font-family:var(--mono);font-size:13px;line-height:1.8;color:#9fc3ff;text-align:left;background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 18px}
@media(max-width:520px){.dhead{grid-template-columns:1fr}.hex{width:64px;height:72px}}
</style>
</head>

<script>
/* =========================================================================
   KANE OIL DATABASE — player dossiers + host command center
   ========================================================================= */
const ROSTER_LIST = window.STORY_ROSTER || [];
const ROSTER = Object.fromEntries(ROSTER_LIST.map(r => [r.id, r]));
const PARTYX = window.PARTY || {};
let backend = null, S = normRoot({}), ready = false;
let ME = null;    // decrypted bundle for this device: {type:'player', c} or {type:'host', …}
let HOST = null;  // host conveniences
const rname = id => (ROSTER[id] && ROSTER[id].name) || (HOST && HOST.chars[id] && HOST.chars[id].name) || id;
const PL = id => 'live/players/' + id;

const TAB_KEY = store.k('session');
let session = (() => { let raw = null; try { raw = sessionStorage.getItem(TAB_KEY); } catch (e) { } if (!raw) raw = store.get('session'); try { return JSON.parse(raw || 'null'); } catch (e) { return null; } })();
const saveSession = s => {
  session = s; const raw = s ? JSON.stringify(s) : null;
  try { raw ? sessionStorage.setItem(TAB_KEY, raw) : sessionStorage.removeItem(TAB_KEY); } catch (e) { }
  if (raw) store.set('session', raw); else store.del('session');
};
const ui = { built: null, bypass: false, selTarget: null, seenEvidence: null, tab: store.get('hostTab') || 'live' };
const isHostDevice = () => store.get('hostDevice') === '1';
const dead = () => deathsOf(S);
function playerRec(id) { const p = S.players[id]; return (p && p.epoch === S.epoch) ? p : null; }
function isOnline(id) { const p = playerRec(id); return !!(p && typeof p.lastSeen === 'number' && backend && backend.now() - p.lastSeen < CONFIG.ONLINE_WINDOW_MS); }

/* ---------------- boot ---------------- */
async function boot() {
  if (!window.STORY_LOCKED) { $('#app').innerHTML = offline('story.locked.js is missing. Build it with private/build.html and upload it next to this page.'); return; }
  if (!window.crypto || !crypto.subtle) { $('#app').innerHTML = offline('This page must be opened over a secure (https) connection.'); return; }
  render();
  backend = await connectBackend(renderConn);
  backend.on(raw => { const prev = S, was = ready; S = normRoot(raw); ready = true; onState(prev, was); });
  if (session) await restore();
  setInterval(heartbeat, CONFIG.HEARTBEAT_MS);
  setInterval(() => { if (HOST) renderAdmin(); }, 2000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) heartbeat(); });
}
const offline = msg => `<div class="panel red" style="margin-top:40px"><div class="ph"><h2>System offline</h2></div><p class="note">${esc(msg)}</p></div>`;

async function restore() {
  let b = null; try { b = await unlockStory(session.code); } catch (e) { }
  if (!b) saveSession(null); else await adopt(b);
  ui.built = null; render();
}
async function adopt(b) {
  ME = b;
  if (b.type === 'host') {
    HOST = {
      list: b.characters, chars: Object.fromEntries(b.characters.map(c => [c.id, c])),
      evidence: b.evidence, ev: Object.fromEntries(b.evidence.map(e => [e.id, e])),
      notes: b.hostNotes, killerId: b.killerId, built: b.built,
      assign: {}, assignCt: null, assignKey: await deriveAssignKey(session.code)
    };
    await syncAssign();
  } else HOST = null;
}
async function syncAssign() {
  if (!HOST) return;
  const blob = S.assign, ct = blob ? blob.ct : '';
  if (ct === HOST.assignCt) return;
  HOST.assignCt = ct;
  if (!blob) { HOST.assign = {}; return; }
  try { HOST.assign = await decryptJSON(HOST.assignKey, blob); } catch (e) { HOST.assign = {}; console.warn('Role assignments were saved under a different host code.'); }
}
async function saveAssign() {
  const blob = await encryptJSON(HOST.assignKey, HOST.assign);
  HOST.assignCt = blob.ct;
  await backend.set('assign', blob);
  renderAdmin();
}

function onState(prev, was) {
  if (session && session.role === 'player' && ME && session.epoch !== S.epoch) {
    saveSession(null); ME = null; ui.built = null;
    toast('SESSION ENDED', 'The system was reset. Enter your code word again.', 'err');
  }
  if (!S.flags.lockdown) ui.bypass = false;
  if (was && ME && ME.type === 'player') {
    const newEv = Object.keys(S.evidence).filter(id => !prev.evidence[id]);
    if (newEv.length) toast('NEW EVIDENCE RELEASED', (S.evidence[newEv[0]].title || '') + (newEv.length > 1 ? ` (+${newEv.length - 1} more)` : ''), '', () => scrollToId('evidencePanel'));
    if (S.flags.voting && !prev.flags.voting) toast('VOTING IS NOW OPEN', 'Submit your official accusation.', 'ok', () => scrollToId('votePanel'));
  }
  if (was && S.alert && (!prev.alert || prev.alert.id !== S.alert.id) && S.alert.type === 'kill') {
    try { navigator.vibrate && navigator.vibrate([300, 120, 300, 120, 500]); } catch (e) { }
  }
  if (ME && ME.type === 'player' && !playerRec(ME.c.id)) heartbeat();
  if (HOST && (S.assign ? S.assign.ct : '') !== HOST.assignCt) syncAssign().then(renderAdmin);
  render();
}

function heartbeat() {
  if (!backend || !ready || !ME || ME.type !== 'player' || session.epoch !== S.epoch) return;
  const id = ME.c.id, p = PL(id), rec = S.players[id];
  const upd = { [p + '/lastSeen']: backend.TS(), [p + '/epoch']: session.epoch, [p + '/unlocked']: true };
  if (!rec || rec.epoch !== session.epoch || !rec.unlockedAt) upd[p + '/unlockedAt'] = backend.TS();
  backend.update(upd);
}

function loginHTML() {
  return `<div class="login-wrap"><div class="login panel gold">
    <div class="logo">${LOGO(84)}</div>
    <h1>KANE OIL &amp; ENERGY</h1>
    <div class="tag">Secure Personnel Portal</div>
    <div class="term" id="term"></div>
    <form id="loginForm" autocomplete="off">
      <label class="lbl" for="codeIn" style="text-align:left">Code word</label>
      <input class="input code-input" id="codeIn" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="••••••••" maxlength="40">
      <div style="height:12px"></div>
      <button class="btn gold block" id="authBtn" type="submit">AUTHENTICATE</button>
      <div class="login-err" id="loginErr"></div>
    </form>
    <div class="foot">AUTHORIZED PERSONNEL ONLY · ALL ACCESS IS LOGGED</div>
  </div></div>`;
}
function bindLogin() {
  const term = $('#term');
  const lines = [['', '> KANE-OS secure boot'], ['ok', '  [ OK ] encrypted channel established'], ['', '> awaiting credential']];
  let i = 0;
  (function next() { if (!term.isConnected) return; if (i < lines.length) { term.innerHTML = lines.slice(0, ++i).map(([c, t]) => `<div class="${c}">${esc(t)}</div>`).join('') + '<span class="cursor"></span>'; setTimeout(next, 380); } })();
  $('#loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const code = normCode($('#codeIn').value), err = $('#loginErr'), card = $('.login'), btn = $('#authBtn');
    if (!code) return;
    const lockUntil = +store.get('lockUntil') || 0;
    if (Date.now() < lockUntil) { err.textContent = `TOO MANY ATTEMPTS · TRY AGAIN IN ${Math.ceil((lockUntil - Date.now()) / 1000)}s`; return; }
    btn.disabled = true; btn.textContent = 'VERIFYING…'; err.textContent = '';
    term.querySelector('.cursor')?.remove();
    term.insertAdjacentHTML('beforeend', `<div>&gt; verifying credential…</div>`);
    const [b] = await Promise.all([unlockStory(code).catch(() => null), sleep(700)]);
    if (!b) {
      const fails = (+store.get('fails') || 0) + 1;
      if (fails >= 5) { store.set('lockUntil', String(Date.now() + 30000)); store.set('fails', '0'); } else store.set('fails', String(fails));
      term.insertAdjacentHTML('beforeend', `<div class="err">  [FAIL] credential not recognized</div>`);
      err.textContent = fails >= 5 ? 'TOO MANY ATTEMPTS · TRY AGAIN IN 30s' : 'ACCESS DENIED';
      card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
      btn.disabled = false; btn.textContent = 'AUTHENTICATE'; return;
    }
    store.set('fails', '0');
    term.insertAdjacentHTML('beforeend', `<div class="ok">  [ OK ] access granted</div>`);
    for (let n = 0; n < 50 && !ready; n++) await sleep(200);
    saveSession({ role: b.type === 'host' ? 'admin' : 'player', code, id: b.c ? b.c.id : null, epoch: S.epoch });
    if (b.type === 'host') store.set('hostDevice', '1');
    await adopt(b);
    if (b.type === 'player') { backend.onDisconnect(PL(b.c.id) + '/lastSeen', 0); heartbeat(); }
    ui.built = null; render(); window.scrollTo(0, 0);
  });
}

function revealedFor(c, host) { return host || (c.killer ? S.flags.killer : (c.id in dead())); }
function hexBadge(c, red) {
  const col = red ? '#ff3b54' : '#d9b25b';

}
const sealedBlock = (small = 'SEALED · CLEARANCE INSUFFICIENT', bars = [96, 88, 72]) => `<div class="sealed"><div class="bars">${bars.map(w => `<i style="width:${w}%"></i>`).join('')}</div><small>▲ ${small}</small></div>`;
function dossierHTML(c, host = false) {
  const rv = revealedFor(c, host), isDead = c.id in dead();
  const cls = rv && c.clsSecret ? c.clsSecret : c.cls;
  const red = (rv && c.killer) || isDead;
  const secs = c.sections.map(s => {
    if (s.hostOnly && !host) return '';

      if (s.sealed === true) return `<div class="sec"><h3>${esc(s.h)}</h3>${sealedBlock()}</div>`;
      return `<div class="sec ${s.role ? 'role' : ''}"><h3>${esc(s.h)}</h3><p>${esc(s.sealed)}</p><div style="margin-top:10px">${sealedBlock('ADDITIONAL RECORDS SEALED', [80])}</div></div>`;
    }
    const tag = s.hostOnly ? '<span class="pill gold">HOST ONLY</span>' : '';
    return `<div class="sec ${s.key ? 'key' : ''} ${s.role ? 'role' : ''}"><h3>${esc(s.h)} ${tag}</h3><p>${esc(s.t)}</p></div>`;
  }).join('');
  return `
    <div class="dhead">${hexBadge(c, red)}
      <div><div class="mono" style="font-size:11px;letter-spacing:.2em;color:var(--dim)">PERSONNEL FILE${host ? ' ' + esc(c.file || '') + (c.tier === 'ext' ? ' · EXTENDED CAST' : '') : ''}</div>
      <h1 class="dname">${esc(c.name)}</h1>
      <div class="cls ${red ? 'red' : ''}">CLASSIFICATION: ${esc(cls || 'SUBJECT')}${isDead && !/DECEASED/.test(cls || '') ? ' · DECEASED' : ''}</div></div>
    </div>
    <div class="kv">
      <div><b>Code word</b><span class="mono">${esc(c.code)}</span></div>
      <div><b>Age</b><span>${esc(c.age)}</span></div>
      <div style="grid-column:span 2"><b>Occupation</b><span>${esc(c.occ)}</span></div>
    </div>
    <div style="margin-top:6px">${secs}</div>
    <div class="stamp">████ END OF FILE ████</div>`;
}

  const setTab = t => { ui.tab = t; store.set('hostTab', t); $$('#tabs .tab').forEach(b => b.classList.toggle('on', b.dataset.tab === t)); $$('[data-pane]').forEach(p => p.classList.toggle('hidden', p.dataset.pane !== t)); };
  $('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) setTab(b.dataset.tab); });
  setTab(['live', 'proj', 'guests'].includes(ui.tab) ? ui.tab : 'live');
  $('#notesBtn').onclick = () => openModal(`<div class="ph"><h2>Host-Only Notes</h2><span class="sub">DO NOT DISTRIBUTE</span></div><div class="host-notes">${HOST.notes || '<p class="note">No notes yet. Add hostNotes in story.js.</p>'}</div>`);

  // flags
  $$('[data-flag]').forEach(b => b.addEventListener('click', () => {
    const f = b.dataset.flag, val = !S.flags[f];
    backend.update({ ['live/flags/' + f]: val });
    toast(f.toUpperCase() + (val ? ' ON' : ' OFF'), '', val && f !== 'voting' ? 'err' : 'ok');
  }));

  // evidence
  const evSel = $('#evSel'), prev = () => { const e = HOST.ev[evSel.value]; $('#evPreview').textContent = e ? e.src + '\n\n' + e.body : ''; };
  evSel.addEventListener('change', prev); prev();
  $('#pushBtn').addEventListener('click', () => {
    const e = HOST.ev[evSel.value]; if (!e) return;
    if (S.evidence[e.id]) { toast('ALREADY LIVE', e.title + ' is already in the locker.', 'err'); return; }
    const upd = { ['live/evidence/' + e.id]: { ts: backend.TS(), title: e.title, src: e.src || '', body: e.body, tier: e.tier || '' } };
    if (autoProj()) upd['live/display'] = { scene: 'evidence', evidenceId: e.id, ts: backend.TS() };
    backend.update(upd);
    toast('EVIDENCE PUSHED', e.title, 'ok');
  });
  $('#pushedList').addEventListener('click', e => { const b = e.target.closest('[data-retract]'); if (b) backend.update({ ['live/evidence/' + b.dataset.retract]: null }); });

  // deaths
  $('#deathList').addEventListener('click', e => {
    const a = e.target.closest('[data-announce]'); if (a) announceDeath(a.dataset.announce);
    const u = e.target.closest('[data-undo-death]'); if (u) backend.update({ ['live/deaths/' + u.dataset.undoDeath]: null });
  });
  $('#killStatus').addEventListener('click', e => {
    if (!e.target.closest('#undoKill')) return;
    openModal(`<div class="ph"><h2>Undo the killer's strike?</h2></div><p class="note">This clears the victim so the killer can choose again. Only use it if the kill was a mistake.</p><div class="row-gap" style="margin-top:14px"><button class="btn danger" id="undoYes">UNDO</button><button class="btn ghost" data-close>CANCEL</button></div>`);
    $('#undoYes').onclick = () => { backend.update({ 'live/kill': null }); closeModal(); };
  });

  // broadcast
  $('#bcBtn').addEventListener('click', () => {
    const t = $('#bcIn').value.trim(); if (!t) return;
    backend.update({ 'live/alert': { id: uid('a'), type: 'notice', text: t, ts: backend.TS() } });
    $('#bcIn').value = ''; toast('BROADCAST SENT', t, 'ok');
  });
  $('#alertStatus').addEventListener('click', e => { if (e.target.closest('#clearAlert')) backend.update({ 'live/alert': null }); });
  $('#roster').addEventListener('click', e => { const r = e.target.closest('[data-char]'); if (r) openDossierModal(r.dataset.char); });

  // reset
  $('#resetBtn').addEventListener('click', () => {
    openModal(`<div class="ph"><h2 style="color:var(--red2)">Hard Reset</h2></div>
      <p style="line-height:1.6">This wipes <b>all</b> votes, deaths, alerts, released evidence, online status and dossier logins, and turns every control off. Every player is logged out. RSVPs and role assignments are kept.</p>
      <label class="lbl" for="resetConfirm">Type RESET to confirm</label>
      <input class="input mono" id="resetConfirm" autocomplete="off" autocapitalize="characters">
      <div class="row-gap" style="margin-top:14px"><button class="btn danger" id="resetYes" disabled>WIPE GAME DATA</button><button class="btn ghost" data-close>CANCEL</button></div>`);
    const inp = $('#resetConfirm'), yes = $('#resetYes');
    inp.focus(); inp.oninput = () => { yes.disabled = inp.value.trim().toUpperCase() !== 'RESET'; };
    yes.onclick = async () => { yes.disabled = true; yes.textContent = 'WIPING…'; await backend.set('live', freshLive()); toast('SYSTEM RESET', 'Game data cleared. Ready for a new game.', 'ok'); closeModal(); };
  });

  // projector
  $('#openDisplay').href = siteBase() + 'display.html';
  $('#scenes').addEventListener('click', e => { const b = e.target.closest('[data-scene]'); if (b) setScene(b.dataset.scene); });
  $('#featBtn').addEventListener('click', () => { const id = $('#featSel').value; if (id) setScene('evidence', { evidenceId: id }); });
  $('#msgBtn').addEventListener('click', () => { const t = $('#msgIn').value.trim(); if (t) setScene('message', { text: t }); });
  const ap = $('#autoProj'); ap.checked = autoProj(); ap.onchange = () => store.set('autoProj', ap.checked ? '1' : '0');

  // guests
  const base = siteBase(), P = PARTYX;
  const links = [['invite', 'Invitation & RSVP', base], ['db', 'Kane Oil Database (party night)', base + 'database.html'], ['display', 'Projector display', base + 'display.html']];
  $('#links').innerHTML = links.map(([k, label, url]) => `<div class="linkrow"><div><b>${label}</b><span class="u">${esc(url)}</span></div><div class="row-gap"><button class="btn sm ghost" data-copy="${k}">COPY</button><button class="btn sm ghost" data-qr="${k}">QR</button><a class="btn sm ghost" href="${esc(url)}" target="_blank" rel="noopener">OPEN</a></div></div>`).join('');
  const urlOf = k => (links.find(l => l[0] === k) || [])[2];
  $('#app').onclick = async e => {
    const c = e.target.closest('[data-copy]'); if (c) { await copyText(urlOf(c.dataset.copy)); toast('COPIED', urlOf(c.dataset.copy), 'ok'); }
    const q = e.target.closest('[data-qr]'); if (q) showQR(urlOf(q.dataset.qr));
  };
  $('#inviteMsg').value = `You're invited to ${(P.title || 'The Last Toast').toUpperCase()}: ${P.subtitle || 'a murder mystery evening'}, hosted by ${P.host || 'me'}.\n\n${P.date || ''}${P.time ? ', ' + P.time : ''}\n${P.venue || ''}\n\nAll the details, and your RSVP, are here:\n${base}\n\nPlease RSVP by ${P.rsvpBy || 'soon'}. Roles and secret code words go out after that.`;
  $('#copyInvite').onclick = async () => { await copyText($('#inviteMsg').value); toast('COPIED', 'Invitation message copied.', 'ok'); };
  $('#rsvpList').addEventListener('change', async e => {
    const s = e.target.closest('[data-assign]'); if (!s) return;
    if (s.value) HOST.assign[s.dataset.assign] = s.value; else delete HOST.assign[s.dataset.assign];
    await saveAssign();
  });
  $('#rsvpList').addEventListener('click', async e => {
    const cp = e.target.closest('[data-rolemsg]');
    if (cp) { const [key, name] = [cp.dataset.rolemsg, cp.dataset.name]; const c = HOST.chars[HOST.assign[key]]; if (!c) { toast('NO ROLE YET', 'Assign a character first.', 'err'); return; } await copyText(roleMessage(name, c)); toast('ROLE TEXT COPIED', `Paste it into a private message to ${name}.`, 'ok'); }
    const del = e.target.closest('[data-delrsvp]');
    if (del) {
      const id = del.dataset.delrsvp;
      openModal(`<div class="ph"><h2>Delete this RSVP?</h2></div><p class="note">Removes ${esc((S.rsvps[id] || {}).name || 'this guest')} and any roles assigned to them.</p><div class="row-gap" style="margin-top:14px"><button class="btn danger" id="delYes">DELETE</button><button class="btn ghost" data-close>CANCEL</button></div>`);
      $('#delYes').onclick = async () => { delete HOST.assign[id]; delete HOST.assign[id + '#p']; await backend.set('rsvps/' + id, null); await saveAssign(); closeModal(); };
    }
  });
}
const autoProj = () => store.get('autoProj') !== '0';
function setScene(scene, extra = {}) { backend.update({ 'live/display': Object.assign({ scene, ts: backend.TS() }, extra) }); }
function roleMessage(name, c) {
  return `Hi ${name}! Your role for ${(PARTYX.title || 'The Last Toast').toUpperCase()}:\n\n${c.name}\n${c.occ || ''}\n\nYour secret code word: ${c.code}\n\nOpen ${siteBase()}database.html and enter it to read your dossier. Keep your code word to yourself, and don't show your dossier to anyone!`;
}
async function showQR(url) {
  try { if (!window.qrcode) await loadScript('https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js'); }
  catch (e) { toast('QR UNAVAILABLE', 'Could not load the QR generator.', 'err'); return; }
  const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
  openModal(`<div class="ph"><h2>Scan to open</h2></div><div style="text-align:center"><div class="qrbox">${qr.createImgTag(8, 2)}</div><p class="mono" style="font-size:12px;color:var(--cyan);word-break:break-all">${esc(url)}</p><p class="note">Right-click (or long-press) the code to save it for printing.</p></div>`);
}
function announceDeath(id) {
  const c = HOST.chars[id]; if (!c) return;
  const def = c.deathAlert || `${c.name} has been found dead. All personnel remain where you are.`;
  openModal(`<div class="ph"><h2 style="color:var(--red2)">Announce death · ${esc(c.name)}</h2></div>
    <p class="note" style="margin:0 0 10px">Their dossier switches to deceased, their phone tells them they've died, and this alert flashes on every screen and the projector.</p>
    <label class="lbl" for="deathText">Alert text</label>
    <textarea class="input" id="deathText" maxlength="300" style="min-height:90px">${esc(def)}</textarea>
    <div class="row-gap" style="margin-top:14px"><button class="btn danger" id="deathYes">ANNOUNCE DEATH</button><button class="btn ghost" data-close>CANCEL</button></div>`);
  $('#deathYes').onclick = () => {
    const text = $('#deathText').value.trim() || def;
    backend.update({ ['live/deaths/' + id]: backend.TS(), 'live/alert': { id: uid('a'), type: 'kill', text, ts: backend.TS() } });
    closeModal();
  };
}

/* ---------------- host: live render ---------------- */
function guestFor() {
  const m = {};
  for (const [key, cid] of Object.entries(HOST.assign || {})) {
    const [rid, plus] = key.split('#'); const r = S.rsvps[rid]; if (!r) continue;
    m[cid] = plus ? (r.plusOneName || (r.name + "'s guest")) : r.name;
  }
  return m;
}

  if (deathKey && store.get('termAck') !== deathKey) {
    sig = 'dead';
    html = `<div class="overlay fullmsg dead"><div class="box"><div class="k">KANE-OS · PERSONNEL STATUS UPDATE</div><h1>YOU HAVE BEEN<br>TERMINATED</h1>
      <p>You've been murdered. Stay where you are. When it feels right, collapse dramatically, and stay in character as the body until the host tells you otherwise.</p>
      <p style="color:var(--red2)">Don't reveal what your screen says to anyone.</p><button class="btn danger" id="termAck" style="margin-top:8px">ACKNOWLEDGE</button></div></div>`;
  } else if (c && c.killer && S.flags.killer && store.get('revealSeen') !== S.epoch) {
    sig = 'reveal';
    html = `<div class="overlay fullmsg reveal"><div class="box"><div class="k">CLEARANCE ELEVATED · FILE UNSEALED</div><h1>YOU ARE THE KILLER</h1>
      <div class="typed">${(c.killer.reveal || []).map(l => '&gt; ' + esc(l)).join('<br>')}</div>
      <p>Your full file is now unsealed. A Termination Directive is waiting for you. Keep your screen hidden. Stay warm. Stay calm.</p><button class="btn danger" id="revealAck">OPEN MY FILE</button></div></div>`;
  }
  patch(fm, sig, html);
  const ta = $('#termAck'); if (ta) ta.onclick = () => { store.set('termAck', deathKey); renderOverlays(); };
  const ra = $('#revealAck'); if (ra) ra.onclick = () => { store.set('revealSeen', S.epoch); renderOverlays(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
}
$('#bypassBtn').addEventListener('click', () => { ui.bypass = true; renderOverlays(); toast('HOST OVERRIDE', 'Lockdown bypassed on this device only.', 'ok'); });

boot();
</script>
</body>
</html>
